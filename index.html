// Modul qiyinligi: 1-modul aralash; 2-modul 1-modul natijasiga qarab qiyin yoki osonroq (adaptiv)
const TIER_MIX = { standard: [0.3, 0.4, 0.3], hard: [0.1, 0.35, 0.55], easy: [0.45, 0.4, 0.15] };
function tierList(n, basis) {
  const [e, m] = TIER_MIX[basis] || TIER_MIX.standard;
  const ne = Math.round(n * e), nm = Math.round(n * m);
  return [...Array(ne).fill("E"), ...Array(nm).fill("M"), ...Array(Math.max(0, n - ne - nm)).fill("H")];
}
const shuffleArr = (a) => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
function buildModule(mod, testId, diffPath) {
  const basis = mod.adaptive ? (diffPath === "hard" ? "hard" : "easy") : "standard";
  if (mod.kind === "math") {
    // Haqiqiy SAT'dagidek: mavzular aralash, savollar osondan qiyinga; bir xil mavzu ketma-ket kelmaydi
    const slots = shuffleArr(MATH_BLUEPRINT);
    for (let i = 1; i < slots.length; i++) if (slots[i][1] === slots[i - 1][1]) { const j = slots.findIndex((s, k) => k > i && s[1] !== slots[i - 1][1] && (k + 1 >= slots.length || true)); if (j > 0) [slots[i], slots[j]] = [slots[j], slots[i]]; }
    const tiers = tierList(slots.length, basis);
    return balanceAnswers(slots.map(([domain, skill], i) => {
      const isSPR = i > 1 && (i % 4 === 3 || i === slots.length - 1);
      return { n: i + 1, domain, skill, ...genMathUnseen(skill, isSPR, null, tiers[i]), passage: null };
    }));
  }
  // R&W: savol turlari tartibi haqiqiy SAT'dagidek, har bir tur ichida osondan qiyinga
  const tiers = shuffleArr(tierList(RW_BLUEPRINT.length, basis));
  const rank = { E: 0, M: 1, H: 2 };
  let start = 0;
  for (let i = 1; i <= RW_BLUEPRINT.length; i++) {
    if (i === RW_BLUEPRINT.length || RW_BLUEPRINT[i][1] !== RW_BLUEPRINT[start][1]) { const part = tiers.slice(start, i).sort((a, b) => rank[a] - rank[b]); tiers.splice(start, part.length, ...part); start = i; }
  }
  return balanceAnswers(RW_BLUEPRINT.map(([domain, skill], i) => {
    const v = pickUnseenRW(skill, tiers[i]);
    return { n: i + 1, domain, skill, type: "mc", difficulty: v.difficulty || TIER_NAME[tiers[i]], passage: v.passage, prompt: v.prompt, choices: v.choices, answer: v.answer, expl: v.expl, ...(v.chart ? { chart: v.chart } : {}) };
  }));
}
// Bir xil harfdagi to'g'ri javob ketma-ket 3 martadan ko'p kelmasin (haqiqiy SAT'dagidek aralash)
function balanceAnswers(qs) {
  let prev = -1, run = 0;
  return qs.map((q) => {
    if (q.type === "spr" || !q.choices) { prev = -1; run = 0; return q; }
    let out = q;
    if (q.answer === prev && run >= 2) {
      const n = q.choices.length; const target = (q.answer + 1 + Math.floor(Math.random() * (n - 1))) % n;
      const ch = [...q.choices]; [ch[q.answer], ch[target]] = [ch[target], ch[q.answer]];
      out = { ...q, choices: ch, answer: target };
    }
    run = out.answer === prev ? run + 1 : 1; prev = out.answer;
    return out;
  });
}
function buildModuleCached(mod, testId, diffPath) {
  if (mod.kind === "break") return [];
  const basis = mod.adaptive ? (diffPath || "easy") : "standard";
  const cacheKey = `sws_qcache_v5_${testId}_${mod.id}_${basis}`;
  const cached = loadLocal(cacheKey, null);
  if (cached) return cached;
  const fresh = buildModule(mod, testId, diffPath);
  saveLocal(cacheKey, fresh);
  return fresh;
}
// ---- Ball hisoblash (Bluebook'ga yaqin): savollar qiyinligiga qarab vaznli, 2-modul yo'nalishi hisobga olinadi ----
// Qiyin savol ko'proq, oson savol kamroq "og'irlik"ka ega. 2-modul oson bo'lsa, bo'lim uchun maksimal ball ~640.
const DIFF_W = { Easy: 1, Medium: 1.25, Hard: 1.6 };
function qWeight(q, mod, path) {
  if (q && DIFF_W[q.difficulty]) return DIFF_W[q.difficulty];
  if (mod && mod.adaptive) return path === "hard" ? 1.5 : 1;
  return 1.2;
}
function scaleSection(sec, routedHard, single) {
  const p = sec.w ? sec.wc / sec.w : 0;
  const curve = Math.pow(p, 1.05);
  const top = single || routedHard ? 800 : 640;
  return Math.max(200, Math.min(800, Math.round((200 + curve * (top - 200)) / 10) * 10));
}
function gradeTest(testId, responses, diffPath, mode) {
  const perDomain = {}; const perSection = { rw: { c: 0, t: 0, wc: 0, w: 0 }, math: { c: 0, t: 0, wc: 0, w: 0 } }; const wrong = []; const items = [];
  MODULES.filter((m) => m.kind !== "break" && (!mode || mode === "full" || m.kind === mode || m.id === mode)).forEach((mod) => {
    const basis = mod.id === "rw2" ? diffPath.rw1 : mod.id === "m2" ? diffPath.m1 : null;
    const qs = buildModuleCached(mod, testId, basis);
    qs.forEach((q, i) => {
      const r = responses[`${mod.id}-${i}`];
      const ok = q.type === "spr" ? sprOk(r, q.answer) : r === q.answer;
      perDomain[q.domain] = perDomain[q.domain] || { c: 0, t: 0 }; perDomain[q.domain].t++; if (ok) perDomain[q.domain].c++;
      if (!ok) wrong.push({ domain: q.domain, skill: q.skill, prompt: q.prompt, expl: q.expl, module: mod.label });
      items.push({ m: mod.label, n: i + 1, q, r: r === undefined ? null : r, ok: !!ok });
      const sec = mod.kind === "rw" ? "rw" : "math"; const w = qWeight(q, mod, basis);
      perSection[sec].t++; perSection[sec].w += w; if (ok) { perSection[sec].c++; perSection[sec].wc += w; }
    });
  });
  const raw = (x) => ({ c: x.c, t: x.t });
  const rwScore = scaleSection(perSection.rw, diffPath.rw1 === "hard");
  const mathScore = scaleSection(perSection.math, diffPath.m1 === "hard");
  const base = { perDomain, wrong, items };
  if (mode === "rw1") { const s1 = scaleSection(perSection.rw, false, true); return { ...base, mode: "rw", single: true, rwScore: s1, mathScore: null, total: s1, rwRaw: raw(perSection.rw), mathRaw: null }; }
  if (mode === "m1") { const s1 = scaleSection(perSection.math, false, true); return { ...base, mode: "math", single: true, rwScore: null, mathScore: s1, total: s1, rwRaw: null, mathRaw: raw(perSection.math) }; }
  if (mode === "rw") return { ...base, mode, rwScore, mathScore: null, total: rwScore, rwRaw: raw(perSection.rw), mathRaw: null };
  if (mode === "math") return { ...base, mode, rwScore: null, mathScore, total: mathScore, rwRaw: null, mathRaw: raw(perSection.math) };
  return { ...base, rwScore, mathScore, total: rwScore + mathScore, rwRaw: raw(perSection.rw), mathRaw: raw(perSection.math) };
}

function loadLocal(key, fallback) { try { const v = localStorage.getItem(nsKey(key)); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function saveLocal(key, value) { try { localStorage.setItem(nsKey(key), JSON.stringify(value)); } catch (e) {} }
function useIsMobile() {
  const [isMobile, setIsMobile] = useState(() => typeof window !== "undefined" && window.innerWidth <= 680);
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth <= 680);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  return isMobile;
}

  const [config, setConfig] = useState(getResponsiveConfig);
  const { baseIconSize, maxScale, effectWidth } = config;
  const minScale = 1.0;
  const baseSpacing = Math.max(4, baseIconSize * 0.1);

  useEffect(() => {
    const onResize = () => setConfig(getResponsiveConfig());
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const calcTargetScales = (mouseXPos) => {
    if (mouseXPos === null) return apps.map(() => minScale);
    return apps.map((_, i) => {
      const center = i * (baseIconSize + baseSpacing) + baseIconSize / 2;
      const minXb = mouseXPos - effectWidth / 2, maxXb = mouseXPos + effectWidth / 2;
      if (center < minXb || center > maxXb) return minScale;
      const theta = ((center - minXb) / effectWidth) * 2 * Math.PI;
      const capped = Math.min(Math.max(theta, 0), 2 * Math.PI);
      const factor = (1 - Math.cos(capped)) / 2;
      return minScale + factor * (maxScale - minScale);
    });
  };
  const calcPositions = (scales) => {
    let x = 0;
    return scales.map((s) => { const w = baseIconSize * s; const c = x + w / 2; x += w + baseSpacing; return c; });
  };

  useEffect(() => {
    const initScales = apps.map(() => minScale);
    setCurrentScales(initScales);
    setCurrentPositions(calcPositions(initScales));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [apps.length, baseIconSize]);

  useEffect(() => {
    const tick = () => {
      const targetScales = calcTargetScales(mouseX);
      const targetPositions = calcPositions(targetScales);
      const lerp = mouseX !== null ? 0.22 : 0.14;
      let stillMoving = mouseX !== null;
      setCurrentScales((prev) => prev.map((s, i) => { const d = targetScales[i] - s; if (Math.abs(d) > 0.002) stillMoving = true; return s + d * lerp; }));
      setCurrentPositions((prev) => prev.map((p, i) => { const d = targetPositions[i] - p; if (Math.abs(d) > 0.1) stillMoving = true; return p + d * lerp; }));
      if (stillMoving) animationFrameRef.current = requestAnimationFrame(tick);
      else animationFrameRef.current = null;
    };
    if (!animationFrameRef.current) animationFrameRef.current = requestAnimationFrame(tick);
    return () => { if (animationFrameRef.current) { cancelAnimationFrame(animationFrameRef.current); animationFrameRef.current = null; } };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [mouseX, baseIconSize]);

  const handleMouseMove = (e) => {
    const now = performance.now();
    if (now - lastMouseMoveTime.current < 16) return;
    lastMouseMoveTime.current = now;
    if (dockRef.current) {
      const rect = dockRef.current.getBoundingClientRect();
      const padding = Math.max(8, baseIconSize * 0.12);
      setMouseX(e.clientX - rect.left - padding);
    }
  };
  const handleMouseLeave = () => setMouseX(null);

  const bounce = (el, big) => {
    if (!el) return;
    const h = big ? -baseIconSize * 0.22 : -baseIconSize * 0.15;

    setTimeout(() => { el.style.transform = "translateY(0px)"; }, 180);
  };

  const contentWidth = currentPositions.length
    ? Math.max(...currentPositions.map((p, i) => p + (baseIconSize * currentScales[i]) / 2))
    : apps.length * (baseIconSize + baseSpacing) - baseSpacing;
  const padding = Math.max(8, baseIconSize * 0.12);

  return (
    <div ref={dockRef} className={className} onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave}
      style={{ width: `${contentWidth + padding * 2}px`, maxWidth: "calc(100vw - 24px)", overflowX: currentPositions.length > 6 ? "visible" : "visible", background: "rgba(22,32,77,0.85)", backdropFilter: "blur(10px)", borderRadius: Math.max(14, baseIconSize * 0.35), border: "1px solid rgba(255,255,255,0.14)", boxShadow: "0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12)", padding: `${padding}px` }}>
      <div style={{ position: "relative", height: baseIconSize, width: "100%" }}>
        {apps.map((app, i) => {
          const scale = currentScales[i] || 1, pos = currentPositions[i] || 0, size = baseIconSize * scale;
          const IconEl = app.icon;
          return (
            <div key={app.id} ref={(el) => { iconRefs.current[i] = el; }} title={app.name}
              onClick={() => { bounce(iconRefs.current[i], scale > 1.3); onAppClick(app.id); }}
              style={{ position: "absolute", left: pos - size / 2, bottom: 0, width: size, height: size, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", cursor: "pointer", zIndex: Math.round(scale * 10) }}>
              <div style={{ width: size, height: size, borderRadius: size * 0.28, background: app.id === activeId ? B.plum : "rgba(255,255,255,0.14)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: scale > 1.15 ? "0 6px 16px rgba(0,0,0,0.35)" : "none" }}>
                <IconEl size={size * 0.5} color="#fff" />
              </div>
              {app.id === activeId && <div style={{ position: "absolute", bottom: -6, width: Math.max(3, size * 0.08), height: Math.max(3, size * 0.08), borderRadius: "50%", background: "#fff", boxShadow: "0 0 4px rgba(0,0,0,0.4)" }} />}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function useAppleMotion(rootRef) {
  useEffect(() => {
    const root = rootRef.current; if (!root) return;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const items = root.querySelectorAll("[data-reveal]");
    if (reduce || !("IntersectionObserver" in window)) { items.forEach((el) => el.classList.add("sws-in")); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("sws-in"); io.unobserve(e.target); } });
    }, { threshold: 0.15, rootMargin: "0px 0px -8% 0px" });
    items.forEach((el) => io.observe(el));
    // Scroll bilan bog'langan effektlar: parallaks va "zoom-in" (Apple mahsulot sahifalaridagidek)
    const scroller = root.parentElement && root.parentElement.scrollHeight > root.parentElement.clientHeight + 1 ? root.parentElement : window;
    const par = root.querySelectorAll("[data-parallax]");
    const zoom = root.querySelectorAll("[data-zoom]");
    const header = root.querySelector("[data-glass]");
    let raf = 0;
    const tick = () => {
      raf = 0; const vh = window.innerHeight;
      par.forEach((el) => { const r = el.getBoundingClientRect(); const f = parseFloat(el.dataset.parallax) || 0.15; el.style.transform = `translate3d(0, ${((r.top + r.height / 2 - vh / 2) * -f).toFixed(1)}px, 0)`; });
      zoom.forEach((el) => {
        const r = el.getBoundingClientRect(); const p = Math.min(1, Math.max(0, (vh - r.top) / (vh * 0.75)));
        el.style.transform = `perspective(1400px) rotateX(${((1 - p) * 16).toFixed(2)}deg) scale(${(0.86 + 0.14 * p).toFixed(3)})`;
        el.style.opacity = (0.35 + 0.65 * p).toFixed(3);
      });
      if (header) { const y = scroller === window ? window.scrollY : scroller.scrollTop; header.style.boxShadow = y > 8 ? "0 8px 30px -18px rgba(22,32,77,0.35)" : "none"; }
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(tick); };
    tick();
    scroller.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => { io.disconnect(); scroller.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); if (raf) cancelAnimationFrame(raf); };
  }, []);
}

function CountUp({ to, duration = 1600 }) {
  const ref = useRef(null);
  const target = parseInt(String(to).replace(/\D/g, ""), 10) || 0;
  const [val, setVal] = useState(0);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    if (!("IntersectionObserver" in window)) { setVal(target); return; }
    let raf = 0;
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return; io.disconnect();
      const t0 = performance.now();
      const step = (t) => { const k = Math.min(1, (t - t0) / duration); setVal(Math.round(target * (1 - Math.pow(1 - k, 4)))); if (k < 1) raf = requestAnimationFrame(step); };
      raf = requestAnimationFrame(step);
    }, { threshold: 0.4 });
    io.observe(el);
    return () => { io.disconnect(); if (raf) cancelAnimationFrame(raf); };
  }, [target]);
  return <span ref={ref}>{val}</span>;
}

/* ============================================================
   CALCULATOR / GRAPHER
   On the real (Vercel) domain, the Desmos Graphing Calculator API
   loads normally and is used directly \u2014 the same tool the real
   Digital SAT provides. Desmos's script cannot load inside a
   published Claude artifact (its content-security policy only
   allows scripts from cdnjs/jsdelivr/tailwind/jquery CDNs), so a
   small self-built calculator + function grapher is kept as an
   automatic fallback there.
============================================================ */
function DesmosCalc({ onClose }) {
  const hostRef = useRef(null);
  const boxRef = useRef(null);
  const calcRef = useRef(null);
  // O'lcham: kichik → katta → ekranning yarmi (Bluebook'dagi "Expand" kabi). Burchagidan tortib ham kattalashtirish mumkin.
  const [size, setSize] = useState(() => loadLocal("sws_desmos_size", "large"));
  const [pos, setPos] = useState(null);
  useEffect(() => {
    if (!hostRef.current || !window.Desmos) return;
    calcRef.current = window.Desmos.GraphingCalculator(hostRef.current, {
      keypad: true, expressions: true, settingsMenu: false, zoomButtons: true,
      lockViewport: false, border: false, expressionsTopbar: true,
    });
    return () => { if (calcRef.current) { calcRef.current.destroy(); calcRef.current = null; } };
  }, []);
  useEffect(() => {
    if (!boxRef.current || typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(() => { try { calcRef.current && calcRef.current.resize(); } catch (e) {} });
    ro.observe(boxRef.current); return () => ro.disconnect();
  }, []);
  const phone = typeof window !== "undefined" && window.innerWidth < 700;
  const next = { small: "large", large: "half", half: "small" }[size] || "large";
  const setS = (v) => { setSize(v); setPos(null); saveLocal("sws_desmos_size", v); };
  const dims = phone ? { left: 8, right: 8, bottom: 8, height: size === "small" ? "45vh" : "75vh" }
    : size === "small" ? { right: 20, bottom: 20, width: 420, height: 460 }
    : size === "large" ? { right: 20, bottom: 20, width: "min(760px, 62vw)", height: "min(640px, 78vh)" }
    : { left: 12, top: 70, bottom: 12, width: "50vw" };
  const style = pos && !phone ? { left: pos.x, top: pos.y, width: dims.width, height: dims.height || "calc(100vh - 82px)" } : dims;
  const startDrag = (e) => {
    if (phone || !boxRef.current || e.target.closest("button")) return;
    const r = boxRef.current.getBoundingClientRect(); const dx = e.clientX - r.left, dy = e.clientY - r.top;
    const mv = (ev) => setPos({ x: Math.max(0, Math.min(window.innerWidth - 120, ev.clientX - dx)), y: Math.max(0, Math.min(window.innerHeight - 60, ev.clientY - dy)) });
    const up = () => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
  };
  const hb = { background: "rgba(255,255,255,0.14)", border: "none", color: "#fff", cursor: "pointer", borderRadius: 7, padding: "4px 9px", fontSize: 12, fontWeight: 700, fontFamily: FONT, display: "flex", alignItems: "center", gap: 4 };
  return (
    <div ref={boxRef} style={{ position: "fixed", ...style, background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, boxShadow: "0 12px 32px rgba(22,32,77,0.25)", zIndex: 200, fontFamily: FONT, overflow: "hidden", display: "flex", flexDirection: "column", resize: phone ? "none" : "both", minWidth: 320, minHeight: 320, maxWidth: "calc(100vw - 16px)", maxHeight: "calc(100vh - 16px)" }}>
      <div onPointerDown={startDrag} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, background: B.navy, color: "#fff", padding: "7px 10px 7px 14px", flexShrink: 0, cursor: phone ? "default" : "move", userSelect: "none" }}>
        <span style={{ fontSize: 12.5, fontWeight: 700 }}>Desmos kalkulyator</span>
        <span style={{ display: "flex", gap: 6, alignItems: "center" }}>
          <button onClick={() => setS(next)} title="O'lchamni o'zgartirish" style={hb}>{size === "half" ? "⤡ Kichraytirish" : "⤢ Kattalashtirish"}</button>
          <button onClick={onClose} title="Yopish" style={{ ...hb, background: "transparent" }}><X size={15} /></button>
        </span>
      </div>
      <div ref={hostRef} style={{ flex: 1, minHeight: 0 }} />
    </div>
  );
}

  const clear = () => { setExpr(""); setResult(""); };
  const backspace = () => setExpr((e) => e.slice(0, -1));
  const evaluate = () => {
    try {
      const clean = expr.replace(/\^/g, "**").replace(/π/g, "Math.PI").replace(/√/g, "Math.sqrt")
        .replace(/sin\(/g, "Math.sin(").replace(/cos\(/g, "Math.cos(").replace(/tan\(/g, "Math.tan(")
        .replace(/ln\(/g, "Math.log(").replace(/log\(/g, "Math.log10(");
      // eslint-disable-next-line no-new-func
      const val = Function(`"use strict"; return (${clean})`)();
      setResult(String(Math.round(val * 1e8) / 1e8));
    } catch (e) { setResult("Xato"); }
  };

  useEffect(() => {
    if (desmosReady || tab !== "graph" || !canvasRef.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#E2E4E8"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
    const scale = 20;
    let compiled;
    try {
      const clean = fn.replace(/\^/g, "**").replace(/π/g, "Math.PI")
        .replace(/sin\(/g, "Math.sin(").replace(/cos\(/g, "Math.cos(").replace(/tan\(/g, "Math.tan(")
        .replace(/sqrt\(/g, "Math.sqrt(").replace(/ln\(/g, "Math.log(");
      compiled = Function("x", `"use strict"; return (${clean});`);
    } catch (e) { return; }
    ctx.strokeStyle = "#00356B"; ctx.lineWidth = 2; ctx.beginPath();
    let first = true;
    for (let px = 0; px <= w; px++) {
      const x = (px - w / 2) / scale;
      let y;
      try { y = compiled(x); } catch (e) { y = NaN; }
      if (!isFinite(y)) { first = true; continue; }
      const py = h / 2 - y * scale;
      if (first) { ctx.moveTo(px, py); first = false; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  }, [tab, fn, desmosReady]);

  if (desmosReady) return <DesmosCalc onClose={onClose} />;

  return (
    <div style={{ position: "fixed", bottom: 20, right: 20, width: 300, background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, boxShadow: "0 12px 32px rgba(22,32,77,0.25)", zIndex: 200, fontFamily: FONT, overflow: "hidden" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: B.navy, color: "#fff", padding: "9px 14px" }}>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={() => setTab("calc")} style={{ background: tab === "calc" ? "rgba(255,255,255,0.2)" : "transparent", border: "none", color: "#fff", borderRadius: 6, padding: "4px 10px", fontSize: 12, cursor: "pointer", fontFamily: FONT }}>Kalkulyator</button>
          <button onClick={() => setTab("graph")} style={{ background: tab === "graph" ? "rgba(255,255,255,0.2)" : "transparent", border: "none", color: "#fff", borderRadius: 6, padding: "4px 10px", fontSize: 12, cursor: "pointer", fontFamily: FONT }}>Grafik</button>
        </div>
        <button onClick={onClose} style={{ background: "transparent", border: "none", color: "#fff", cursor: "pointer", display: "flex" }}><X size={15} /></button>
      </div>
      {tab === "calc" ? (
        <div style={{ padding: 12 }}>
          <div style={{ background: B.bg, borderRadius: 8, padding: "10px 12px", marginBottom: 8, minHeight: 44 }}>
            <div style={{ fontSize: 13, color: B.muted, minHeight: 16, wordBreak: "break-all" }}>{expr || "0"}</div>
            {result && <div style={{ fontSize: 17, fontWeight: 800, color: B.text }}>{result}</div>}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 5 }}>
            {["sin(", "cos(", "tan(", "ln(", "√("].map((k) => (
              <button key={k} onClick={() => press(k)} style={{ padding: "8px 0", fontSize: 11.5, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k.replace("(", "")}</button>
            ))}
            {["7", "8", "9", "/", "("].map((k) => (
              <button key={k} onClick={() => press(k)} style={{ padding: "10px 0", fontSize: 14, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k}</button>
            ))}
            {["4", "5", "6", "*", ")"].map((k) => (
              <button key={k} onClick={() => press(k)} style={{ padding: "10px 0", fontSize: 14, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k}</button>
            ))}
            {["1", "2", "3", "-", "^"].map((k) => (
              <button key={k} onClick={() => press(k)} style={{ padding: "10px 0", fontSize: 14, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k}</button>
            ))}
            {["0", ".", "π", "+", "⌫"].map((k) => (
              <button key={k} onClick={() => (k === "⌫" ? backspace() : press(k === "π" ? "π" : k))} style={{ padding: "10px 0", fontSize: 14, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k}</button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
            <button onClick={clear} style={{ flex: 1, padding: "9px 0", fontSize: 13, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer", fontWeight: 700 }}>C</button>
            <button onClick={evaluate} style={{ flex: 2, padding: "9px 0", fontSize: 13, border: "none", borderRadius: 6, background: B.plum, color: "#fff", cursor: "pointer", fontWeight: 700 }}>=</button>
          </div>
        </div>
      ) : (
        <div style={{ padding: 12 }}>
          <input value={fn} onChange={(e) => setFn(e.target.value)} placeholder="masalan: x^2 - 3x + 2"
            style={{ width: "100%", padding: "9px 11px", border: `1px solid ${B.border}`, borderRadius: 7, fontSize: 13, fontFamily: FONT, boxSizing: "border-box", marginBottom: 8 }} />
          <canvas ref={canvasRef} width={276} height={200} style={{ width: "100%", borderRadius: 8, border: `1px solid ${B.border}` }} />
          <div style={{ fontSize: 11, color: B.muted, marginTop: 6 }}>y = {fn.replace(/\^/g, "^")}</div>
        </div>
      )}
    </div>
  );
}

  const [stage, setStage] = useState(() => (S0 ? S0.stage : { type: "intro", modIdx: 0 }));

  const [seconds, setSeconds] = useState(() => (S0 ? S0.seconds || 0 : 0));
  const [diffPath, setDiffPath] = useState(() => (S0 ? S0.diffPath || {} : {}));

  const [timerHidden, setTimerHidden] = useState(false);
  // Annotate: passage ichida matnni belgilash (highlight). Har bir savol uchun [boshi, oxiri] oraliqlar
  const [annot, setAnnot] = useState(false);
  const [hl, setHl] = useState({});
  const passRef = useRef(null);
  const [split, setSplit] = useState(50);
  const splitRef = useRef(null);
  const studentName = loadLocal("sws_name", "") || "O'quvchi";
  // Rejim: to'liq test, faqat Reading & Writing yoki faqat Math
  const [mode, setMode] = useState(() => (S0 ? S0.mode || "full" : "full"));
  const mods = useMemo(() => (mode === "rw" ? MODULES.filter((m) => m.kind === "rw") : mode === "math" ? MODULES.filter((m) => m.kind === "math") : mode === "rw1" ? MODULES.filter((m) => m.id === "rw1") : mode === "m1" ? MODULES.filter((m) => m.id === "m1") : MODULES), [mode]);

  const mod = mods[stage.modIdx];
  const finishedRef = useRef(false);
  useEffect(() => {
    if (finishedRef.current) return;
    if (stage.type === "intro" && stage.modIdx === 0 && !Object.keys(responses).length) return;
    saveLocal("sws_resume", { test: { id: test.id, name: test.name }, stage, responses, marked, crossed, qIndex, seconds, diffPath, mode, started: startedRef.current, at: Date.now() });
  }, [stage, responses, marked, crossed, qIndex, diffPath, mode, Math.floor(seconds / 10)]);
  const questions = useMemo(() => {
    if (!mod || mod.kind === "break") return [];
    const basis = mod.id === "rw2" ? diffPath.rw1 : mod.id === "m2" ? diffPath.m1 : null;
    return buildModuleCached(mod, test.id, basis);
  }, [stage.modIdx, test.id, diffPath.rw1, diffPath.m1, mode]);

  useEffect(() => {
    if (stage.type !== "module" && stage.type !== "review" && stage.type !== "break") return;
    const t = setInterval(() => setSeconds((s) => (s > 0 ? s - 1 : 0)), 1000);
    return () => clearInterval(t);
  }, [stage]);

  const advance = () => {
    setNavOpen(false); setDirOpen(false); setMoreOpen(false); setStrikeMode(false);
    if (mod.kind !== "break") {
      let correct = 0;
      questions.forEach((q, i) => {
        const r = responses[`${mod.id}-${i}`];
        if (q.type === "spr") { if (sprOk(r, q.answer)) correct++; } else if (r === q.answer) correct++;
      });
      if (mod.id === "rw1" || mod.id === "m1") setDiffPath((d) => ({ ...d, [mod.id]: correct / questions.length >= 0.6 ? "hard" : "easy" }));

              )}
            </div>
            <div style={{ borderTop: `1px solid ${BB.line}`, padding: "16px 34px", display: "flex", justifyContent: "space-between", alignItems: "center", background: "#FAFAFB" }}>
              <span style={{ fontSize: 13.5, color: BB.muted }}>Vaqt "Boshlash" bosilganda ketadi</span>
              <BbButton primary onClick={() => { setSeconds(mod.minutes * 60); setQIndex(0); setStage({ type: "module", modIdx: stage.modIdx }); }}>Boshlash</BbButton>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- Break ---------- */
  if (stage.type === "break") {
    return (
      <div style={{ height: "100vh", display: "flex", flexDirection: "column", background: "#1B1D24", color: "#fff", fontFamily: BB.ui }}>
        <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 60, padding: 24, flexWrap: "wrap" }}>
          <div className="sws-fade-in" style={{ border: "1px solid #3A3D46", borderRadius: 16, padding: "30px 44px", textAlign: "center", minWidth: 280 }}>
            <div style={{ fontSize: 15, color: "#B9BCC6", marginBottom: 8 }}>Tanaffusdan qolgan vaqt</div>
            <div style={{ fontSize: 64, fontWeight: 800, fontVariantNumeric: "tabular-nums", letterSpacing: 1 }}>{fmt(seconds)}</div>
            <BbButton primary onClick={advance} style={{ marginTop: 18, background: "#FDDA24", color: BB.ink }}>Testni davom ettirish</BbButton>
          </div>
          <div style={{ maxWidth: 380 }}>
            <h2 style={{ fontSize: 26, fontWeight: 800, margin: "0 0 12px" }}>Tanaffus</h2>
            <p style={{ fontSize: 15, lineHeight: 1.7, color: "#D4D6DD", margin: "0 0 14px" }}>Reading and Writing bo'limi tugadi. Keyingi — Math bo'limi.</p>
            <ul style={{ fontSize: 14.5, lineHeight: 1.9, color: "#D4D6DD", paddingLeft: 18, margin: 0 }}>
              <li>Haqiqiy imtihonda qurilmani yopmang va boshqa ilovalarni ochmang.</li>
              <li>Suv iching, cho'zilib oling — 10 daqiqa tez o'tadi.</li>
              <li>Vaqt tugaganda Math bo'limi avtomatik boshlanadi.</li>
            </ul>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- Header / footer (module & review) ---------- */
  const header = (
    <>
      <div style={{ background: "#fff", height: 68, padding: "0 24px", display: "grid", gridTemplateColumns: "1fr auto 1fr", alignItems: "center", flexShrink: 0 }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 16.5, fontWeight: 700, color: BB.ink, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{mod.label}: {mod.section}</div>
          <button onClick={() => setDirOpen(true)} style={{ background: "transparent", border: "none", padding: 0, marginTop: 2, cursor: "pointer", fontFamily: BB.ui, fontSize: 14, color: BB.ink, display: "inline-flex", alignItems: "center", gap: 4 }}>Directions {BbSvg.caret(false)}</button>
          <span style={{ fontSize: 12.5, color: BB.muted, marginLeft: 12 }}>{questions.filter((q, i) => { const r = responses[`${mod.id}-${i}`]; return r !== undefined && r !== null && String(r).trim() !== ""; }).length}/{questions.length} javob berildi</span>
        </div>
        <div style={{ textAlign: "center" }}>
          {!timerHidden ? (
            <div className={lowTime ? "sws-timer-low" : ""} style={{ fontSize: 22, fontWeight: 800, fontVariantNumeric: "tabular-nums", color: lowTime ? BB.red : BB.ink, lineHeight: 1.1 }}>{fmt(seconds)}</div>
          ) : <div style={{ height: 24, display: "flex", alignItems: "center", justifyContent: "center" }}><Clock size={20} color={BB.ink} /></div>}
          <button onClick={() => setTimerHidden((v) => !v)} style={{ marginTop: 4, fontSize: 12, fontFamily: BB.ui, padding: "2px 12px", borderRadius: 999, border: `1px solid ${BB.ink}`, background: "#fff", cursor: "pointer", color: BB.ink }}>{timerHidden ? "Show" : "Hide"}</button>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 6 }}>
          {mod.kind === "rw" && (
            <button onClick={() => { setAnnot((v) => !v); if (!annot) swsToast("Matnni sichqoncha/barmoq bilan belgilang — sariq bo'lib qoladi. O'chirish uchun belgini bosing."); }} title="Annotate" style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, background: annot ? "#FFF3C4" : "transparent", border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontFamily: BB.ui, fontSize: 12.5, color: BB.ink }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={BB.ink} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11l-6 6v3h9l3-3" /><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4" /></svg>Annotate
            </button>
          )}
          {mod.kind === "math" && (
            <>
              <button onClick={() => setCalcOpen((v) => !v)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, background: calcOpen ? BB.blueSoft : "transparent", border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontFamily: BB.ui, fontSize: 12.5, color: BB.ink }}><Calculator size={18} color={BB.ink} />Calculator</button>
              <button onClick={() => setRefOpen(true)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, background: "transparent", border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontFamily: BB.ui, fontSize: 12.5, color: BB.ink }}>{BbSvg.ref}Reference</button>
            </>
          )}
          <div style={{ position: "relative" }}>
            <button onClick={() => setMoreOpen((v) => !v)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, background: moreOpen ? BB.bar : "transparent", border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontFamily: BB.ui, fontSize: 12.5, color: BB.ink }}>{BbSvg.more}More</button>
            {moreOpen && (
              <div style={{ position: "absolute", right: 0, top: "100%", marginTop: 6, background: "#fff", borderRadius: 10, boxShadow: "0 12px 32px rgba(0,0,0,0.2)", padding: 6, zIndex: 50, minWidth: 190 }}>
                <button onClick={() => { setMoreOpen(false); onExit(); }} style={{ width: "100%", textAlign: "left", background: "transparent", border: "none", padding: "10px 12px", borderRadius: 6, cursor: "pointer", fontFamily: BB.ui, fontSize: 14, color: BB.red }}>Testdan chiqish</button>
              </div>
            )}
          </div>
        </div>
      </div>
      <div style={bbDash} />
    </>
  );

  const footer = (leftBack, onNext, nextLabel, backDisabled) => (
    <>
      {stage.type === "module" && (
        <div style={{ background: "#fff", display: "flex", justifyContent: "center", gap: 4, padding: "8px 12px 6px", flexWrap: "wrap" }}>
          {questions.map((qq, i) => { const r = responses[`${mod.id}-${i}`]; const done = r !== undefined && r !== null && String(r).trim() !== ""; const cur = i === qIndex; const mk = marked[`${mod.id}-${i}`];
            return <button key={i} onClick={() => setQIndex(i)} title={`Savol ${i + 1}`} style={{ width: cur ? 18 : 9, height: 9, borderRadius: 9, border: mk ? "1.5px solid #1E5AA8" : "none", padding: 0, cursor: "pointer", background: cur ? BB.blue : done ? "#6B7CC9" : "#D5D8E2", transition: "width .2s" }} />; })}
        </div>
      )}
      <div style={bbDash} />
      <div style={{ background: "#fff", height: 68, padding: "0 24px", display: "grid", gridTemplateColumns: "1fr auto 1fr", alignItems: "center", flexShrink: 0, position: "relative" }}>
        <span style={{ fontSize: 15, fontWeight: 700, color: BB.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{studentName}</span>
        {stage.type === "module" ? (
          <button onClick={() => setNavOpen((v) => !v)} style={{ background: BB.ink, color: "#fff", border: "none", borderRadius: 8, padding: "9px 18px", fontFamily: BB.ui, fontSize: 14.5, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>Question {qIndex + 1} of {nQ} {BbSvg.caret(navOpen)}</button>
        ) : <span />}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          {!backDisabled && <BbButton primary onClick={leftBack}>Back</BbButton>}
          <BbButton primary onClick={onNext}>{nextLabel}</BbButton>
        </div>
      </div>
    </>
  );

  const modals = (
    <>
      {calcOpen && <CalcPanel onClose={() => setCalcOpen(false)} />}
      {refOpen && <ReferenceSheet onClose={() => setRefOpen(false)} />}
      {dirOpen && (
        <BbModal title="Directions" onClose={() => setDirOpen(false)}>
          <p style={{ fontSize: 15.5, lineHeight: 1.75, color: "#333", margin: 0 }}>{DIRECTIONS[mod.kind === "rw" ? "rw" : "math"]}</p>
          <div style={{ textAlign: "right", marginTop: 20 }}><BbButton primary onClick={() => setDirOpen(false)} style={{ background: "#FDDA24", color: BB.ink }}>Close</BbButton></div>
        </BbModal>
      )}
    </>
  );

  /* ---------- Review page ---------- */
  if (stage.type === "review") {
    return (
      <div style={{ height: "100vh", display: "flex", flexDirection: "column", background: "#fff", fontFamily: BB.ui }}>
        {header}
        <div style={{ flex: 1, overflowY: "auto", padding: "34px 20px", background: "#F7F7F8" }}>
          <div style={{ maxWidth: 760, margin: "0 auto" }}>
            <h2 style={{ fontSize: 30, fontWeight: 800, textAlign: "center", margin: "0 0 10px", color: BB.ink }}>Check Your Work</h2>
            <p style={{ textAlign: "center", fontSize: 15.5, color: "#333", lineHeight: 1.6, margin: "0 0 6px" }}>Haqiqiy imtihonda vaqt tugamaguncha keyingi modulga o'tolmaysiz.</p>
            <p style={{ textAlign: "center", fontSize: 15.5, color: "#333", lineHeight: 1.6, margin: "0 0 26px" }}>Quyidagi raqamni bossangiz, o'sha savolga qaytasiz.</p>
            <div className="sws-fade-in" style={{ background: "#fff", borderRadius: 14, boxShadow: "0 1px 2px rgba(0,0,0,0.05), 0 16px 40px -24px rgba(0,0,0,0.3)", padding: "22px 26px 30px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
                <span style={{ fontSize: 17, fontWeight: 700, color: BB.ink }}>{mod.label}: {mod.section} Questions</span>
                <span style={{ fontSize: 14, color: BB.muted }}>{questions.filter((_, i) => responses[`${mod.id}-${i}`] !== undefined && responses[`${mod.id}-${i}`] !== "").length} / {nQ} javob berildi</span>
              </div>
              <QuestionGrid mod={mod} questions={questions} responses={responses} marked={marked} current={-1} onPick={(i) => { setQIndex(i); setStage({ type: "module", modIdx: stage.modIdx }); }} />
            </div>
          </div>
        </div>
        {footer(() => setStage({ type: "module", modIdx: stage.modIdx }), advance, stage.modIdx === mods.length - 1 ? "Testni yakunlash" : "Next", false)}
        {modals}
      </div>
    );
  }

  /* ---------- Question screen ---------- */
  const q = questions[qIndex]; const key = `${mod.id}-${qIndex}`; const answered = responses[key]; const isLast = qIndex === nQ - 1;
  const isSpr = q.type === "spr";
  const ranges = hl[key] || [];
  const addHighlight = () => {
    if (!annot || !passRef.current) return;
    const sel = window.getSelection(); if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const r = sel.getRangeAt(0); const root = passRef.current;
    if (!root.contains(r.startContainer) || !root.contains(r.endContainer)) return;
    const off = (node, o) => { let n = 0; const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let t; while ((t = w.nextNode())) { if (t === node) return n + o; n += t.textContent.length; } return n; };
    let a = off(r.startContainer, r.startOffset), b = off(r.endContainer, r.endOffset); if (a > b) [a, b] = [b, a];
    if (b - a < 1) return;
    const merged = [...ranges, [a, b]].sort((x, y) => x[0] - y[0]).reduce((acc, cur) => { const last = acc[acc.length - 1]; if (last && cur[0] <= last[1]) last[1] = Math.max(last[1], cur[1]); else acc.push([...cur]); return acc; }, []);
    setHl((h) => ({ ...h, [key]: merged })); sel.removeAllRanges();
  };
  const passageNodes = (() => {
    const t = q.passage || ""; if (!ranges.length) return t;
    const out = []; let pos = 0;
    ranges.forEach(([a, b], i) => {
      if (a > pos) out.push(t.slice(pos, a));
      out.push(<mark key={i} onClick={() => annot && setHl((h) => ({ ...h, [key]: ranges.filter((_, k) => k !== i) }))} style={{ background: "#FFE58F", color: "inherit", borderRadius: 2, cursor: annot ? "pointer" : "text" }}>{t.slice(a, b)}</mark>);
      pos = b;
    });
    if (pos < t.length) out.push(t.slice(pos));
    return out;
  })();
  const leftContent = q.passage ? (
    <div ref={passRef} onMouseUp={addHighlight} onTouchEnd={() => setTimeout(addHighlight, 30)} style={{ fontFamily: BB.serif, fontSize: 17, lineHeight: 1.8, color: BB.ink, whiteSpace: "pre-line", cursor: annot ? "text" : "auto", outline: annot ? "2px dashed #F5C542" : "none", outlineOffset: 8, borderRadius: 4 }}>{passageNodes}</div>
  ) : isSpr ? (
    <div style={{ fontSize: 14.5, lineHeight: 1.7, color: "#333" }}>
      <div style={{ fontSize: 17, fontWeight: 700, color: BB.ink, marginBottom: 10 }}>Student-produced response directions</div>
      <ul style={{ paddingLeft: 18, margin: 0 }}>
        <li>Agar bir nechta to'g'ri javob topsangiz, faqat bittasini yozing.</li>
        <li>Musbat javob uchun 5 ta, manfiy javob uchun 6 ta belgigacha yozish mumkin (minus belgisi bilan).</li>
        <li>Javob kasr bo'lsa, oddiy kasr (3/4) yoki o'nli kasr (0.75) ko'rinishida yozing.</li>
        <li>Aralash sonlar (3 1/2 kabi) qabul qilinmaydi — 7/2 yoki 3.5 deb yozing.</li>
        <li>Belgilar ($, %) va vergul qo'ymang.</li>
      </ul>
    </div>
  ) : null;
  const twoPane = !!leftContent;

  const choiceList = isSpr ? (
    <div>
      <input value={answered ?? ""} onChange={(e) => setResponses((r) => ({ ...r, [key]: e.target.value.replace(/[^0-9./-]/g, "").slice(0, 12) }))} placeholder="" style={{ width: 180, padding: "10px 4px", border: "none", borderBottom: `2px solid ${BB.ink}`, fontSize: 22, fontFamily: BB.ui, outline: "none", background: "transparent" }} />
      <div style={{ marginTop: 18, fontSize: 15, color: BB.ink }}>Answer Preview: <b style={{ fontFamily: BB.serif, fontSize: 18 }}>{answered || ""}</b></div>
    </div>
  ) : q.choices.map((c, idx) => {
    const sel = answered === idx; const ck = `${key}-${idx}`; const out = !!crossed[ck];
    return (
      <div key={idx} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
        <div onClick={() => { if (out) setCrossed((x) => ({ ...x, [ck]: false })); setResponses((r) => ({ ...r, [key]: idx })); }} style={{ flex: 1, position: "relative", display: "flex", alignItems: "center", gap: 14, padding: "12px 16px", borderRadius: 10, border: sel ? `3px solid ${BB.blue}` : `1.5px solid ${BB.ink}`, margin: sel ? 0 : "1.5px", background: "#fff", cursor: "pointer", opacity: out ? 0.45 : 1, transition: "border-color .15s, box-shadow .15s", boxShadow: sel ? "0 0 0 3px rgba(50,77,199,0.12)" : "none" }}>
          <div style={{ width: 28, height: 28, borderRadius: "50%", flexShrink: 0, border: `2px solid ${sel ? BB.blue : BB.ink}`, background: sel ? BB.blue : "#fff", color: sel ? "#fff" : BB.ink, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 700, fontFamily: BB.ui }}>{String.fromCharCode(65 + idx)}</div>
          <span style={{ fontSize: 16, fontFamily: BB.serif, color: BB.ink, lineHeight: 1.5 }}>{mt(c)}</span>
          {out && <div style={{ position: "absolute", left: 8, right: 8, top: "50%", height: 2, background: BB.ink }} />}
        </div>
        {strikeMode && (
          <button onClick={() => setCrossed((x) => ({ ...x, [ck]: !x[ck] }))} title="Variantni chiqarib tashlash" style={{ width: 30, height: 30, flexShrink: 0, borderRadius: "50%", border: `1.5px solid ${BB.ink}`, background: "#fff", cursor: "pointer", position: "relative", fontFamily: BB.ui, fontSize: 12.5, fontWeight: 700, color: BB.ink }}>
            {out ? "Undo" : String.fromCharCode(65 + idx)}
            {!out && <span style={{ position: "absolute", left: 3, right: 3, top: "50%", height: 1.5, background: BB.ink }} />}
          </button>
        )}
      </div>
    );
  });

  const questionPane = (
    <div style={{ padding: "26px 34px 30px", maxWidth: twoPane ? "none" : 760, margin: twoPane ? 0 : "0 auto", width: "100%" }}>
      <div style={{ display: "flex", alignItems: "center", background: BB.bar, borderBottom: `2px dashed ${BB.line}`, marginBottom: 20, height: 40 }}>
        <div style={{ width: 40, height: 40, background: BB.ink, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 16, fontFamily: BB.ui }}>{qIndex + 1}</div>
        <button onClick={() => setMarked((m) => ({ ...m, [key]: !m[key] }))} style={{ marginLeft: 12, background: "transparent", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 14, fontFamily: BB.ui, color: BB.ink, fontWeight: marked[key] ? 700 : 500 }}>{BbSvg.bookmark(!!marked[key])} Mark for Review</button>
        {!isSpr && (
          <button onClick={() => setStrikeMode((v) => !v)} title="Variantlarni chiqarib tashlash" style={{ marginLeft: "auto", marginRight: 6, height: 28, padding: "0 8px", borderRadius: 4, cursor: "pointer", fontFamily: BB.ui, fontSize: 13, fontWeight: 700, textDecoration: "line-through", border: `1.5px solid ${strikeMode ? BB.blue : BB.ink}`, background: strikeMode ? BB.blue : "#fff", color: strikeMode ? "#fff" : BB.ink }}>ABC</button>
        )}
      </div>
      {q.chart && <QChart c={q.chart} />}
      <p style={{ fontSize: 16.5, fontFamily: BB.serif, lineHeight: 1.65, color: BB.ink, margin: "0 0 22px", whiteSpace: "pre-line" }}>{mt(q.prompt)}</p>
      {choiceList}
    </div>
  );

  return (
    <div style={{ height: "100vh", display: "flex", flexDirection: "column", fontFamily: BB.ui, background: "#fff", position: "relative" }}>
      {header}
      <div ref={splitRef} style={{ flex: 1, display: "flex", overflow: "hidden", minHeight: 0 }}>
        {twoPane ? (
          <>
            <div style={{ width: `${split}%`, padding: "30px 40px", overflowY: "auto" }}>{leftContent}</div>
            <div onMouseDown={() => splitRef.current.__start && splitRef.current.__start()} style={{ width: 14, flexShrink: 0, cursor: "col-resize", display: "flex", alignItems: "center", justifyContent: "center", background: "#fff" }}>
              <div style={{ width: 3, height: "100%", background: BB.line, position: "relative" }}>
                <div style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%,-50%)", width: 12, height: 36, borderRadius: 6, background: BB.ink, display: "flex", alignItems: "center", justifyContent: "center" }}><span style={{ width: 2, height: 16, borderLeft: "1.5px solid #fff", borderRight: "1.5px solid #fff", boxSizing: "content-box", paddingLeft: 1 }} /></div>
              </div>
            </div>
            <div style={{ flex: 1, overflowY: "auto" }}>{questionPane}</div>
          </>
        ) : <div style={{ flex: 1, overflowY: "auto" }}>{questionPane}</div>}
      </div>
      {footer(() => setQIndex((i) => Math.max(0, i - 1)), () => (isLast ? setStage({ type: "review", modIdx: stage.modIdx }) : setQIndex((i) => i + 1)), "Next", qIndex === 0)}
      {navOpen && (
        <>
          <div onClick={() => setNavOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 40 }} />
          <div style={{ position: "absolute", bottom: 80, left: 0, right: 0, display: "flex", justifyContent: "center", zIndex: 41, pointerEvents: "none" }}>
          <div className="sws-fade-in" style={{ pointerEvents: "auto", width: 600, maxWidth: "94vw", background: "#fff", borderRadius: 12, boxShadow: "0 18px 50px rgba(0,0,0,0.28)", padding: "18px 24px 22px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <span style={{ fontSize: 16, fontWeight: 700, color: BB.ink }}>{mod.label}: {mod.section} Questions</span>
              <button onClick={() => setNavOpen(false)} style={{ background: "transparent", border: "none", cursor: "pointer", display: "flex", color: BB.ink }}><X size={18} /></button>
            </div>
            <QuestionGrid mod={mod} questions={questions} responses={responses} marked={marked} current={qIndex} onPick={(i) => { setQIndex(i); setNavOpen(false); }} />
            <div style={{ textAlign: "center", marginTop: 22 }}><BbButton onClick={() => { setNavOpen(false); setStage({ type: "review", modIdx: stage.modIdx }); }} style={{ color: BB.blue, borderColor: BB.blue }}>Go to Review Page</BbButton></div>
          </div>
          </div>
        </>
      )}
      {modals}
    </div>
  );
}

// Bepul tarifda: bo'lim ko'rinadi, lekin xira — Premium'da to'liq ochiladi
function PremiumLock({ children, title, height = 230, reason = "analysis", note = "Premium'da to'liq ochiladi" }) {
  const sws = useSws();
  if (isPremium()) return children;
  return (
    <div style={{ position: "relative", maxHeight: height, overflow: "hidden", borderRadius: 20 }}>
      <div style={{ filter: "blur(5px)", pointerEvents: "none", userSelect: "none" }}>{children}</div>
      <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(246,247,252,0.25), rgba(246,247,252,0.92))", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
        <div style={{ background: "#fff", borderRadius: 18, padding: "18px 20px", textAlign: "center", boxShadow: "0 20px 44px -22px rgba(22,32,77,0.45)", maxWidth: 360 }}>
          <div style={{ fontSize: 26 }}>🔒</div>
          <div style={{ fontSize: 16, fontWeight: 900, margin: "6px 0 4px" }}>{title}</div>
          <div style={{ fontSize: 13.5, color: B.muted, marginBottom: 12 }}>{note}</div>
          <button onClick={() => swsOpenPaywall(reason)} style={{ background: B.gold, color: B.navy, border: "none", borderRadius: 12, padding: "10px 20px", fontSize: 14.5, fontWeight: 900, cursor: "pointer", fontFamily: FONT }}>💎 Premium — {PRICE.premium} so'm</button>
        </div>

  );
}
// ---- Bluebook uslubidagi test tahlili: har bir savol, sizning javobingiz, to'g'ri javob, izoh va AI batafsil tahlil ----
function strHash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const reviewKey = (q) => "sws_rev_" + strHash([q.passage || "", q.prompt || "", (q.choices || []).join("|"), String(q.answer)].join("#"));
async function fetchAiReview(q, r) {
  const k = reviewKey(q); const cached = loadLocal(k, null); if (cached) return cached;

const DIFF_TIER = { Easy: "E", Medium: "M", Hard: "H" };
function buildTailored(items, n = 10) {
  const wrong = items.filter((x) => !x.ok);
  const src = wrong.length ? wrong : items;
  const bySkill = {};
  src.forEach((x) => { const k = (x.q.domain && /Math|Algebra|Geometry|Problem-Solving/.test(x.q.domain) ? "math" : "rw") + "|" + x.q.skill; bySkill[k] = bySkill[k] || { kind: k.split("|")[0], skill: x.q.skill, n: 0, diffs: [] }; bySkill[k].n++; bySkill[k].diffs.push(x.q.difficulty); });

    }

}

const POOL_TOTAL = 500;
const diffForIndex = (i, total) => (i < total / 3 ? "Easy" : i < (2 * total) / 3 ? "Medium" : "Hard");
function genSkillQuestion(domain, skill, index) {
  const difficulty = diffForIndex(index, POOL_TOTAL);
  if (domain.kind === "math") {
    const [gen, ts] = MATH_SKILL_TEMPLATES[skill];
    const g = genMathUnseen(gen, false, ts[Math.floor(Math.random() * ts.length)]);
    return { domain: domain.d, skill, passage: null, ...g, difficulty: g.difficulty || difficulty };
  }
  const v = pickUnseenRW(skill);
  return { domain: domain.d, skill, difficulty: v.difficulty || difficulty, type: "mc", passage: v.passage, prompt: v.prompt, choices: v.choices, answer: v.answer, expl: v.expl, ...(v.chart ? { chart: v.chart } : {}) };
}
function genBankQuestion(domain, index) {
  const difficulty = diffForIndex(index, POOL_TOTAL);
  if (domain.kind === "math") {
    return genSkillQuestion(domain, domain.skills[Math.floor(Math.random() * domain.skills.length)], index);
  }
  const skill = domain.skills[Math.floor(Math.random() * domain.skills.length)];
  const v = pickUnseenRW(skill);
  return { domain: domain.d, skill, difficulty: v.difficulty || difficulty, type: "mc", passage: v.passage, prompt: v.prompt, choices: v.choices, answer: v.answer, expl: v.expl, ...(v.chart ? { chart: v.chart } : {}) };
}
// Savollardagi grafiklar (chiziqli grafik, scatterplot, parabola, ustunli diagramma) — SVG
// Darajalarni (x^2, 2^(t/3)) haqiqiy SAT'dagidek yuqori indeks qilib ko'rsatamiz — "^" belgisi chiqmasin
function mt(s) {
  if (typeof s !== "string" || s.indexOf("^") < 0) return s;
  const out = []; const re = /\^(\([^()]*\)|[A-Za-z0-9.]+)/g; let last = 0, m, k = 0;
  while ((m = re.exec(s))) {
    out.push(s.slice(last, m.index));
    let e = m[1]; if (e[0] === "(" && !/[+−-]/.test(e.slice(2, -1))) e = e.slice(1, -1);
    out.push(<sup key={k++} style={{ fontSize: "0.72em", lineHeight: 0, verticalAlign: "0.55em" }}>{e}</sup>);
    last = re.lastIndex;
  }
  out.push(s.slice(last)); return out;
}
function QChart({ c }) {
  if (!c) return null;
  const W = 380, H = 270, L = 48, R = 14, T = 14, Bm = 40;
  const pw = W - L - R, ph = H - T - Bm;
  if (c.type === "geo") {
    return (
      <div style={{ margin: "0 auto 16px", maxWidth: 380 }}>
        <svg viewBox="0 0 300 220" style={{ width: "100%", display: "block", fontFamily: "Georgia, 'Times New Roman', serif" }}>
          {(c.circles || []).map(([cx, cy, r], i) => <circle key={"c" + i} cx={cx} cy={cy} r={r} fill="none" stroke="#222" strokeWidth="1.6" />)}
          {(c.segs || []).map(([x1, y1, x2, y2, dash], i) => <line key={"s" + i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#222" strokeWidth="1.6" strokeDasharray={dash ? "5 4" : undefined} />)}
          {(c.right || []).map(([x, y, dx, dy], i) => <polyline key={"r" + i} points={`${x + dx},${y} ${x + dx},${y + dy} ${x},${y + dy}`} fill="none" stroke="#222" strokeWidth="1.3" />)}
          {(c.dots || []).map(([x, y], i) => <circle key={"d" + i} cx={x} cy={y} r="2.6" fill="#222" />)}
          {(c.texts || []).map(([x, y, t, it], i) => <text key={"t" + i} x={x} y={y} fontSize="14" textAnchor="middle" fontStyle={it ? "italic" : "normal"} fill="#111">{t}</text>)}
        </svg>
        {c.note && <div style={{ fontSize: 12.5, color: "#555", textAlign: "center", fontStyle: "italic" }}>{c.note}</div>}
      </div>
    );
  }
  if (c.type === "table") {
    return (
      <div style={{ margin: "0 auto 16px", maxWidth: 460, overflowX: "auto" }}>
        {c.title && <div style={{ fontSize: 13.5, fontWeight: 700, textAlign: "center", marginBottom: 6 }}>{c.title}</div>}
        <table style={{ borderCollapse: "collapse", width: "100%", fontSize: 14, fontFamily: "Georgia, 'Times New Roman', serif" }}>
          <thead><tr>{c.head.map((h, i) => <th key={i} style={{ border: "1px solid #444", padding: "6px 10px", background: "#F1F3F6", fontWeight: 700 }}>{h}</th>)}</tr></thead>
          <tbody>{c.rows.map((r, i) => <tr key={i}>{r.map((v, j) => <td key={j} style={{ border: "1px solid #444", padding: "6px 10px", textAlign: j === 0 ? "left" : "center", fontWeight: j === 0 ? 600 : 400 }}>{v}</td>)}</tr>)}</tbody>
        </table>
      </div>
    );
  }
  if (c.type === "lineCat") {
    const series = c.series, n = c.labels.length, yMin0 = c.yMin || 0, maxV = c.yMax, step = c.yStep;
    const X = (i) => L + 18 + ((pw - 36) * i) / Math.max(1, n - 1), Y = (v) => T + ph - ((v - yMin0) / (maxV - yMin0)) * ph;
    const cols = ["#3B5BDB", "#E8547C", "#1C9A5B"], shapes = ["circle", "square", "tri"];
    const ticksY = []; for (let v = yMin0; v <= maxV + 1e-9; v += step) ticksY.push(Math.round(v * 100) / 100);
    return (
      <svg viewBox={`0 0 ${W} ${H + 18}`} style={{ width: "100%", maxWidth: 440, display: "block", margin: "0 auto 16px", fontFamily: "Arial, sans-serif" }}>
        {c.title && <text x={W / 2} y={11} textAnchor="middle" fontSize="11.5" fontWeight="700" fill="#222">{c.title}</text>}
        {ticksY.map((v) => <g key={v}><line x1={L} x2={W - R} y1={Y(v)} y2={Y(v)} stroke="#E3E3E3" /><text x={L - 6} y={Y(v) + 4} fontSize="10" textAnchor="end" fill="#444">{v}</text></g>)}
        <line x1={L} x2={L} y1={T} y2={T + ph} stroke="#333" /><line x1={L} x2={W - R} y1={T + ph} y2={T + ph} stroke="#333" />
        {c.labels.map((lab, i) => <text key={lab} x={X(i)} y={T + ph + 14} fontSize="10" textAnchor="middle" fill="#333">{lab}</text>)}
        {series.map((s, k) => (
          <g key={k}>
            <polyline points={s.values.map((v, i) => `${X(i)},${Y(v)}`).join(" ")} fill="none" stroke={cols[k]} strokeWidth="2" />
            {s.values.map((v, i) => shapes[k] === "square" ? <rect key={i} x={X(i) - 3.5} y={Y(v) - 3.5} width="7" height="7" fill={cols[k]} /> : shapes[k] === "tri" ? <polygon key={i} points={`${X(i)},${Y(v) - 4.5} ${X(i) - 4.5},${Y(v) + 3.5} ${X(i) + 4.5},${Y(v) + 3.5}`} fill={cols[k]} /> : <circle key={i} cx={X(i)} cy={Y(v)} r="3.5" fill={cols[k]} />)}
          </g>

function todayStr() { return new Date().toISOString().slice(0, 10); }
function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); }
function getClientId() {
  let id = loadLocal("sws_client_id", null);
  if (!id) { id = "u" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); saveLocal("sws_client_id", id); }
  return id;
}
function fmtMinutes(sec) {
  const m = Math.floor(sec / 60);
  if (m < 60) return `${m} daq`;
  return `${Math.floor(m / 60)} soat ${m % 60} daq`;
}

/* ============================================================

============================================================ */
function loadSaved() { return loadLocal("sws_saved", []); }
function addSaved(item) {
  const list = loadSaved();
  if (list.some((x) => x.prompt === item.prompt)) return;
  list.unshift({ ...item, savedAt: Date.now() });
  saveLocal("sws_saved", list.slice(0, 200));
}
function removeSaved(prompt) { saveLocal("sws_saved", loadSaved().filter((x) => x.prompt !== prompt)); }

/* ============================================================
   DRILLS — short timed mini-practice (5 questions / 5 minutes)
============================================================ */
const DRILL_MODES = [
  { id: "mix", title: "Aralash drill", sub: "R&W + Math", emoji: "⚡", grad: ["#00356B", "#1E5AA8"] },
  { id: "rw", title: "Reading & Writing", sub: "Grammatika, lug'at, matn", emoji: "📖", grad: ["#2B5BD7", "#6B8CFF"] },
  { id: "math", title: "Math", sub: "Algebra, funksiyalar, geometriya", emoji: "📐", grad: ["#0E9F6E", "#36C28E"] },
];
function Drill({ mode, onExit }) {
  const [questions] = useState(() => Array.from({ length: 5 }).map((_, k) => {
    const pool = BANK_DOMAINS.filter((d) => mode === "mix" ? true : d.kind === mode);
    const dm = mode === "mix" ? pool.filter((d) => d.kind === (k % 2 ? "math" : "rw"))[Math.floor(Math.random() * 4)] : pool[Math.floor(Math.random() * pool.length)];
    return genBankQuestion(dm, Math.floor(Math.random() * POOL_TOTAL));
  }));
  const TOTAL = 300;
  const [i, setI] = useState(0);
  const [picked, setPicked] = useState(null);
  const [spr, setSpr] = useState("");
  const [log, setLog] = useState([]);
  const [seconds, setSeconds] = useState(TOTAL);
  const [done, setDone] = useState(false);
  const qStart = useRef(Date.now());
  useEffect(() => {
    if (done) return;
    const t = setInterval(() => setSeconds((s) => { if (s <= 1) { setDone(true); return 0; } return s - 1; }), 1000);
    return () => clearInterval(t);
  }, [done]);
  useEffect(() => { if (done) { const st = loadLocal("sws_drill_stats", { runs: 0, best: 0, total: 0, correct: 0 }); const sc = log.filter((x) => x.ok).length; saveLocal("sws_drill_stats", { runs: st.runs + 1, best: Math.max(st.best, sc), total: st.total + log.length, correct: st.correct + sc, last: todayStr() }); flushSeen(); } }, [done]);
  const q = questions[i];
  const ok = (v) => (q.type === "spr" ? sprOk(v, q.answer) : v === q.answer);
  const choose = (v) => { if (picked !== null) return; setPicked(v); setLog((l) => [...l, { q, v, ok: ok(v), sec: Math.round((Date.now() - qStart.current) / 1000) }]); if (!ok(v)) addSaved({ ...q, mistake: true }); };
  const next = () => { if (i === questions.length - 1) { setDone(true); return; } setI((x) => x + 1); setPicked(null); setSpr(""); qStart.current = Date.now(); };
  const m = DRILL_MODES.find((x) => x.id === mode);
  const R = 26, C = 2 * Math.PI * R;
  if (done) {
    const sc = log.filter((x) => x.ok).length; const pct = Math.round((sc / questions.length) * 100);
    return (
      <div className="sws-fade-in" style={{ maxWidth: 680, margin: "0 auto" }}>
        <div style={{ background: `linear-gradient(135deg, ${m.grad[0]}, ${m.grad[1]})`, borderRadius: 28, padding: "30px 26px", color: "#fff", textAlign: "center", marginBottom: 16, position: "relative", overflow: "hidden" }}>
          <div style={{ position: "absolute", width: 220, height: 220, borderRadius: "50%", background: "rgba(255,255,255,0.12)", top: -80, right: -60 }} />
          <div style={{ fontSize: 44 }}>{pct === 100 ? "🏆" : pct >= 60 ? "🎉" : "💪"}</div>
          <div style={{ fontSize: 26, fontWeight: 900, margin: "6px 0 2px" }}>{sc} / {questions.length} to'g'ri</div>
          <div style={{ fontSize: 15, opacity: 0.9 }}>{fmt(TOTAL - seconds)} ichida · {pct === 100 ? "Mukammal!" : pct >= 60 ? "Zo'r natija!" : "Ertaga yana urinib ko'ring!"}</div>
        </div>
        {questions.map((qq, k) => { const L = log[k]; return (
          <details key={k} style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 16, padding: "12px 16px", marginBottom: 8 }}>
            <summary style={{ cursor: "pointer", display: "flex", alignItems: "center", gap: 10, listStyle: "none", fontSize: 15 }}>
              <span style={{ width: 26, height: 26, borderRadius: "50%", display: "inline-flex", alignItems: "center", justifyContent: "center", fontWeight: 900, background: !L ? B.bg : L.ok ? "#E6F6EE" : "#FDECF1", color: !L ? B.muted : L.ok ? B.green : B.rose }}>{!L ? "–" : L.ok ? "✓" : "✗"}</span>
              <span style={{ flex: 1 }}>{k + 1}. {qq.skill}</span>{L && <span style={{ fontSize: 13, color: B.muted }}>{L.sec}s</span>}
            </summary>
            <div style={{ marginTop: 8, fontSize: 14.5, lineHeight: 1.6 }}>
              {qq.chart && <QChart c={qq.chart} />}
              <div style={{ whiteSpace: "pre-line", marginBottom: 6 }}>{mt(qq.prompt)}</div>
              <div>To'g'ri javob: <b>{qq.type === "spr" ? qq.answer : `${String.fromCharCode(65 + qq.answer)}) ${qq.choices[qq.answer]}`}</b></div>
              {qq.expl && <div style={{ marginTop: 6, background: B.bg, borderRadius: 10, padding: "8px 12px" }}>{mt(qq.expl)}</div>}
            </div>
          </details>
        ); })}
        <div style={{ display: "flex", gap: 10, justifyContent: "center", marginTop: 14 }}>
          <button onClick={onExit} style={{ background: B.plum, color: "#fff", border: "none", borderRadius: 14, padding: "12px 28px", fontSize: 15.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>Tayyor</button>
        </div>
      </div>
    );
  }
  return (
    <div style={{ maxWidth: 720, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <button onClick={onExit} style={{ background: "transparent", border: "none", color: B.muted, cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 15.5, fontFamily: FONT }}><ChevronLeft size={16} /> Chiqish</button>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ position: "relative", width: 62, height: 62 }}>

const DAILY_MATH = ["Linear equations & systems", "Nonlinear functions", "Ratios, rates, data", "Lines, angles, circles"];
function buildDaily(date) {
  const rng = mulberry32(hashStr("daily|" + date));
  const rwSkills = [...new Set(RW_BLUEPRINT.map(([, s]) => s))];
  const out = [];
  for (let i = 0; i < 5; i++) {
    const skill = rwSkills[Math.floor(rng() * rwSkills.length)]; const all = rwAll(skill); if (!all.length) continue;
    const src = all[Math.floor(rng() * all.length)]; const dom = (RW_BLUEPRINT.find(([, s]) => s === skill) || [""])[0];
    let q = { ...src };
    if (!src.fixed && !src.ai) { const order = src.choices.map((_, k) => k); for (let k = order.length - 1; k > 0; k--) { const j = Math.floor(rng() * (k + 1)); [order[k], order[j]] = [order[j], order[k]]; } q = { ...src, choices: order.map((k) => src.choices[k]), answer: order.indexOf(src.answer) }; }
    out.push({ ...q, type: "mc", skill, domain: dom });
  }

  });
  return out;
}

function MiniLine({ vals, max, min = 0, color = B.plum, h = 150, labels }) {
  const W = 520, H = h, P = 26;
  if (!vals.length) return null;
  const X = (i) => P + ((W - 2 * P) * i) / Math.max(1, vals.length - 1), Y = (v) => H - P - ((v - min) / Math.max(1, max - min)) * (H - 2 * P);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block" }}>
      {[0, 0.5, 1].map((f) => <line key={f} x1={P} x2={W - P} y1={Y(min + f * (max - min))} y2={Y(min + f * (max - min))} stroke="#EEF1F5" />)}
      <polyline points={vals.map((v, i) => `${X(i)},${Y(v)}`).join(" ")} fill="none" stroke={color} strokeWidth="3" strokeLinejoin="round" />
      {vals.map((v, i) => <g key={i}><circle cx={X(i)} cy={Y(v)} r="4.5" fill="#fff" stroke={color} strokeWidth="2.5" /><text x={X(i)} y={Y(v) - 10} fontSize="12" textAnchor="middle" fill={B.text} fontWeight="700">{v}</text>{labels && <text x={X(i)} y={H - 6} fontSize="11" textAnchor="middle" fill={B.muted}>{labels[i]}</text>}</g>)}
    </svg>
  );
}
function MiniBars({ vals, labels, color = B.plum, h = 150, fmt = (v) => v }) {
  const W = 520, H = h, P = 22, max = Math.max(1, ...vals); const bw = (W - 2 * P) / vals.length;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block" }}>
      {vals.map((v, i) => { const bh = (v / max) * (H - 2 * P - 8); return <g key={i}><rect x={P + i * bw + bw * 0.2} y={H - P - bh} width={bw * 0.6} height={Math.max(2, bh)} rx="5" fill={i === vals.length - 1 ? color : color + "88"} />{v > 0 && <text x={P + i * bw + bw / 2} y={H - P - bh - 5} fontSize="11.5" textAnchor="middle" fill={B.text} fontWeight="700">{fmt(v)}</text>}<text x={P + i * bw + bw / 2} y={H - 5} fontSize="11" textAnchor="middle" fill={B.muted}>{labels[i]}</text></g>; })}
    </svg>
  );
}

}

/* ============================================================
   ONBOARDING — personalized plan setup (target score, exam date, weak areas)
============================================================ */
function Onboarding({ onDone }) {
  const [step, setStep] = useState(0);
  const [name, setName] = useState(() => (SWS.user && SWS.user.first_name) || (SWS.me && SWS.me.profile && SWS.me.profile.tgName) || "");
  const [target, setTarget] = useState(1400);
  const [monthsAway, setMonthsAway] = useState(3);
  const [weak, setWeak] = useState([]);
  const steps = ["Ism", "Maqsad", "Muddat", "Zaif tomonlar", "Reja"];

  const toggleWeak = (d) => setWeak((w) => (w.includes(d) ? w.filter((x) => x !== d) : [...w, d]));
  const suggestedGoal = monthsAway <= 1 ? 75 : monthsAway <= 2 ? 60 : monthsAway <= 3 ? 45 : 30;
  const examDate = new Date(); examDate.setMonth(examDate.getMonth() + monthsAway);

  const finish = () => {
    saveLocal("sws_name", name);
    saveLocal("sws_goal", suggestedGoal);
    saveLocal("sws_target_score", target);
    saveLocal("sws_exam_date", examDate.toISOString());
    saveLocal("sws_weak_areas", weak);
    saveLocal("sws_onboarded", true);
    swsSaveProfile({ onboarded: true, name, goal: suggestedGoal, target, examDate: examDate.toISOString(), weak });
    onDone();
  };

  const domainOptions = ["Craft and Structure", "Information and Ideas", "Standard English Conventions", "Expression of Ideas", "Algebra", "Advanced Math", "Problem-Solving and Data Analysis", "Geometry and Trigonometry"];

  return (
    <div className="sws-app" style={{ minHeight: "100vh", background: B.bg, fontFamily: FONT, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div className="sws-fade-in" style={{ width: "100%", maxWidth: 560, background: "#fff", borderRadius: 28, padding: 40, boxShadow: "0 1px 2px rgba(22,32,77,0.04), 0 30px 60px -30px rgba(22,32,77,0.28)" }}>
        <div style={{ display: "flex", gap: 6, marginBottom: 24 }}>
          {steps.map((_, i) => <div key={i} style={{ flex: 1, height: 4, borderRadius: 3, background: i <= step ? B.plum : B.bg }} />)}
        </div>

        {step === 0 && (
          <div style={{ textAlign: "center" }}>
            <Mascot size={64} />
            <h2 style={{ fontSize: 23, fontWeight: 800, margin: "16px 0 6px" }}>Keling, tanishaylik</h2>
            <p style={{ fontSize: 15, color: B.muted, marginBottom: 20 }}>Shaxsiy reja tuzish uchun bir necha savol beramiz.</p>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Ismingiz" style={{ width: "100%", padding: "12px 16px", border: `1px solid ${B.border}`, borderRadius: 12, fontSize: 16.5, fontFamily: FONT, boxSizing: "border-box", textAlign: "center" }} />
          </div>
        )}

        {step === 1 && (
          <div>
            <h2 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 6px", textAlign: "center" }}>Maqsad balingiz nechi?</h2>
            <p style={{ fontSize: 15, color: B.muted, marginBottom: 20, textAlign: "center" }}>Bu reja va tavsiyalarni moslashtirishga yordam beradi</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
              {[1200, 1300, 1400, 1450, 1500, 1550].map((s) => (
                <button key={s} onClick={() => setTarget(s)} style={{ padding: "14px 0", borderRadius: 16, border: `2px solid ${target === s ? B.plum : B.border}`, background: target === s ? "#E8EFF8" : "#fff", color: target === s ? B.plum : B.text, cursor: "pointer", fontFamily: FONT, fontSize: 17.5, fontWeight: 800 }}>{s}</button>
              ))}
            </div>
          </div>
        )}

        {step === 2 && (
          <div>
            <h2 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 6px", textAlign: "center" }}>Imtihoningiz qachon?</h2>
            <p style={{ fontSize: 15, color: B.muted, marginBottom: 20, textAlign: "center" }}>Kunlik mashq maqsadingizni shunga moslab beramiz</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {[[1, "1 oydan kam"], [2, "~2 oy"], [3, "~3 oy"], [6, "~6 oy"], [12, "Hali bilmayman"]].map(([m, l]) => (
                <button key={m} onClick={() => setMonthsAway(m)} style={{ padding: "13px 18px", borderRadius: 12, border: `2px solid ${monthsAway === m ? B.plum : B.border}`, background: monthsAway === m ? "#E8EFF8" : "#fff", color: monthsAway === m ? B.plum : B.text, cursor: "pointer", fontFamily: FONT, fontSize: 15.5, fontWeight: 700, textAlign: "left" }}>{l}</button>
              ))}
            </div>
          </div>
        )}

        {step === 3 && (
          <div>
            <h2 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 6px", textAlign: "center" }}>Qaysi mavzular qiyinroq?</h2>
            <p style={{ fontSize: 15, color: B.muted, marginBottom: 20, textAlign: "center" }}>Bir nechtasini tanlashingiz mumkin (ixtiyoriy)</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {domainOptions.map((d) => (
                <button key={d} onClick={() => toggleWeak(d)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 16px", borderRadius: 12, border: `2px solid ${weak.includes(d) ? B.plum : B.border}`, background: weak.includes(d) ? "#E8EFF8" : "#fff", color: weak.includes(d) ? B.plum : B.text, cursor: "pointer", fontFamily: FONT, fontSize: 15, fontWeight: 700, textAlign: "left" }}>
                  {weak.includes(d) ? <Check size={15} /> : <span style={{ width: 15 }} />} {d}
                </button>
              ))}
            </div>
          </div>
        )}

        {step === 4 && (
          <div style={{ textAlign: "center" }}>
            <Trophy size={48} color={B.gold} />
            <h2 style={{ fontSize: 23, fontWeight: 800, margin: "16px 0 16px" }}>Rejangiz tayyor, {name || "do'stim"}!</h2>
            <div style={{ background: B.bg, borderRadius: 16, padding: 18, textAlign: "left", fontSize: 15, lineHeight: 2 }}>
              <div>🎯 Maqsad ball: <b>{target}</b></div>
              <div>📅 Imtihon: <b>{examDate.toLocaleDateString("uz-UZ")}</b> atrofida</div>
              <div>⏱ Kunlik maqsad: <b>{suggestedGoal} daqiqa</b></div>
              {weak.length > 0 && <div>📌 Diqqat markazi: <b>{weak.slice(0, 2).join(", ")}{weak.length > 2 ? ` +${weak.length - 2}` : ""}</b></div>}
            </div>
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 26 }}>
          <button onClick={() => setStep((s) => Math.max(0, s - 1))} style={{ visibility: step === 0 ? "hidden" : "visible", background: "transparent", border: "none", color: B.muted, cursor: "pointer", fontFamily: FONT, fontSize: 15.5, fontWeight: 700 }}>Orqaga</button>
          {step < 4 ? (
            <button onClick={() => setStep((s) => s + 1)} style={{ background: B.plum, color: "#fff", border: "none", borderRadius: 12, padding: "11px 26px", fontSize: 15.5, fontWeight: 700, cursor: "pointer", fontFamily: FONT, display: "flex", alignItems: "center", gap: 6 }}>Keyingi <ChevronRight size={16} /></button>
          ) : (
            <button onClick={finish} style={{ background: B.green, color: "#fff", border: "none", borderRadius: 12, padding: "11px 26px", fontSize: 15.5, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Boshlash</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   PUBLIC SAT SCORE CALCULATOR (no sign-up needed, embedded on landing)
============================================================ */
function ScoreCalculator() {
  const [rwCorrect, setRwCorrect] = useState(40);
  const [mathCorrect, setMathCorrect] = useState(30);
  const rw = scaleSection({ wc: rwCorrect, w: 54 }, rwCorrect / 54 >= 0.6);
  const math = scaleSection({ wc: mathCorrect, w: 44 }, mathCorrect / 44 >= 0.6);
  return (
    <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 18, padding: 28, maxWidth: 520, margin: "0 auto" }}>
      <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 4 }}>SAT ball kalkulyatori</div>
      <div style={{ fontSize: 12.5, color: B.muted, marginBottom: 20 }}>To'g'ri javoblar sonini kiriting — taxminiy ballingizni ko'ring (ro'yxatdan o'tish shart emas)</div>
      {[["Reading & Writing", rwCorrect, setRwCorrect, 54], ["Math", mathCorrect, setMathCorrect, 44]].map(([label, val, setter, max]) => (
        <div key={label} style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 6 }}><span>{label}</span><span style={{ fontWeight: 700 }}>{val} / {max} to'g'ri</span></div>
          <input type="range" min={0} max={max} value={val} onChange={(e) => setter(Number(e.target.value))} style={{ width: "100%", accentColor: B.plum }} />
        </div>
      ))}
      <div style={{ background: B.bg, borderRadius: 12, padding: 18, textAlign: "center", marginTop: 8 }}>
        <div style={{ fontSize: 11.5, color: B.muted, marginBottom: 4 }}>TAXMINIY UMUMIY BALL</div>
        <div style={{ fontSize: 36, fontWeight: 800, color: B.plum }}>{rw + math}</div>
        <div style={{ fontSize: 12, color: B.muted, marginTop: 4 }}>R&W {rw} · Math {math}</div>
      </div>
    </div>
  );
}

  const sws = useSws();
  const [view, setView] = useState(null);
  const decided = sws.ready && (!sws.session || sws.meLoaded);
  useEffect(() => { if (decided && view === null) setView(isOnboarded() ? "app" : "landing"); }, [decided]);
  useEffect(() => { const t = setTimeout(() => { SWS.meLoaded = true; swsNotify(); }, 7000); return () => clearTimeout(t); }, []);
  useEffect(() => { if (view === "onboarding" && isOnboarded()) setView("app"); });
  if (view === null) return <div style={{ minHeight: "100vh", background: B.bg }} />;
  if (view === "landing") return <div style={{ height: "100vh", overflowY: "auto" }}><Landing onStart={() => setView(isOnboarded() ? "app" : "onboarding")} /></div>;
  if (view === "onboarding") return <Onboarding onDone={() => setView("app")} />;
  return <AppShell onHome={() => setView("landing")} />;
}

// gate.js Telegram orqali kirishni tasdiqlagach "sws-auth" hodisasini yuboradi
window.addEventListener("sws-auth", (e) => swsApplyAuth(e.detail));
if (window.SWS_AUTH) swsApplyAuth(window.SWS_AUTH);
setTimeout(() => { if (!SWS.ready) swsApplyAuth({}); }, 6000); // gate ishlamasa ham sayt ochiladi
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
