const SWS = { uid: null, session: null, user: null, me: null, subs: new Set() };
function swsNotify() { SWS.subs.forEach((f) => { try { f(); } catch (e) {} }); }

function swsApplyAuth(detail) {
  const d = detail || window.SWS_AUTH || {};

    const changed = SWS.uid !== d.user.id;
    SWS.uid = d.user.id; SWS.session = d.session; SWS.user = d.user;
    if (changed) {
      // Birinchi marta kirganda: shu qurilmadagi eski (akkauntsiz) natijalarni shu akkauntga o'tkazamiz
      try {
        const claimed = localStorage.getItem("sws_claimed");
        const flag = "u" + SWS.uid + ":__init";
        if (!localStorage.getItem(flag)) {
          if (!claimed) {
            Object.keys(localStorage).filter((k) => k.startsWith("sws_") && !/^sws_(tg_|session|claimed)/.test(k)).forEach((k) => {
              const nk = "u" + SWS.uid + ":" + k; if (localStorage.getItem(nk) == null) localStorage.setItem(nk, localStorage.getItem(k));

            localStorage.setItem("sws_claimed", String(SWS.uid));

          localStorage.setItem(flag, "1");
        }
      } catch (e) {}
    }

  if (SWS.session && !SWS.meLoaded) swsRefreshMe("?seen=1&cursors=1").then(() => { SWS.meLoaded = true; swsNotify(); });
  swsNotify();
}
async function swsApi(path, body) {
  if (!SWS.session) throw new Error("no_session");
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json", Authorization: "Bearer " + SWS.session }, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

  if (!SWS.session) return null;
  try {
    const me = await swsApi("/api/me" + (extra || ""));

      SWS.me = me;
      if (me.seen) mergeSeen(me.seen);
      if (me.cursors) { const c = loadLocal("sws_qcur", {}); Object.entries(me.cursors).forEach(([k, v]) => { c[k] = Math.max(c[k] || 0, v); }); saveLocal("sws_qcur", c); }

      const p = me.profile;
      if (p && p.onboarded && !loadLocal("sws_onboarded", false)) {
        if (p.name) saveLocal("sws_name", p.name);
        if (p.goal) saveLocal("sws_goal", p.goal);
        if (p.target) saveLocal("sws_target_score", p.target);

    } else if (t === 5) { const s = ri(rng, 4, 60);
      q = { prompt: `A square is inscribed in a circle. The radius of the circle is ${s}√2/2 inches. What is the side length, in inches, of the square?`, correct: `${s}`, dist: [`${s}√2/2`, `${s}√2`, `${2 * s}`], expl: `The diagonal of the square equals the circle's diameter, ${s}√2. Since diagonal = side · √2, the side length is ${s}.` };
    } else if (t === 6) { const given = ri(rng, 20, 160);
      q = { prompt: `Two parallel lines are cut by a transversal. One of the interior angles on one side of the transversal measures ${given}°. What is the measure, in degrees, of the interior angle on the same side of the transversal at the other intersection point?`, correct: 180 - given, dist: [given, Math.abs(90 - given), Math.min(179, given + 90)], expl: `Co-interior (same-side interior) angles formed by a transversal across parallel lines are supplementary: 180 − ${given} = ${180 - given}.` };
    } else { const k = ri(rng, 2, 6), b = ri(rng, 10, 100), sy = b * k * k, vy = ri(rng, 2, 50) * k * k * k, vx = vy / (k * k * k);
      q = { prompt: `Right rectangular prism X is similar to right rectangular prism Y. The surface area of right rectangular prism X is ${b} square centimeters, and the surface area of right rectangular prism Y is ${sy} square centimeters. The volume of right rectangular prism Y is ${vy} cubic centimeters. What is the sum of the volumes, in cubic centimeters, of right rectangular prism X and right rectangular prism Y?`, correct: vx + vy, dist: [vy, vx, vy - vx], expl: `The surface-area ratio ${sy}/${b} = ${k * k}, so the linear scale factor is ${k} and the volume ratio is ${k}³ = ${k * k * k}. Volume X = ${vy}/${k * k * k} = ${vx}, so the sum is ${vx} + ${vy} = ${vx + vy}.` }; }
  }
  if (isSPR) return { type: "spr", prompt: q.prompt, answer: String(q.correct), expl: q.expl };
  const { choices, answer } = buildChoices(rng, q.correct, q.dist);
  return { type: "mc", prompt: q.prompt, choices, answer, expl: q.expl };
}

  "Central Ideas and Details": [
    { passage: "Researchers tracking migratory dragonflies found individuals crossing more than 600 kilometres of open ocean. Rather than flying continuously, the insects appear to ride high-altitude wind systems, expending energy only to enter and exit favourable air currents.", prompt: "Which choice best states the main idea of the text?", choices: ["Dragonflies migrate farther than any other insect.", "Dragonflies conserve energy by using wind systems during ocean crossings.", "Ocean crossings are the most dangerous part of migration.", "Researchers cannot explain dragonfly navigation."], answer: 1, expl: "The mechanism sentence carries the main idea." },
    { passage: "Soil scientists once assumed that root systems compete only for water and nutrients. Recent isotope studies show that neighbouring trees of the same species transfer sugars through shared fungal networks, sometimes sustaining seedlings that receive almost no direct sunlight.", prompt: "Which choice best states the main idea of the text?", choices: ["Fungal networks harm tree seedlings.", "Trees exchange resources, complicating a purely competitive model of root behaviour.", "Sunlight is unnecessary for tree growth.", "Isotope studies are the only reliable soil method."], answer: 1, expl: "The finding revises the competition-only assumption." },
    { passage: "For decades, city planners assumed that adding highway lanes reduces congestion by increasing capacity. Traffic data from dozens of expansion projects instead show that new lanes fill with new drivers within a few years, leaving congestion levels largely unchanged.", prompt: "Which choice best states the main idea of the text?", choices: ["Highway expansion has no effect on driver behavior.", "Adding lanes often fails to reduce congestion because new demand fills the added capacity.", "Congestion is caused entirely by poor road design.", "City planners have stopped building new highways."], answer: 1, expl: "New demand filling added capacity is the text's central point." },
    { passage: "Beekeepers have noticed that hives placed near flowering almond orchards produce noticeably less honey than hives in wildflower meadows, even though almond blossoms are abundant. Botanists suggest the sugar concentration in almond nectar is simply too low to sustain high honey yields.", prompt: "Which choice best states the main idea of the text?", choices: ["Almond orchards are harmful to bee populations.", "Nectar quality, not flower abundance, better explains the honey yield difference.", "Wildflower meadows should replace almond orchards.", "Bees prefer almond blossoms over wildflowers."], answer: 1, expl: "The text points to nectar quality, not abundance, as the key factor." },
    { passage: "Linguists studying a remote mountain community found that children there become fluent in three languages by age six, switching between them depending on who they are speaking to. Researchers attribute this not to unusual talent but to constant, everyday exposure to all three languages from birth.", prompt: "Which choice best states the main idea of the text?", choices: ["The children in this community are unusually gifted.", "Early, constant exposure — not innate talent — explains the community's multilingualism.", "Multilingualism is rare in mountain communities.", "Children should be taught only one language at a time."], answer: 1, expl: "The text explicitly attributes the outcome to exposure, not talent." },
    { passage: "A study of night-shift hospital workers found that meal timing, not sleep duration alone, predicted long-term weight gain. Workers who ate their largest meal during nighttime hours gained more weight over five years than those who shifted their largest meal to daytime, even when total calories and sleep hours were similar.", prompt: "Which choice best states the main idea of the text?", choices: ["Night-shift work always causes weight gain.", "When a person eats may matter as much as sleep or total calories for long-term weight.", "Sleep duration has no effect on health.", "Daytime meals contain fewer calories than nighttime meals."], answer: 1, expl: "Meal timing is presented as an independent factor alongside sleep and calories." },
    { passage: "Historians long credited a single royal decree with ending a centuries-old craft guild system. Recently uncovered trade ledgers show guild membership had already declined by more than half in the decades before the decree, as independent workshops quietly out-competed guild members on price.", prompt: "Which choice best states the main idea of the text?", choices: ["The royal decree was the sole cause of the guild system's end.", "Economic competition, already underway, undermines a single-cause explanation for the guild system's decline.", "Guild membership increased steadily until the decree.", "Trade ledgers from this period have all been lost."], answer: 1, expl: "The ledgers complicate the single-cause (decree) explanation." },
    { passage: "Ecologists monitoring a wetland restoration project expected native plant species to rebound first, since the site had been seeded specifically with native seed mixes. Instead, fast-growing invasive species dominated the site in its first two years, only giving way to native plants once soil nutrient levels stabilized.", prompt: "Which choice best states the main idea of the text?", choices: ["Native seed mixes are ineffective in wetland restoration.", "Soil conditions, not seeding alone, determined which plants established first.", "Invasive species always outcompete native ones permanently.", "Wetland restoration projects rarely succeed."], answer: 1, expl: "Soil stabilization, not the seed mix alone, explained the eventual outcome." },
    { passage: "City engineers assumed that painting bus lanes red would be enough to deter cars from blocking them. After the paint faded within a year in high-traffic corridors, violation rates crept back to pre-paint levels, suggesting the visual cue alone was not a durable solution.", prompt: "Which choice best states the main idea of the text?", choices: ["Red paint permanently solved the bus lane problem.", "A visual-only intervention proved insufficient once it physically faded.", "Drivers never blocked bus lanes before the paint was applied.", "Bus lanes are unnecessary in most cities."], answer: 1, expl: "The paint's fading and the return of violations show the visual fix wasn't durable." },
    { passage: "Anthropologists studying a fishing community found that elders' oral histories described storm patterns matching tree-ring records almost exactly, even for storms centuries before written records began, suggesting the oral tradition preserved genuine environmental memory rather than embellished legend.", prompt: "Which choice best states the main idea of the text?", choices: ["Oral histories are always more accurate than written records.", "The oral tradition's storm accounts align with independent physical evidence, supporting their reliability.", "Tree-ring records are unreliable for dating storms.", "The fishing community no longer tells these stories."], answer: 1, expl: "The match with tree-ring evidence supports the oral tradition's reliability." },
    { passage: "A hospital that switched from paper charts to a digital system expected faster patient processing. Instead, nurses reported spending more time on data entry in the first year, though processing times improved sharply once staff completed additional training in year two.", prompt: "Which choice best states the main idea of the text?", choices: ["Digital systems always slow down hospitals permanently.", "The switch caused a temporary slowdown before training unlocked the expected gains.", "Paper charts were faster in every respect.", "Nurses refused to use the new system."], answer: 1, expl: "The slowdown was temporary, resolved once training was completed." },
    { passage: "Economists studying a minimum-wage increase in one state found employment in fast food barely changed, while employment in small independent restaurants, which operate on thinner margins, declined noticeably in the same period.", prompt: "Which choice best states the main idea of the text?", choices: ["The minimum-wage increase affected all restaurant types identically.", "The wage increase's employment effects differed by business type and profit margin.", "Fast food chains laid off the most workers.", "Independent restaurants were unaffected by the policy."], answer: 1, expl: "The differing impact by business type is the text's central point." },
    { passage: "Astronomers long assumed that a planet's rings must be nearly as old as the planet itself. Detailed analysis of one ring system's composition instead suggests it formed only tens of millions of years ago, far more recently than the planet.", prompt: "Which choice best states the main idea of the text?", choices: ["All planetary rings are exactly as old as their planets.", "New evidence suggests this ring system is surprisingly young relative to its planet.", "The ring system has never been studied before.", "Planets cannot form rings after their initial formation."], answer: 1, expl: "The composition analysis suggests a surprisingly recent formation." },
    { passage: "A publisher expected that switching to recycled paper would raise production costs significantly. After renegotiating supplier contracts and adjusting print runs, the company found costs rose only marginally, and customer response to the change was strongly positive.", prompt: "Which choice best states the main idea of the text?", choices: ["Recycled paper made the company unprofitable.", "The anticipated cost increase was largely avoided, and the change was well received.", "Customers disliked the switch to recycled paper.", "The company reversed its decision after one year."], answer: 1, expl: "Costs rose only marginally, and customers responded positively." },
  ],
  "Command of Evidence (Textual)": [
    { passage: "A student claims that the sculptor Adolfina Zaripova developed her signature technique only after moving to Bukhara in 1978.", prompt: "Which quotation from a scholarly article would best support the student's claim?", choices: ["\"Zaripova exhibited widely throughout the 1960s.\"", "\"No work before 1979 shows the layered-glaze method she later became known for.\"", "\"Bukhara had a thriving community of ceramicists.\"", "\"Critics disagreed about her late work.\""], answer: 1, expl: "Only this ties the technique's absence to the period before the move." },
    { passage: "A student claims that the poet Gulnora Otajonova began writing exclusively in free verse only after her move to the coastal city of Termiz.", prompt: "Which quotation from a scholarly article would best support the student's claim?", choices: ["\"Otajonova published widely admired sonnets throughout her twenties.\"", "\"No poem written after her 1985 relocation follows a fixed rhyme scheme.\"", "\"Termiz was known for its vibrant literary scene.\"", "\"Critics praised her formal control early in her career.\""], answer: 1, expl: "Only this quotation directly ties the stylistic shift to the relocation date." },
    { passage: "A student claims that a particular bridge design was chosen primarily for its low maintenance cost rather than its appearance.", prompt: "Which quotation from the engineering report would best support the student's claim?", choices: ["\"The design won an award for its elegant silhouette.\"", "\"Projected maintenance costs were 40 percent lower than the alternative design.\"", "\"Local residents praised the bridge's appearance.\"", "\"The bridge was completed two months ahead of schedule.\""], answer: 1, expl: "Only this directly supports a cost-based rather than aesthetic rationale." },
    { passage: "A student claims that a company's founder resisted expanding overseas for religious rather than financial reasons.", prompt: "Which quotation from the founder's memoir would best support the student's claim?", choices: ["\"Overseas markets would have doubled our revenue within a decade.\"", "\"I could not reconcile expansion with the values my faith demanded of me.\"", "\"Our factories were already operating near full capacity.\"", "\"Shipping costs abroad were manageable at the time.\""], answer: 1, expl: "Only this cites religious values as the reason." },
    { passage: "A student claims that a species of frog changes its mating call depending on the noise level of its habitat.", prompt: "Which quotation from the biology study would best support the student's claim?", choices: ["\"Frogs in quiet forests call at dusk and dawn.\"", "\"Frogs recorded near highways used calls 15 percent higher in pitch than those in quiet forests.\"", "\"The species is found across three continents.\"", "\"Mating season lasts roughly six weeks.\""], answer: 1, expl: "Only this directly compares call pitch across noise environments." },
    { passage: "A student claims that a historical famine was worsened by a government policy rather than caused solely by drought.", prompt: "Which quotation from the historian's account would best support the student's claim?", choices: ["\"Rainfall that year was 30 percent below average.\"", "\"Grain exports continued at normal levels even as local reserves ran out.\"", "\"The drought lasted for three consecutive growing seasons.\"", "\"Neighboring regions also experienced reduced rainfall.\""], answer: 1, expl: "Only this points to a policy decision (continued exports) as a contributing cause." },
    { passage: "A student claims that a particular composer's late symphonies were shaped by his declining hearing rather than a shift in artistic taste.", prompt: "Which quotation from a music historian would best support the student's claim?", choices: ["\"His early symphonies were praised for their lively tempo.\"", "\"Letters from this period describe him composing by feeling vibrations through the floor.\"", "\"He traveled extensively throughout his career.\"", "\"Audiences of the time preferred slower movements.\""], answer: 1, expl: "Only this directly ties his composing method to his hearing loss." },
    { passage: "A student claims that a city's decision to remove a highway improved, rather than worsened, downtown traffic flow.", prompt: "Which quotation from the transportation study would best support the student's claim?", choices: ["\"The highway had been in place for over 40 years.\"", "\"Average downtown travel times fell by 18 percent in the two years after removal.\"", "\"The removal project cost more than initially budgeted.\"", "\"Several nearby businesses closed during construction.\""], answer: 1, expl: "Only this shows a measured improvement in travel times." },
    { passage: "A student claims that a particular species of coral is more resilient to warming waters than previously believed.", prompt: "Which quotation from the marine biology report would best support the student's claim?", choices: ["\"Coral bleaching events have increased in frequency worldwide.\"", "\"Colonies of this species survived water temperatures 2°C above the previously recorded bleaching threshold.\"", "\"The reef is a popular destination for divers.\"", "\"Warming trends are expected to continue for decades.\""], answer: 1, expl: "Only this directly shows survival beyond the previous threshold." },
    { passage: "A student claims that a factory's productivity gains came from a change in shift scheduling rather than new machinery.", prompt: "Which quotation from the plant manager's report would best support the student's claim?", choices: ["\"New machinery was installed the previous year with no measurable output change.\"", "\"Output per worker rose 22 percent the month the new shift schedule began.\"", "\"The factory employs over 300 workers.\"", "\"Raw material costs remained stable throughout the year.\""], answer: 1, expl: "This links the productivity rise directly to the scheduling change, while the first choice rules out machinery." },
    { passage: "A student claims that a medieval trade route's decline was driven by a shift in currency value rather than the opening of a new sea route.", prompt: "Which quotation from the economic historian's account would best support the student's claim?", choices: ["\"The sea route was not commonly used until decades after the trade route's decline began.\"", "\"Merchant records show the route's currency lost over half its value in the preceding years.\"", "\"The trade route had connected several major cities.\"", "\"Caravans along the route were frequently escorted by guards.\""], answer: 1, expl: "Only this directly cites a currency-value cause." },
    { passage: "A student claims that a city's new curbside composting program significantly increased participation after adding weekly reminder texts.", prompt: "Which quotation from the city's program report would best support the student's claim?", choices: ["\"The program launched in most neighborhoods within six months.\"", "\"Participation rose from 22 percent to 61 percent in the eight weeks after reminder texts began.\"", "\"Composting bins are collected on Tuesdays in most districts.\"", "\"The city surveyed residents about program awareness.\""], answer: 1, expl: "Only this directly ties the participation jump to the reminder texts." },
    { passage: "A student claims that a particular airline's on-time performance improved mainly because of a scheduling change rather than better weather.", prompt: "Which quotation from the airline's operations report would best support the student's claim?", choices: ["\"Weather conditions during the period were consistent with the prior year's averages.\"", "\"On-time arrivals rose most sharply at hubs where turnaround buffers were extended.\"", "\"The airline operates over 200 daily flights.\"", "\"Customer satisfaction scores also improved.\""], answer: 1, expl: "This ties the improvement to the scheduling change, while the first choice rules out weather." },
    { passage: "A student claims that a particular language's verb system preserves features lost in its closest relative languages.", prompt: "Which quotation from the linguistics paper would best support the student's claim?", choices: ["\"The language is spoken by roughly two million people.\"", "\"Three verb-tense markers absent from every related language persist in this one, unchanged for centuries.\"", "\"Researchers began documenting the language in the 1960s.\"", "\"The language has borrowed vocabulary from neighboring tongues.\""], answer: 1, expl: "Only this directly compares the verb system to related languages." },
  ],
  "Command of Evidence (Quantitative)": [
    { passage: "A survey measured average daily reading time among students in three districts:\n\n  District A — 41 minutes\n  District B — 27 minutes\n  District C — 63 minutes\n\nA researcher concluded that reading time varies substantially across districts.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["District C's average is more than double District B's.", "All three districts averaged under an hour.", "District A's average is close to District B's.", "The survey covered three districts."], answer: 0, expl: "63 is more than twice 27 — direct evidence of substantial variation." },
    { passage: "A researcher tracked average sleep duration across four age groups:\n\n  Teens — 6.4 hours\n  Young adults — 6.9 hours\n  Middle-aged adults — 6.7 hours\n  Older adults — 7.3 hours\n\nThe researcher concluded that sleep duration generally increases after young adulthood.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Older adults averaged more sleep than the other three groups combined.", "Older adults' 7.3 hours is higher than the 6.4–6.9 hour range of the younger groups.", "Teens averaged the least sleep of the four groups.", "All four groups averaged fewer than eight hours of sleep."], answer: 1, expl: "This directly compares the older group's average to the others, supporting the trend." },
    { passage: "A city tracked bicycle commuting rates before and after adding protected bike lanes on three corridors:\n\n  Corridor A — 4% to 11%\n  Corridor B — 6% to 9%\n  Corridor C — 3% to 15%\n\nAn analyst concluded that the effect of protected lanes varied substantially by corridor.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Corridor C's increase (12 points) was four times larger than Corridor B's (3 points).", "All three corridors saw an increase in bicycle commuting.", "Corridor A's rate was higher than Corridor B's before the lanes were added.", "The city added lanes to three corridors."], answer: 0, expl: "Comparing the size of the increases directly shows the variation." },
    { passage: "A study compared crop yields under three irrigation methods over one growing season:\n\n  Flood irrigation — 3.1 tons/acre\n  Drip irrigation — 4.6 tons/acre\n  Sprinkler irrigation — 3.9 tons/acre\n\nThe study's authors concluded that drip irrigation was the most water-efficient choice for maximizing yield.", prompt: "Which choice from the table, if true, would most weaken the authors' conclusion?", choices: ["Drip irrigation also used more water per acre than the other two methods.", "Drip irrigation produced the highest yield of the three methods.", "Sprinkler irrigation produced a higher yield than flood irrigation.", "All three methods were tested on the same soil type."], answer: 0, expl: "If drip irrigation used more water, it would undercut the water-efficiency claim." },
    { passage: "A survey measured average commute times in five neighborhoods after a new subway line opened:\n\n  Neighborhood 1 — 22 min\n  Neighborhood 2 — 31 min\n  Neighborhood 3 — 19 min\n  Neighborhood 4 — 27 min\n  Neighborhood 5 — 24 min\n\nA transit official concluded that the subway line benefited some neighborhoods more than others.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Neighborhood 3's commute time is 12 minutes shorter than Neighborhood 2's.", "All five neighborhoods have access to the new subway line.", "Neighborhood 5's commute time falls in the middle of the range.", "Five neighborhoods were included in the survey."], answer: 0, expl: "The 12-minute gap directly shows unequal benefit across neighborhoods." },
    { passage: "A researcher compared test scores of students who used a tutoring app for different durations:\n\n  0–1 hours/week — 68 average\n  2–3 hours/week — 74 average\n  4–5 hours/week — 79 average\n  6+ hours/week — 78 average\n\nThe researcher concluded that additional tutoring time produces diminishing returns beyond a certain point.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Scores rose steadily from 0–1 to 4–5 hours but slightly declined from 4–5 to 6+ hours.", "Students who used the app for 0–1 hours scored above 65.", "Four groups were compared in the study.", "The app was used by students of various ages."], answer: 0, expl: "The leveling-off (and slight drop) after 4–5 hours is direct evidence of diminishing returns." },
    { passage: "A wildlife agency counted deer populations in a forest over four years following the reintroduction of wolves:\n\n  Year 1 — 1,200\n  Year 2 — 1,050\n  Year 3 — 950\n  Year 4 — 970\n\nA biologist concluded that the deer population decline leveled off after the third year.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["The population changed by only 20 between Year 3 and Year 4, far less than the drops in earlier years.", "The population was highest in Year 1.", "Wolves were reintroduced before the count began.", "The forest was surveyed over four years."], answer: 0, expl: "The small Year 3-to-4 change, compared to earlier drops, shows the leveling off." },
    { passage: "A quality-control team recorded manufacturing defect rates before and after a new inspection protocol at three plants:\n\n  Plant X — 4.2% to 1.8%\n  Plant Y — 3.5% to 3.1%\n  Plant Z — 5.0% to 1.1%\n\nThe team concluded that the new protocol's effectiveness varied widely across plants.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Plant Z's defect rate dropped by 3.9 points while Plant Y's dropped by only 0.4 points.", "All three plants had defect rates above 1% before the change.", "Plant X's rate was higher than Plant Y's before the protocol began.", "Three plants adopted the new inspection protocol."], answer: 0, expl: "Comparing the size of each plant's improvement directly shows the variation." },
    { passage: "A clinic tracked patient wait times before and after adding a triage nurse at three locations:\n\n  Location A — 34 min to 19 min\n  Location B — 28 min to 25 min\n  Location C — 41 min to 15 min\n\nAn administrator concluded that the triage nurse's impact varied substantially by location.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Location C's wait time dropped by 26 minutes while Location B's dropped by only 3 minutes.", "All three locations saw wait times decrease.", "Location A's wait time was higher than Location B's before the change.", "Three locations were included in the study."], answer: 0, expl: "Comparing the drop sizes directly shows the varying impact." },
    { passage: "A gym tracked member retention across four membership tiers over one year:\n\n  Basic — 58%\n  Standard — 71%\n  Premium — 84%\n  Elite — 82%\n\nA manager concluded that retention improves with tier level but levels off at the highest tiers.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Retention rose steadily from Basic through Premium but dipped slightly at Elite.", "The gym offers four membership tiers.", "Basic members had the lowest retention of the four tiers.", "Standard tier retention was above 50 percent."], answer: 0, expl: "The rise then slight dip at Elite shows the leveling-off pattern." },
    { passage: "A farm compared crop losses to pests under three treatments over one season:\n\n  No treatment — 340 kg lost\n  Treatment A — 210 kg lost\n  Treatment B — 95 kg lost\n\nThe farm's agronomist concluded that Treatment B was the more effective option for reducing losses.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Treatment B reduced losses by 245 kg compared to no treatment, versus 130 kg for Treatment A.", "All three groups experienced some crop loss.", "No treatment resulted in the highest losses.", "The season lasted several months."], answer: 0, expl: "Comparing the size of each reduction directly shows Treatment B's advantage." },
  ],
  Inferences: [
    { passage: "Volcanic ash layers can be dated precisely, so geologists use them as time markers in sediment cores. When a core contains no ash layer for a long stretch, dating that interval relies on slower, less exact methods; consequently, ______", prompt: "Which choice most logically completes the text?", choices: ["ash layers are found in every core.", "age estimates for ash-free intervals carry wider uncertainty.", "geologists avoid sediment cores entirely.", "sediment accumulates faster near volcanoes."], answer: 1, expl: "Less exact methods imply greater uncertainty." },
    { passage: "Tree rings in drought-resistant species typically narrow during dry years, but researchers studying a particular pine forest found no such narrowing during a documented multi-year drought. This suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["the forest received more rainfall than official records indicate.", "these particular trees may draw on a water source unaffected by surface drought, such as deep groundwater.", "tree rings are an unreliable indicator of any environmental change.", "the drought did not actually occur in that region."], answer: 1, expl: "An alternate water source would explain the absence of the expected pattern." },
    { passage: "Most online reviews of a product cluster around either five stars or one star, with very few in between. Marketing researchers note that people are far more likely to write a review when they feel strongly, whether positively or negatively, than when their experience was merely adequate. This pattern suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["most customers who buy the product are dissatisfied.", "average customer ratings drawn only from reviews may not reflect the experience of the typical buyer.", "companies should stop collecting customer reviews.", "five-star and one-star reviews are usually fake."], answer: 1, expl: "If only strong reactions get reviewed, the review average may be skewed." },
    { passage: "A species of migratory bird arrives at its northern breeding grounds several days earlier than it did fifty years ago, tracking with a similar shift in the timing of local insect hatches each spring. This pattern suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["the bird species is now extinct in its southern range.", "the birds' migration timing may be adjusting in response to a shifting food supply.", "insect hatches no longer depend on temperature.", "the birds have stopped migrating altogether."], answer: 1, expl: "The matched shift in timing points to the birds tracking their food supply." },
    { passage: "A city's water utility found that homes with older, analog water meters used, on average, 15 percent more water than homes with new digital meters that display real-time usage on a mobile app, even though pipe age and household size were similar. This suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["analog meters are less accurate than digital ones.", "visibility into real-time usage may itself encourage households to conserve water.", "digital meters use less water to operate.", "older homes have larger pipes than newer homes."], answer: 1, expl: "With other factors held similar, visibility into usage is the likeliest explanation." },
    { passage: "Archaeologists excavating a coastal settlement found cooking hearths built well above the highest known tide line for that era, based on shell deposits and sediment layers. This suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["the settlement's residents lacked knowledge of tides.", "the residents may have deliberately built away from flood-prone areas.", "the settlement was located far inland.", "the sea level in that era was lower than researchers assume."], answer: 1, expl: "Building above the known tide line suggests intentional flood avoidance." },
    { passage: "In a study of two otherwise similar schools, the one that started its day an hour later reported fewer tardiness incidents and higher first-period test scores, even though both schools had the same curriculum and teaching staff. This pattern suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["curriculum quality has no effect on test scores.", "start time itself may influence student punctuality and morning performance.", "the later-starting school had better teachers.", "test scores are unrelated to sleep schedules."], answer: 1, expl: "With curriculum and staff held equal, start time is the likeliest explanation." },
    { passage: "A restaurant chain that removed calorie counts from its menu, then reinstated them a year later, saw average order size shrink slightly in the months after reinstatement but return to its prior level within six months. This pattern suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["calorie counts permanently change customer ordering habits.", "the initial effect of calorie information on orders may fade as customers grow accustomed to seeing it.", "customers ignored the calorie counts entirely.", "the restaurant's menu prices changed during this period."], answer: 1, expl: "The effect fading after six months suggests it was temporary, not permanent." },
    { passage: "A city's library system removed late fees entirely in 2019. Return rates for borrowed books, contrary to staff expectations, did not decline in the years that followed. This suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["late fees were the primary reason people returned books on time.", "factors other than late fees may be what motivate most patrons to return books.", "the library system saw a drop in total borrowing.", "removing late fees had no effect on the library's budget."], answer: 1, expl: "If return rates held steady without fees, other motivations likely matter more." },
    { passage: "A software company found that user churn dropped sharply after simplifying its onboarding flow from twelve steps to four, even though the simplified version explained fewer features upfront. This suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["explaining more features always increases user retention.", "a shorter, simpler onboarding experience may matter more to new users than comprehensive feature explanations.", "the company's product quality declined.", "users prefer applications with no onboarding at all."], answer: 1, expl: "Churn dropped despite less explanation, pointing to simplicity mattering more." },
    { passage: "Paleontologists comparing fossilized footprints found that individuals within the same herd varied enormously in stride length, more than body-size differences alone would predict. This suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["all members of the herd were the same age.", "factors beyond body size, such as pace or terrain, likely influenced the animals' stride length.", "the footprints belonged to different species entirely.", "the herd traveled at a single, fixed speed."], answer: 1, expl: "Variation beyond what body size predicts points to other influencing factors." },
    { passage: "A bakery that switched to a slower fermentation process saw a decline in daily output but received a sharp increase in returning customers over the following months. This suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["customers did not notice any difference in the bread.", "the quality gained from slower fermentation may have mattered more to customers than the drop in quantity.", "the bakery's prices increased significantly.", "slower fermentation is always unprofitable."], answer: 1, expl: "More returning customers despite lower output points to a quality gain mattering more." },
  ],
  Boundaries: [
    { passage: "The 1908 Tunguska event flattened over 2,000 square kilometres of Siberian forest ______ no crater was ever found.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["forest, yet", "forest yet", "forest; yet,", "forest, yet,"], answer: 0, expl: "Comma + coordinating conjunction joins two independent clauses." },
    { passage: "Because the bridge's steel cables expand in summer heat ______ engineers designed the deck with expansion joints at both ends.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["heat;", "heat,", "heat", "heat:"], answer: 1, expl: "A comma follows an introductory dependent clause." },
    { passage: "The archive holds three rare items ______ a 15th-century atlas, a merchant's ledger, and a set of hand-coloured maps.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["items,", "items:", "items;", "items"], answer: 1, expl: "A colon introduces a list after an independent clause." },
    { passage: "The museum's newest wing houses ancient manuscripts ______ many of them had never been publicly displayed before.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["manuscripts, and", "manuscripts and", "manuscripts; and,", "manuscripts, and,"], answer: 0, expl: "Comma + coordinating conjunction joins two independent clauses." },
    { passage: "Because the reservoir's water level dropped sharply last summer ______ officials imposed temporary restrictions on agricultural use.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["summer;", "summer,", "summer", "summer:"], answer: 1, expl: "A comma follows an introductory dependent clause." },
    { passage: "The expedition carried three essential supplies ______ a satellite phone, a water filter, and a week's worth of dried rations.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["supplies,", "supplies:", "supplies;", "supplies"], answer: 1, expl: "A colon introduces a list after an independent clause." },
    { passage: "The orchestra's conductor rehearsed the piece for weeks ______ the opening night performance still ran nearly ten minutes over schedule.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["weeks, yet", "weeks yet", "weeks; yet,", "weeks, yet,"], answer: 0, expl: "Comma + coordinating conjunction joins two independent clauses." },
    { passage: "Since the bridge inspection revealed corrosion in several support beams ______ the city closed the span to heavy vehicles.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["beams;", "beams,", "beams", "beams:"], answer: 1, expl: "A comma follows an introductory dependent clause." },
    { passage: "The archive contains three types of historical records ______ tax ledgers, court transcripts, and personal letters.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["records,", "records:", "records;", "records"], answer: 1, expl: "A colon introduces a list after an independent clause." },
    { passage: "The lab results were inconclusive ______ the team decided to repeat the trial under stricter conditions.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["inconclusive;", "inconclusive,", "inconclusive so", "inconclusive, so,"], answer: 0, expl: "Two independent clauses may be joined by a semicolon alone." },
    { passage: "The negotiations dragged on for months ______ neither side was willing to compromise on the final clause.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["months, and", "months and", "months; and,", "months, and,"], answer: 0, expl: "Comma + coordinating conjunction joins two independent clauses." },
    { passage: "The observatory's newest telescope captured images of the distant galaxy ______ astronomers had waited nearly a decade for an instrument sensitive enough to do so.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["galaxy, and", "galaxy and", "galaxy; and,", "galaxy, and,"], answer: 0, expl: "Comma + coordinating conjunction joins two independent clauses." },
    { passage: "Although the manuscript was badly damaged by water ______ restorers were able to recover nearly all of the original text.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["damage;", "damage,", "damage", "damage:"], answer: 1, expl: "A comma follows an introductory dependent clause." },
    { passage: "The kitchen stocked three essential spices for the recipe ______ cardamom, saffron, and sumac.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["spices,", "spices:", "spices;", "spices"], answer: 1, expl: "A colon introduces a list after an independent clause." },
    { passage: "The negotiations continued past midnight ______ both delegations refused to leave without a signed agreement.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["midnight, because", "midnight because", "midnight; because,", "midnight, because,"], answer: 1, expl: "No comma is needed before a subordinating conjunction like 'because' introducing an essential clause." },
    { passage: "Since the vineyard's soil lacked sufficient drainage ______ the winemakers installed an underground irrigation system.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["drainage;", "drainage,", "drainage", "drainage:"], answer: 1, expl: "A comma follows an introductory dependent clause." },
    { passage: "The archive's newest acquisition included three rare items ______ a hand-drawn map, a merchant's diary, and a set of nautical charts.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["items,", "items:", "items;", "items"], answer: 1, expl: "A colon introduces a list after an independent clause." },
    { passage: "The marathon route climbed steadily for the first ten miles ______ runners still praised the course for its scenic overlooks.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["miles, yet", "miles yet", "miles; yet,", "miles, yet,"], answer: 0, expl: "Comma + coordinating conjunction joins two independent clauses." },
    { passage: "The startup's early prototypes failed repeatedly ______ the engineers refused to abandon the underlying design.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["repeatedly, but", "repeatedly but", "repeatedly; but,", "repeatedly, but,"], answer: 0, expl: "Comma + coordinating conjunction joins two independent clauses." },
  ],

const MODULES = [
  { id: "rw1", section: "Reading and Writing", label: "Section 1, Module 1", minutes: 32, kind: "rw" },
  { id: "rw2", section: "Reading and Writing", label: "Section 1, Module 2", minutes: 32, kind: "rw", adaptive: true },

function buildModule(mod, testId, diffPath) {
  const bp = mod.kind === "rw" ? RW_BLUEPRINT : MATH_BLUEPRINT;
  return balanceAnswers(bp.map(([domain, skill], i) => {
    const isSPR = mod.kind === "math" && i >= Math.floor(bp.length * 0.75);
    if (mod.kind === "math") return { n: i + 1, domain, skill, ...genMathUnseen(skill, isSPR), passage: null };
    const v = pickUnseenRW(skill);
    return { n: i + 1, domain, skill, type: "mc", passage: v.passage, prompt: v.prompt, choices: v.choices, answer: v.answer, expl: v.expl };
  }));
}
// Bir xil harfdagi to'g'ri javob ketma-ket 3 martadan ko'p kelmasin (haqiqiy SAT'dagidek aralash)
function balanceAnswers(qs) {
  let prev = -1, run = 0;
  return qs.map((q) => {
    if (q.type === "spr" || !q.choices) { prev = -1; run = 0; return q; }
    let out = q;
    if (q.answer === prev && run >= 2) {
      const n = q.choices.length; const target = (q.answer + 1 + Math.floor(Math.random() * (n - 1))) % n;
      const ch = [...q.choices]; [ch[q.answer], ch[target]] = [ch[target], ch[q.answer]];
      out = { ...q, choices: ch, answer: target };
    }
    run = out.answer === prev ? run + 1 : 1; prev = out.answer;
    return out;
  });
}
function buildModuleCached(mod, testId, diffPath) {
  if (mod.kind === "break") return [];
  const basis = mod.adaptive ? (diffPath || "easy") : "standard";
  const cacheKey = `sws_qcache_v3_${testId}_${mod.id}_${basis}`;
  const cached = loadLocal(cacheKey, null);
  if (cached) return cached;
  const fresh = buildModule(mod, testId, diffPath);
  saveLocal(cacheKey, fresh);
  return fresh;
}
function scaleSection(rawCorrect, rawTotal, routedHard) {
  const pct = rawTotal ? rawCorrect / rawTotal : 0;
  const ceiling = routedHard ? 800 : 620, floor = 200;
  return Math.max(200, Math.min(800, Math.round((floor + pct * (ceiling - floor)) / 10) * 10));
}
function gradeTest(testId, responses, diffPath) {
  const perDomain = {}; const perSection = { rw: { c: 0, t: 0 }, math: { c: 0, t: 0 } }; const wrong = [];
  MODULES.filter((m) => m.kind !== "break").forEach((mod) => {
    const basis = mod.id === "rw2" ? diffPath.rw1 : mod.id === "m2" ? diffPath.m1 : null;
    const qs = buildModuleCached(mod, testId, basis);
    qs.forEach((q, i) => {
      const r = responses[`${mod.id}-${i}`];
      let ok = q.type === "spr" ? String(r ?? "").trim() !== "" && String(r).trim() === String(q.answer) : r === q.answer;
      perDomain[q.domain] = perDomain[q.domain] || { c: 0, t: 0 }; perDomain[q.domain].t++; if (ok) perDomain[q.domain].c++;
      else wrong.push({ domain: q.domain, skill: q.skill, prompt: q.prompt, expl: q.expl, module: mod.label });
      const sec = mod.kind === "rw" ? "rw" : "math"; perSection[sec].t++; if (ok) perSection[sec].c++;
    });
  });
  const rwScore = scaleSection(perSection.rw.c, perSection.rw.t, diffPath.rw1 === "hard");
  const mathScore = scaleSection(perSection.math.c, perSection.math.t, diffPath.m1 === "hard");
  return { rwScore, mathScore, total: rwScore + mathScore, rwRaw: perSection.rw, mathRaw: perSection.math, perDomain, wrong };
}

function useIsMobile() {
  const [isMobile, setIsMobile] = useState(() => typeof window !== "undefined" && window.innerWidth <= 680);
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth <= 680);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  return isMobile;
}

/* ============================================================
   MAC-STYLE DOCK — adapted from a shared React component into
   plain JS/JSX for this single-file app: no TypeScript, no
   external icon images (uses our own Icon set), no GSAP.
============================================================ */
function MacDock({ apps, activeId, onAppClick, className = "" }) {
  const [mouseX, setMouseX] = useState(null);
  const [currentScales, setCurrentScales] = useState(() => apps.map(() => 1));
  const [currentPositions, setCurrentPositions] = useState([]);
  const dockRef = useRef(null);
  const iconRefs = useRef([]);
  const animationFrameRef = useRef(undefined);
  const lastMouseMoveTime = useRef(0);

  const getResponsiveConfig = () => {
    if (typeof window === "undefined") return { baseIconSize: 52, maxScale: 1.5, effectWidth: 220 };
    const smaller = Math.min(window.innerWidth, window.innerHeight);
    if (smaller < 480) return { baseIconSize: Math.max(34, smaller * 0.075), maxScale: 1.35, effectWidth: smaller * 0.45 };
    if (smaller < 768) return { baseIconSize: Math.max(40, smaller * 0.055), maxScale: 1.45, effectWidth: smaller * 0.35 };
    return { baseIconSize: 48, maxScale: 1.55, effectWidth: 260 };
  };
  const [config, setConfig] = useState(getResponsiveConfig);
  const { baseIconSize, maxScale, effectWidth } = config;
  const minScale = 1.0;
  const baseSpacing = Math.max(4, baseIconSize * 0.1);

  useEffect(() => {
    const onResize = () => setConfig(getResponsiveConfig());
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const calcTargetScales = (mouseXPos) => {
    if (mouseXPos === null) return apps.map(() => minScale);
    return apps.map((_, i) => {
      const center = i * (baseIconSize + baseSpacing) + baseIconSize / 2;
      const minXb = mouseXPos - effectWidth / 2, maxXb = mouseXPos + effectWidth / 2;
      if (center < minXb || center > maxXb) return minScale;
      const theta = ((center - minXb) / effectWidth) * 2 * Math.PI;
      const capped = Math.min(Math.max(theta, 0), 2 * Math.PI);
      const factor = (1 - Math.cos(capped)) / 2;
      return minScale + factor * (maxScale - minScale);
    });
  };
  const calcPositions = (scales) => {
    let x = 0;
    return scales.map((s) => { const w = baseIconSize * s; const c = x + w / 2; x += w + baseSpacing; return c; });
  };

  useEffect(() => {
    const initScales = apps.map(() => minScale);
    setCurrentScales(initScales);
    setCurrentPositions(calcPositions(initScales));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [apps.length, baseIconSize]);

  useEffect(() => {
    const tick = () => {
      const targetScales = calcTargetScales(mouseX);
      const targetPositions = calcPositions(targetScales);
      const lerp = mouseX !== null ? 0.22 : 0.14;
      let stillMoving = mouseX !== null;
      setCurrentScales((prev) => prev.map((s, i) => { const d = targetScales[i] - s; if (Math.abs(d) > 0.002) stillMoving = true; return s + d * lerp; }));
      setCurrentPositions((prev) => prev.map((p, i) => { const d = targetPositions[i] - p; if (Math.abs(d) > 0.1) stillMoving = true; return p + d * lerp; }));
      if (stillMoving) animationFrameRef.current = requestAnimationFrame(tick);
      else animationFrameRef.current = null;
    };
    if (!animationFrameRef.current) animationFrameRef.current = requestAnimationFrame(tick);
    return () => { if (animationFrameRef.current) { cancelAnimationFrame(animationFrameRef.current); animationFrameRef.current = null; } };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [mouseX, baseIconSize]);

  const handleMouseMove = (e) => {
    const now = performance.now();
    if (now - lastMouseMoveTime.current < 16) return;
    lastMouseMoveTime.current = now;
    if (dockRef.current) {
      const rect = dockRef.current.getBoundingClientRect();
      const padding = Math.max(8, baseIconSize * 0.12);
      setMouseX(e.clientX - rect.left - padding);
    }
  };
  const handleMouseLeave = () => setMouseX(null);

  const bounce = (el, big) => {
    if (!el) return;
    const h = big ? -baseIconSize * 0.22 : -baseIconSize * 0.15;
    el.style.transition = "transform 0.18s ease-out";
    el.style.transform = `translateY(${h}px)`;
    setTimeout(() => { el.style.transform = "translateY(0px)"; }, 180);
  };

  const contentWidth = currentPositions.length
    ? Math.max(...currentPositions.map((p, i) => p + (baseIconSize * currentScales[i]) / 2))
    : apps.length * (baseIconSize + baseSpacing) - baseSpacing;
  const padding = Math.max(8, baseIconSize * 0.12);

  return (
    <div ref={dockRef} className={className} onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave}

        {apps.map((app, i) => {
          const scale = currentScales[i] || 1, pos = currentPositions[i] || 0, size = baseIconSize * scale;

              style={{ position: "absolute", left: pos - size / 2, bottom: 0, width: size, height: size, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", cursor: "pointer", zIndex: Math.round(scale * 10) }}>
              <div style={{ width: size, height: size, borderRadius: size * 0.28, background: app.id === activeId ? B.plum : "rgba(255,255,255,0.14)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: scale > 1.15 ? "0 6px 16px rgba(0,0,0,0.35)" : "none" }}>
                <IconEl size={size * 0.5} color="#fff" />
              </div>
              {app.id === activeId && <div style={{ position: "absolute", bottom: -6, width: Math.max(3, size * 0.08), height: Math.max(3, size * 0.08), borderRadius: "50%", background: "#fff", boxShadow: "0 0 4px rgba(0,0,0,0.4)" }} />}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function useAppleMotion(rootRef) {
  useEffect(() => {
    const root = rootRef.current; if (!root) return;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const items = root.querySelectorAll("[data-reveal]");
    if (reduce || !("IntersectionObserver" in window)) { items.forEach((el) => el.classList.add("sws-in")); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("sws-in"); io.unobserve(e.target); } });
    }, { threshold: 0.15, rootMargin: "0px 0px -8% 0px" });
    items.forEach((el) => io.observe(el));
    // Scroll bilan bog'langan effektlar: parallaks va "zoom-in" (Apple mahsulot sahifalaridagidek)
    const scroller = root.parentElement && root.parentElement.scrollHeight > root.parentElement.clientHeight + 1 ? root.parentElement : window;
    const par = root.querySelectorAll("[data-parallax]");
    const zoom = root.querySelectorAll("[data-zoom]");
    const header = root.querySelector("[data-glass]");
    let raf = 0;
    const tick = () => {
      raf = 0; const vh = window.innerHeight;
      par.forEach((el) => { const r = el.getBoundingClientRect(); const f = parseFloat(el.dataset.parallax) || 0.15; el.style.transform = `translate3d(0, ${((r.top + r.height / 2 - vh / 2) * -f).toFixed(1)}px, 0)`; });
      zoom.forEach((el) => {
        const r = el.getBoundingClientRect(); const p = Math.min(1, Math.max(0, (vh - r.top) / (vh * 0.75)));
        el.style.transform = `perspective(1400px) rotateX(${((1 - p) * 16).toFixed(2)}deg) scale(${(0.86 + 0.14 * p).toFixed(3)})`;
        el.style.opacity = (0.35 + 0.65 * p).toFixed(3);
      });
      if (header) { const y = scroller === window ? window.scrollY : scroller.scrollTop; header.style.boxShadow = y > 8 ? "0 8px 30px -18px rgba(22,32,77,0.35)" : "none"; }
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(tick); };
    tick();
    scroller.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => { io.disconnect(); scroller.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); if (raf) cancelAnimationFrame(raf); };
  }, []);
}

function CountUp({ to, duration = 1600 }) {
  const ref = useRef(null);
  const target = parseInt(String(to).replace(/\D/g, ""), 10) || 0;
  const [val, setVal] = useState(0);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    if (!("IntersectionObserver" in window)) { setVal(target); return; }
    let raf = 0;
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return; io.disconnect();
      const t0 = performance.now();
      const step = (t) => { const k = Math.min(1, (t - t0) / duration); setVal(Math.round(target * (1 - Math.pow(1 - k, 4)))); if (k < 1) raf = requestAnimationFrame(step); };
      raf = requestAnimationFrame(step);
    }, { threshold: 0.4 });
    io.observe(el);
    return () => { io.disconnect(); if (raf) cancelAnimationFrame(raf); };
  }, [target]);
  return <span ref={ref}>{val}</span>;
}

/* ============================================================
   CALCULATOR / GRAPHER
   On the real (Vercel) domain, the Desmos Graphing Calculator API
   loads normally and is used directly \u2014 the same tool the real
   Digital SAT provides. Desmos's script cannot load inside a
   published Claude artifact (its content-security policy only
   allows scripts from cdnjs/jsdelivr/tailwind/jquery CDNs), so a
   small self-built calculator + function grapher is kept as an
   automatic fallback there.
============================================================ */
function DesmosCalc({ onClose }) {
  const hostRef = useRef(null);
  const calcRef = useRef(null);
  useEffect(() => {
    if (!hostRef.current || !window.Desmos) return;
    calcRef.current = window.Desmos.GraphingCalculator(hostRef.current, {
      keypad: true, expressions: true, settingsMenu: false, zoomButtons: true,
      lockViewport: false, border: false, expressionsTopbar: true,
    });
    return () => { if (calcRef.current) { calcRef.current.destroy(); calcRef.current = null; } };
  }, []);
  return (
    <div style={{ position: "fixed", bottom: 20, right: 20, width: 420, height: 460, background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, boxShadow: "0 12px 32px rgba(22,32,77,0.25)", zIndex: 200, fontFamily: FONT, overflow: "hidden", display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: B.navy, color: "#fff", padding: "9px 14px", flexShrink: 0 }}>
        <span style={{ fontSize: 12.5, fontWeight: 700 }}>Desmos kalkulyator</span>
        <button onClick={onClose} style={{ background: "transparent", border: "none", color: "#fff", cursor: "pointer", display: "flex" }}><X size={15} /></button>
      </div>
      <div ref={hostRef} style={{ flex: 1, minHeight: 0 }} />
    </div>
  );
}
function CalcPanel({ onClose }) {
  const [tab, setTab] = useState("calc");
  const [expr, setExpr] = useState("");
  const [result, setResult] = useState("");
  const [fn, setFn] = useState("x^2 - 3x + 2");
  const canvasRef = useRef(null);
  const [desmosReady] = useState(() => typeof window !== "undefined" && !!window.Desmos);

  const press = (v) => setExpr((e) => e + v);
  const clear = () => { setExpr(""); setResult(""); };
  const backspace = () => setExpr((e) => e.slice(0, -1));
  const evaluate = () => {
    try {
      const clean = expr.replace(/\^/g, "**").replace(/π/g, "Math.PI").replace(/√/g, "Math.sqrt")
        .replace(/sin\(/g, "Math.sin(").replace(/cos\(/g, "Math.cos(").replace(/tan\(/g, "Math.tan(")
        .replace(/ln\(/g, "Math.log(").replace(/log\(/g, "Math.log10(");
      // eslint-disable-next-line no-new-func
      const val = Function(`"use strict"; return (${clean})`)();
      setResult(String(Math.round(val * 1e8) / 1e8));
    } catch (e) { setResult("Xato"); }
  };

  useEffect(() => {
    if (desmosReady || tab !== "graph" || !canvasRef.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#E2E4E8"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
    const scale = 20;
    let compiled;
    try {
      const clean = fn.replace(/\^/g, "**").replace(/π/g, "Math.PI")
        .replace(/sin\(/g, "Math.sin(").replace(/cos\(/g, "Math.cos(").replace(/tan\(/g, "Math.tan(")
        .replace(/sqrt\(/g, "Math.sqrt(").replace(/ln\(/g, "Math.log(");
      compiled = Function("x", `"use strict"; return (${clean});`);
    } catch (e) { return; }
    ctx.strokeStyle = "#6B3FA0"; ctx.lineWidth = 2; ctx.beginPath();
    let first = true;
    for (let px = 0; px <= w; px++) {
      const x = (px - w / 2) / scale;
      let y;
      try { y = compiled(x); } catch (e) { y = NaN; }
      if (!isFinite(y)) { first = true; continue; }
      const py = h / 2 - y * scale;
      if (first) { ctx.moveTo(px, py); first = false; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  }, [tab, fn, desmosReady]);

  if (desmosReady) return <DesmosCalc onClose={onClose} />;

  return (
    <div style={{ position: "fixed", bottom: 20, right: 20, width: 300, background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, boxShadow: "0 12px 32px rgba(22,32,77,0.25)", zIndex: 200, fontFamily: FONT, overflow: "hidden" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: B.navy, color: "#fff", padding: "9px 14px" }}>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={() => setTab("calc")} style={{ background: tab === "calc" ? "rgba(255,255,255,0.2)" : "transparent", border: "none", color: "#fff", borderRadius: 6, padding: "4px 10px", fontSize: 12, cursor: "pointer", fontFamily: FONT }}>Kalkulyator</button>
          <button onClick={() => setTab("graph")} style={{ background: tab === "graph" ? "rgba(255,255,255,0.2)" : "transparent", border: "none", color: "#fff", borderRadius: 6, padding: "4px 10px", fontSize: 12, cursor: "pointer", fontFamily: FONT }}>Grafik</button>
        </div>
        <button onClick={onClose} style={{ background: "transparent", border: "none", color: "#fff", cursor: "pointer", display: "flex" }}><X size={15} /></button>
      </div>
      {tab === "calc" ? (
        <div style={{ padding: 12 }}>
          <div style={{ background: B.bg, borderRadius: 8, padding: "10px 12px", marginBottom: 8, minHeight: 44 }}>
            <div style={{ fontSize: 13, color: B.muted, minHeight: 16, wordBreak: "break-all" }}>{expr || "0"}</div>
            {result && <div style={{ fontSize: 17, fontWeight: 800, color: B.text }}>{result}</div>}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 5 }}>
            {["sin(", "cos(", "tan(", "ln(", "√("].map((k) => (
              <button key={k} onClick={() => press(k)} style={{ padding: "8px 0", fontSize: 11.5, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k.replace("(", "")}</button>
            ))}
            {["7", "8", "9", "/", "("].map((k) => (
              <button key={k} onClick={() => press(k)} style={{ padding: "10px 0", fontSize: 14, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k}</button>
            ))}
            {["4", "5", "6", "*", ")"].map((k) => (
              <button key={k} onClick={() => press(k)} style={{ padding: "10px 0", fontSize: 14, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k}</button>
            ))}
            {["1", "2", "3", "-", "^"].map((k) => (
              <button key={k} onClick={() => press(k)} style={{ padding: "10px 0", fontSize: 14, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k}</button>
            ))}
            {["0", ".", "π", "+", "⌫"].map((k) => (
              <button key={k} onClick={() => (k === "⌫" ? backspace() : press(k === "π" ? "π" : k))} style={{ padding: "10px 0", fontSize: 14, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k}</button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
            <button onClick={clear} style={{ flex: 1, padding: "9px 0", fontSize: 13, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer", fontWeight: 700 }}>C</button>
            <button onClick={evaluate} style={{ flex: 2, padding: "9px 0", fontSize: 13, border: "none", borderRadius: 6, background: B.plum, color: "#fff", cursor: "pointer", fontWeight: 700 }}>=</button>
          </div>
        </div>
      ) : (
        <div style={{ padding: 12 }}>
          <input value={fn} onChange={(e) => setFn(e.target.value)} placeholder="masalan: x^2 - 3x + 2"
            style={{ width: "100%", padding: "9px 11px", border: `1px solid ${B.border}`, borderRadius: 7, fontSize: 13, fontFamily: FONT, boxSizing: "border-box", marginBottom: 8 }} />
          <canvas ref={canvasRef} width={276} height={200} style={{ width: "100%", borderRadius: 8, border: `1px solid ${B.border}` }} />
          <div style={{ fontSize: 11, color: B.muted, marginTop: 6 }}>y = {fn.replace(/\^/g, "^")}</div>
        </div>
      )}
    </div>
  );
}
