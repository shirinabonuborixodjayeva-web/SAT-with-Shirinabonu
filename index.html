  if (isSPR) return { type: "spr", prompt: q.prompt, answer: String(q.correct), expl: q.expl };

}

  "Command of Evidence (Textual)": [
    { passage: "A student claims that the sculptor Adolfina Zaripova developed her signature technique only after moving to Bukhara in 1978.", prompt: "Which quotation from a scholarly article would best support the student's claim?", choices: ["\"Zaripova exhibited widely throughout the 1960s.\"", "\"No work before 1979 shows the layered-glaze method she later became known for.\"", "\"Bukhara had a thriving community of ceramicists.\"", "\"Critics disagreed about her late work.\""], answer: 1, expl: "Only this ties the technique's absence to the period before the move." },
    { passage: "A student claims that the poet Gulnora Otajonova began writing exclusively in free verse only after her move to the coastal city of Termiz.", prompt: "Which quotation from a scholarly article would best support the student's claim?", choices: ["\"Otajonova published widely admired sonnets throughout her twenties.\"", "\"No poem written after her 1985 relocation follows a fixed rhyme scheme.\"", "\"Termiz was known for its vibrant literary scene.\"", "\"Critics praised her formal control early in her career.\""], answer: 1, expl: "Only this quotation directly ties the stylistic shift to the relocation date." },
    { passage: "A student claims that a particular bridge design was chosen primarily for its low maintenance cost rather than its appearance.", prompt: "Which quotation from the engineering report would best support the student's claim?", choices: ["\"The design won an award for its elegant silhouette.\"", "\"Projected maintenance costs were 40 percent lower than the alternative design.\"", "\"Local residents praised the bridge's appearance.\"", "\"The bridge was completed two months ahead of schedule.\""], answer: 1, expl: "Only this directly supports a cost-based rather than aesthetic rationale." },
    { passage: "A student claims that a company's founder resisted expanding overseas for religious rather than financial reasons.", prompt: "Which quotation from the founder's memoir would best support the student's claim?", choices: ["\"Overseas markets would have doubled our revenue within a decade.\"", "\"I could not reconcile expansion with the values my faith demanded of me.\"", "\"Our factories were already operating near full capacity.\"", "\"Shipping costs abroad were manageable at the time.\""], answer: 1, expl: "Only this cites religious values as the reason." },
    { passage: "A student claims that a species of frog changes its mating call depending on the noise level of its habitat.", prompt: "Which quotation from the biology study would best support the student's claim?", choices: ["\"Frogs in quiet forests call at dusk and dawn.\"", "\"Frogs recorded near highways used calls 15 percent higher in pitch than those in quiet forests.\"", "\"The species is found across three continents.\"", "\"Mating season lasts roughly six weeks.\""], answer: 1, expl: "Only this directly compares call pitch across noise environments." },
    { passage: "A student claims that a historical famine was worsened by a government policy rather than caused solely by drought.", prompt: "Which quotation from the historian's account would best support the student's claim?", choices: ["\"Rainfall that year was 30 percent below average.\"", "\"Grain exports continued at normal levels even as local reserves ran out.\"", "\"The drought lasted for three consecutive growing seasons.\"", "\"Neighboring regions also experienced reduced rainfall.\""], answer: 1, expl: "Only this points to a policy decision (continued exports) as a contributing cause." },
    { passage: "A student claims that a particular composer's late symphonies were shaped by his declining hearing rather than a shift in artistic taste.", prompt: "Which quotation from a music historian would best support the student's claim?", choices: ["\"His early symphonies were praised for their lively tempo.\"", "\"Letters from this period describe him composing by feeling vibrations through the floor.\"", "\"He traveled extensively throughout his career.\"", "\"Audiences of the time preferred slower movements.\""], answer: 1, expl: "Only this directly ties his composing method to his hearing loss." },
    { passage: "A student claims that a city's decision to remove a highway improved, rather than worsened, downtown traffic flow.", prompt: "Which quotation from the transportation study would best support the student's claim?", choices: ["\"The highway had been in place for over 40 years.\"", "\"Average downtown travel times fell by 18 percent in the two years after removal.\"", "\"The removal project cost more than initially budgeted.\"", "\"Several nearby businesses closed during construction.\""], answer: 1, expl: "Only this shows a measured improvement in travel times." },
    { passage: "A student claims that a particular species of coral is more resilient to warming waters than previously believed.", prompt: "Which quotation from the marine biology report would best support the student's claim?", choices: ["\"Coral bleaching events have increased in frequency worldwide.\"", "\"Colonies of this species survived water temperatures 2°C above the previously recorded bleaching threshold.\"", "\"The reef is a popular destination for divers.\"", "\"Warming trends are expected to continue for decades.\""], answer: 1, expl: "Only this directly shows survival beyond the previous threshold." },
    { passage: "A student claims that a factory's productivity gains came from a change in shift scheduling rather than new machinery.", prompt: "Which quotation from the plant manager's report would best support the student's claim?", choices: ["\"New machinery was installed the previous year with no measurable output change.\"", "\"Output per worker rose 22 percent the month the new shift schedule began.\"", "\"The factory employs over 300 workers.\"", "\"Raw material costs remained stable throughout the year.\""], answer: 1, expl: "This links the productivity rise directly to the scheduling change, while the first choice rules out machinery." },
    { passage: "A student claims that a medieval trade route's decline was driven by a shift in currency value rather than the opening of a new sea route.", prompt: "Which quotation from the economic historian's account would best support the student's claim?", choices: ["\"The sea route was not commonly used until decades after the trade route's decline began.\"", "\"Merchant records show the route's currency lost over half its value in the preceding years.\"", "\"The trade route had connected several major cities.\"", "\"Caravans along the route were frequently escorted by guards.\""], answer: 1, expl: "Only this directly cites a currency-value cause." },
  ],
  "Command of Evidence (Quantitative)": [
    { passage: "A survey measured average daily reading time among students in three districts:\n\n  District A — 41 minutes\n  District B — 27 minutes\n  District C — 63 minutes\n\nA researcher concluded that reading time varies substantially across districts.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["District C's average is more than double District B's.", "All three districts averaged under an hour.", "District A's average is close to District B's.", "The survey covered three districts."], answer: 0, expl: "63 is more than twice 27 — direct evidence of substantial variation." },
    { passage: "A researcher tracked average sleep duration across four age groups:\n\n  Teens — 6.4 hours\n  Young adults — 6.9 hours\n  Middle-aged adults — 6.7 hours\n  Older adults — 7.3 hours\n\nThe researcher concluded that sleep duration generally increases after young adulthood.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Older adults averaged more sleep than the other three groups combined.", "Older adults' 7.3 hours is higher than the 6.4–6.9 hour range of the younger groups.", "Teens averaged the least sleep of the four groups.", "All four groups averaged fewer than eight hours of sleep."], answer: 1, expl: "This directly compares the older group's average to the others, supporting the trend." },
    { passage: "A city tracked bicycle commuting rates before and after adding protected bike lanes on three corridors:\n\n  Corridor A — 4% to 11%\n  Corridor B — 6% to 9%\n  Corridor C — 3% to 15%\n\nAn analyst concluded that the effect of protected lanes varied substantially by corridor.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Corridor C's increase (12 points) was four times larger than Corridor B's (3 points).", "All three corridors saw an increase in bicycle commuting.", "Corridor A's rate was higher than Corridor B's before the lanes were added.", "The city added lanes to three corridors."], answer: 0, expl: "Comparing the size of the increases directly shows the variation." },
    { passage: "A study compared crop yields under three irrigation methods over one growing season:\n\n  Flood irrigation — 3.1 tons/acre\n  Drip irrigation — 4.6 tons/acre\n  Sprinkler irrigation — 3.9 tons/acre\n\nThe study's authors concluded that drip irrigation was the most water-efficient choice for maximizing yield.", prompt: "Which choice from the table, if true, would most weaken the authors' conclusion?", choices: ["Drip irrigation also used more water per acre than the other two methods.", "Drip irrigation produced the highest yield of the three methods.", "Sprinkler irrigation produced a higher yield than flood irrigation.", "All three methods were tested on the same soil type."], answer: 0, expl: "If drip irrigation used more water, it would undercut the water-efficiency claim." },
    { passage: "A survey measured average commute times in five neighborhoods after a new subway line opened:\n\n  Neighborhood 1 — 22 min\n  Neighborhood 2 — 31 min\n  Neighborhood 3 — 19 min\n  Neighborhood 4 — 27 min\n  Neighborhood 5 — 24 min\n\nA transit official concluded that the subway line benefited some neighborhoods more than others.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Neighborhood 3's commute time is 12 minutes shorter than Neighborhood 2's.", "All five neighborhoods have access to the new subway line.", "Neighborhood 5's commute time falls in the middle of the range.", "Five neighborhoods were included in the survey."], answer: 0, expl: "The 12-minute gap directly shows unequal benefit across neighborhoods." },
    { passage: "A researcher compared test scores of students who used a tutoring app for different durations:\n\n  0–1 hours/week — 68 average\n  2–3 hours/week — 74 average\n  4–5 hours/week — 79 average\n  6+ hours/week — 78 average\n\nThe researcher concluded that additional tutoring time produces diminishing returns beyond a certain point.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Scores rose steadily from 0–1 to 4–5 hours but slightly declined from 4–5 to 6+ hours.", "Students who used the app for 0–1 hours scored above 65.", "Four groups were compared in the study.", "The app was used by students of various ages."], answer: 0, expl: "The leveling-off (and slight drop) after 4–5 hours is direct evidence of diminishing returns." },
    { passage: "A wildlife agency counted deer populations in a forest over four years following the reintroduction of wolves:\n\n  Year 1 — 1,200\n  Year 2 — 1,050\n  Year 3 — 950\n  Year 4 — 970\n\nA biologist concluded that the deer population decline leveled off after the third year.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["The population changed by only 20 between Year 3 and Year 4, far less than the drops in earlier years.", "The population was highest in Year 1.", "Wolves were reintroduced before the count began.", "The forest was surveyed over four years."], answer: 0, expl: "The small Year 3-to-4 change, compared to earlier drops, shows the leveling off." },
    { passage: "A quality-control team recorded manufacturing defect rates before and after a new inspection protocol at three plants:\n\n  Plant X — 4.2% to 1.8%\n  Plant Y — 3.5% to 3.1%\n  Plant Z — 5.0% to 1.1%\n\nThe team concluded that the new protocol's effectiveness varied widely across plants.", prompt: "Which choice most effectively uses data from the table to support the conclusion?", choices: ["Plant Z's defect rate dropped by 3.9 points while Plant Y's dropped by only 0.4 points.", "All three plants had defect rates above 1% before the change.", "Plant X's rate was higher than Plant Y's before the protocol began.", "Three plants adopted the new inspection protocol."], answer: 0, expl: "Comparing the size of each plant's improvement directly shows the variation." },
  ],
  Inferences: [
    { passage: "Volcanic ash layers can be dated precisely, so geologists use them as time markers in sediment cores. When a core contains no ash layer for a long stretch, dating that interval relies on slower, less exact methods; consequently, ______", prompt: "Which choice most logically completes the text?", choices: ["ash layers are found in every core.", "age estimates for ash-free intervals carry wider uncertainty.", "geologists avoid sediment cores entirely.", "sediment accumulates faster near volcanoes."], answer: 1, expl: "Less exact methods imply greater uncertainty." },
    { passage: "Tree rings in drought-resistant species typically narrow during dry years, but researchers studying a particular pine forest found no such narrowing during a documented multi-year drought. This suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["the forest received more rainfall than official records indicate.", "these particular trees may draw on a water source unaffected by surface drought, such as deep groundwater.", "tree rings are an unreliable indicator of any environmental change.", "the drought did not actually occur in that region."], answer: 1, expl: "An alternate water source would explain the absence of the expected pattern." },
    { passage: "Most online reviews of a product cluster around either five stars or one star, with very few in between. Marketing researchers note that people are far more likely to write a review when they feel strongly, whether positively or negatively, than when their experience was merely adequate. This pattern suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["most customers who buy the product are dissatisfied.", "average customer ratings drawn only from reviews may not reflect the experience of the typical buyer.", "companies should stop collecting customer reviews.", "five-star and one-star reviews are usually fake."], answer: 1, expl: "If only strong reactions get reviewed, the review average may be skewed." },
    { passage: "A species of migratory bird arrives at its northern breeding grounds several days earlier than it did fifty years ago, tracking with a similar shift in the timing of local insect hatches each spring. This pattern suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["the bird species is now extinct in its southern range.", "the birds' migration timing may be adjusting in response to a shifting food supply.", "insect hatches no longer depend on temperature.", "the birds have stopped migrating altogether."], answer: 1, expl: "The matched shift in timing points to the birds tracking their food supply." },
    { passage: "A city's water utility found that homes with older, analog water meters used, on average, 15 percent more water than homes with new digital meters that display real-time usage on a mobile app, even though pipe age and household size were similar. This suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["analog meters are less accurate than digital ones.", "visibility into real-time usage may itself encourage households to conserve water.", "digital meters use less water to operate.", "older homes have larger pipes than newer homes."], answer: 1, expl: "With other factors held similar, visibility into usage is the likeliest explanation." },
    { passage: "Archaeologists excavating a coastal settlement found cooking hearths built well above the highest known tide line for that era, based on shell deposits and sediment layers. This suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["the settlement's residents lacked knowledge of tides.", "the residents may have deliberately built away from flood-prone areas.", "the settlement was located far inland.", "the sea level in that era was lower than researchers assume."], answer: 1, expl: "Building above the known tide line suggests intentional flood avoidance." },
    { passage: "In a study of two otherwise similar schools, the one that started its day an hour later reported fewer tardiness incidents and higher first-period test scores, even though both schools had the same curriculum and teaching staff. This pattern suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["curriculum quality has no effect on test scores.", "start time itself may influence student punctuality and morning performance.", "the later-starting school had better teachers.", "test scores are unrelated to sleep schedules."], answer: 1, expl: "With curriculum and staff held equal, start time is the likeliest explanation." },
    { passage: "A restaurant chain that removed calorie counts from its menu, then reinstated them a year later, saw average order size shrink slightly in the months after reinstatement but return to its prior level within six months. This pattern suggests that ______", prompt: "Which choice most logically completes the text?", choices: ["calorie counts permanently change customer ordering habits.", "the initial effect of calorie information on orders may fade as customers grow accustomed to seeing it.", "customers ignored the calorie counts entirely.", "the restaurant's menu prices changed during this period."], answer: 1, expl: "The effect fading after six months suggests it was temporary, not permanent." },
  ],
  Boundaries: [
    { passage: "The 1908 Tunguska event flattened over 2,000 square kilometres of Siberian forest ______ no crater was ever found.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["forest, yet", "forest yet", "forest; yet,", "forest, yet,"], answer: 0, expl: "Comma + coordinating conjunction joins two independent clauses." },
    { passage: "Because the bridge's steel cables expand in summer heat ______ engineers designed the deck with expansion joints at both ends.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["heat;", "heat,", "heat", "heat:"], answer: 1, expl: "A comma follows an introductory dependent clause." },
    { passage: "The archive holds three rare items ______ a 15th-century atlas, a merchant's ledger, and a set of hand-coloured maps.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["items,", "items:", "items;", "items"], answer: 1, expl: "A colon introduces a list after an independent clause." },
    { passage: "The museum's newest wing houses ancient manuscripts ______ many of them had never been publicly displayed before.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["manuscripts, and", "manuscripts and", "manuscripts; and,", "manuscripts, and,"], answer: 0, expl: "Comma + coordinating conjunction joins two independent clauses." },
    { passage: "Because the reservoir's water level dropped sharply last summer ______ officials imposed temporary restrictions on agricultural use.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["summer;", "summer,", "summer", "summer:"], answer: 1, expl: "A comma follows an introductory dependent clause." },
    { passage: "The expedition carried three essential supplies ______ a satellite phone, a water filter, and a week's worth of dried rations.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["supplies,", "supplies:", "supplies;", "supplies"], answer: 1, expl: "A colon introduces a list after an independent clause." },
    { passage: "The orchestra's conductor rehearsed the piece for weeks ______ the opening night performance still ran nearly ten minutes over schedule.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["weeks, yet", "weeks yet", "weeks; yet,", "weeks, yet,"], answer: 0, expl: "Comma + coordinating conjunction joins two independent clauses." },
    { passage: "Since the bridge inspection revealed corrosion in several support beams ______ the city closed the span to heavy vehicles.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["beams;", "beams,", "beams", "beams:"], answer: 1, expl: "A comma follows an introductory dependent clause." },
    { passage: "The archive contains three types of historical records ______ tax ledgers, court transcripts, and personal letters.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["records,", "records:", "records;", "records"], answer: 1, expl: "A colon introduces a list after an independent clause." },
    { passage: "The lab results were inconclusive ______ the team decided to repeat the trial under stricter conditions.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["inconclusive;", "inconclusive,", "inconclusive so", "inconclusive, so,"], answer: 0, expl: "Two independent clauses may be joined by a semicolon alone." },
    { passage: "The negotiations dragged on for months ______ neither side was willing to compromise on the final clause.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["months, and", "months and", "months; and,", "months, and,"], answer: 0, expl: "Comma + coordinating conjunction joins two independent clauses." },
  ],
  "Form, Structure, and Sense": [
    { passage: "Each of the museum's three restoration labs ______ its own climate-control system.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["have", "has", "having", "to have"], answer: 1, expl: "'Each' is singular → 'has'." },
    { passage: "Neither the curator nor the assistants ______ able to explain the discrepancy in the catalogue.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["was", "were", "is", "being"], answer: 1, expl: "With 'neither…nor', the verb agrees with the nearer subject, 'assistants'." },
    { passage: "Each of the delegation's representatives ______ required to submit a signed disclosure form before the summit began.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["were", "was", "being", "are"], answer: 1, expl: "'Each' is singular → 'was'." },
    { passage: "Neither the committee chair nor the board members ______ aware of the funding shortfall until the audit was released.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["was", "were", "is", "being"], answer: 1, expl: "The verb agrees with the nearer subject, 'members' (plural)." },
    { passage: "The collection of rare coins, along with several manuscripts, ______ housed in a climate-controlled vault.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["are", "is", "were", "being"], answer: 1, expl: "The subject is 'collection' (singular); the added phrase doesn't change the verb." },
    { passage: "Not only the lead engineer but also her two assistants ______ credited in the patent filing.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["was", "were", "is", "being"], answer: 1, expl: "The verb agrees with the nearer subject, 'assistants' (plural)." },
    { passage: "Every one of the applicants ______ interviewed twice before a final decision was made.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["were", "was", "being", "have been"], answer: 1, expl: "'Every one' is singular → 'was'." },
    { passage: "The number of unresolved cases on the judge's docket ______ tripled since the courthouse reduced its staff.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["have", "has", "having", "were"], answer: 1, expl: "'The number' (singular subject) takes 'has'." },
    { passage: "A team of researchers, none of whom had previously studied the species, ______ surprised by how quickly the population recovered.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["were", "was", "being", "are"], answer: 1, expl: "'Team' acting as a single unit takes the singular 'was'." },
    { passage: "Either the mayor or her deputies ______ expected to address the press after the vote.", prompt: "Which choice completes the text so that it conforms to the conventions of Standard English?", choices: ["is", "are", "being", "was"], answer: 1, expl: "The verb agrees with the nearer subject, 'deputies' (plural)." },
  ],
  Transitions: [
    { passage: "Solar panel efficiency drops as panels heat up. ______ some installations in hot climates now include passive cooling channels beneath the modules.", prompt: "Which choice completes the text with the most logical transition?", choices: ["Nevertheless,", "For this reason,", "Similarly,", "In contrast,"], answer: 1, expl: "The second sentence is a response to the first — causal." },
    { passage: "Early studies suggested the compound was inert in mammals. ______ later trials using higher doses found measurable effects on liver enzymes.", prompt: "Which choice completes the text with the most logical transition?", choices: ["However,", "Therefore,", "Likewise,", "For example,"], answer: 0, expl: "The later finding contradicts the earlier one — contrast." },
    { passage: "The new firmware update fixed the battery-drain issue. ______ several users reported a new problem with Bluetooth connectivity.", prompt: "Which choice completes the text with the most logical transition?", choices: ["Consequently,", "However,", "Similarly,", "For example,"], answer: 1, expl: "A new problem arising is a contrast with the fix." },
    { passage: "The city's recycling program initially struggled with low participation. ______ officials redesigned the collection bins to make sorting easier, and participation doubled within a year.", prompt: "Which choice completes the text with the most logical transition?", choices: ["In response,", "Nevertheless,", "Likewise,", "In contrast,"], answer: 0, expl: "The redesign was a direct response to the low participation." },
    { passage: "Researchers found that the new alloy resists corrosion better than steel. ______ it is roughly three times more expensive to produce.", prompt: "Which choice completes the text with the most logical transition?", choices: ["Moreover,", "However,", "Therefore,", "Similarly,"], answer: 1, expl: "The cost is a drawback that contrasts with the benefit." },
    { passage: "The novelist's early work received little critical attention. ______ her later novels are now considered central to the genre.", prompt: "Which choice completes the text with the most logical transition?", choices: ["Yet", "Thus", "Similarly,", "For instance,"], answer: 0, expl: "Later recognition contrasts with early neglect." },
    { passage: "The company reduced its shipping times by switching to regional warehouses. ______ customer satisfaction scores rose within the first quarter.", prompt: "Which choice completes the text with the most logical transition?", choices: ["As a result,", "Nonetheless,", "In contrast,", "Meanwhile,"], answer: 0, expl: "The rise in satisfaction is a direct result of the change." },
    { passage: "The drought reduced the region's grain harvest significantly. ______ livestock feed prices in the area increased sharply.", prompt: "Which choice completes the text with the most logical transition?", choices: ["Accordingly,", "Nevertheless,", "For example,", "Similarly,"], answer: 0, expl: "The price increase follows logically from the reduced harvest." },
    { passage: "Early trials of the drug showed promising results in reducing inflammation. ______ later, larger trials failed to replicate those results.", prompt: "Which choice completes the text with the most logical transition?", choices: ["Consequently,", "However,", "Additionally,", "Specifically,"], answer: 1, expl: "The later failure contrasts with the early promise." },
    { passage: "The team's defense allowed the fewest points in the league this season. ______ its offense ranked near the bottom in scoring.", prompt: "Which choice completes the text with the most logical transition?", choices: ["Similarly,", "Yet", "Therefore,", "For example,"], answer: 1, expl: "A strong defense paired with a weak offense is a contrast." },
  ],
  "Rhetorical Synthesis": [
    { passage: "While researching, a student has taken these notes:\n\n  • Karakalpak yurt-making uses steam-bent willow frames.\n  • The craft was inscribed on UNESCO's intangible heritage list in 2023.\n  • Fewer than 40 master craftspeople remain.\n  • Apprenticeships now run in Nukus.", prompt: "The student wants to emphasize efforts to sustain the craft. Which choice most effectively uses the notes to accomplish this goal?", choices: ["Karakalpak yurt frames are steam-bent from willow.", "Although fewer than 40 masters remain, apprenticeships in Nukus aim to pass the craft on.", "UNESCO inscribed the craft in 2023.", "Yurt-making is a traditional Karakalpak craft."], answer: 1, expl: "Only this foregrounds an effort to sustain the craft." },
    { passage: "While researching, a student has taken these notes:\n\n  • The city's first public library opened in 1911 with a donation of 2,000 books.\n  • By 1950, the collection had grown to over 40,000 volumes.\n  • A 1962 fire destroyed roughly a third of the collection.\n  • The library reopened within two years with community-donated books.", prompt: "The student wants to emphasize the community's role in rebuilding the library. Which choice most effectively uses the notes to accomplish this goal?", choices: ["The library opened in 1911 with 2,000 donated books.", "After a 1962 fire destroyed a third of its collection, the library reopened within two years thanks to donations from the community.", "The library's collection reached 40,000 volumes by 1950.", "A fire in 1962 damaged part of the library's collection."], answer: 1, expl: "Only this choice ties the rebuilding directly to community donations." },
    { passage: "While researching, a student has taken these notes:\n\n  • The bridge was completed in 1937 after four years of construction.\n  • It was the longest suspension bridge in the world at the time.\n  • Engineers used a new wind-resistant truss design.\n  • The design has since been adopted in over 30 similar bridges worldwide.", prompt: "The student wants to highlight the bridge's lasting influence on engineering. Which choice most effectively uses the notes to accomplish this goal?", choices: ["The bridge took four years to build, finishing in 1937.", "At completion, it was the world's longest suspension bridge.", "The wind-resistant truss design pioneered on this bridge has since been used in more than 30 other bridges.", "The bridge remains a popular tourist attraction today."], answer: 2, expl: "Only this choice shows the design's lasting influence on later bridges." },
    { passage: "While researching, a student has taken these notes:\n\n  • The composer wrote her first symphony at age 19.\n  • She was denied entry to the national conservatory because of her gender.\n  • She studied privately instead, under a retired orchestra conductor.\n  • Her fourth symphony premiered to a standing ovation in 1954.", prompt: "The student wants to emphasize the obstacles the composer overcame. Which choice most effectively uses the notes to accomplish this goal?", choices: ["She wrote her first symphony at nineteen.", "Barred from the conservatory because of her gender, she trained privately under a retired conductor.", "Her fourth symphony premiered in 1954.", "The premiere received a standing ovation."], answer: 1, expl: "Only this choice foregrounds the obstacle and how she overcame it." },
    { passage: "While researching, a student has taken these notes:\n\n  • The startup launched with three employees in a rented garage.\n  • Its first product failed to gain traction after launch.\n  • The founders pivoted to a new business model within six months.\n  • The company now employs over 800 people.", prompt: "The student wants to emphasize the founders' willingness to adapt. Which choice most effectively uses the notes to accomplish this goal?", choices: ["The company started with three employees in a garage.", "When its first product failed, the company pivoted to a new model within six months.", "The company now has more than 800 employees.", "The startup's first office was a rented garage."], answer: 1, expl: "Only this choice highlights the founders' response to failure." },
    { passage: "While researching, a student has taken these notes:\n\n  • The reservoir was built in 1968 to supply water to three counties.\n  • A prolonged drought in the 2010s reduced its capacity by half.\n  • Engineers installed a new filtration system to reduce water loss.\n  • Water loss dropped by 22 percent after installation.", prompt: "The student wants to emphasize the effectiveness of the engineering response to the drought. Which choice most effectively uses the notes to accomplish this goal?", choices: ["The reservoir was built in 1968.", "A drought in the 2010s cut the reservoir's capacity in half.", "After the new filtration system was installed, water loss fell by 22 percent.", "The reservoir supplies water to three counties."], answer: 2, expl: "Only this choice shows a measured effect of the engineering response." },
    { passage: "While researching, a student has taken these notes:\n\n  • The clinic began as a single room staffed by volunteers.\n  • It served fewer than 50 patients in its first year.\n  • A grant in 2005 funded a permanent building and paid staff.\n  • The clinic now serves over 12,000 patients annually.", prompt: "The student wants to illustrate how much the clinic has grown since its founding. Which choice most effectively uses the notes to accomplish this goal?", choices: ["The clinic began in a single room staffed by volunteers.", "From serving fewer than 50 patients in its first year, the clinic now serves over 12,000 annually.", "A grant in 2005 funded a permanent building.", "The clinic relied on volunteers early on."], answer: 1, expl: "Only this choice directly contrasts the founding scale with today's scale." },

function buildModule(mod, testId, diffPath) {

    const isSPR = mod.kind === "math" && i >= Math.floor(bp.length * 0.75);

  });

function buildModuleCached(mod, testId, diffPath) {
  if (mod.kind === "break") return [];
  const basis = mod.adaptive ? (diffPath || "easy") : "standard";
  const cacheKey = `sws_qcache_${testId}_${mod.id}_${basis}`;
  const cached = loadLocal(cacheKey, null);

  const fresh = buildModule(mod, testId, diffPath);
  saveLocal(cacheKey, fresh);

}
function scaleSection(rawCorrect, rawTotal, routedHard) {
  const pct = rawTotal ? rawCorrect / rawTotal : 0;
  const ceiling = routedHard ? 800 : 620, floor = 200;
  return Math.max(200, Math.min(800, Math.round((floor + pct * (ceiling - floor)) / 10) * 10));
}
function gradeTest(testId, responses, diffPath) {
  const perDomain = {}; const perSection = { rw: { c: 0, t: 0 }, math: { c: 0, t: 0 } }; const wrong = [];
  MODULES.filter((m) => m.kind !== "break").forEach((mod) => {
    const basis = mod.id === "rw2" ? diffPath.rw1 : mod.id === "m2" ? diffPath.m1 : null;
    const qs = buildModuleCached(mod, testId, basis);
    qs.forEach((q, i) => {
      const r = responses[`${mod.id}-${i}`];
      let ok = q.type === "spr" ? String(r ?? "").trim() !== "" && String(r).trim() === String(q.answer) : r === q.answer;
      perDomain[q.domain] = perDomain[q.domain] || { c: 0, t: 0 }; perDomain[q.domain].t++; if (ok) perDomain[q.domain].c++;
      else wrong.push({ domain: q.domain, skill: q.skill, prompt: q.prompt, expl: q.expl, module: mod.label });
      const sec = mod.kind === "rw" ? "rw" : "math"; perSection[sec].t++; if (ok) perSection[sec].c++;

  const mathScore = scaleSection(perSection.math.c, perSection.math.t, diffPath.m1 === "hard");
  return { rwScore, mathScore, total: rwScore + mathScore, rwRaw: perSection.rw, mathRaw: perSection.math, perDomain, wrong };
}

/* ============================================================
   CALCULATOR / GRAPHER
   On the real (Vercel) domain, the Desmos Graphing Calculator API
   loads normally and is used directly \u2014 the same tool the real
   Digital SAT provides. Desmos's script cannot load inside a
   published Claude artifact (its content-security policy only
   allows scripts from cdnjs/jsdelivr/tailwind/jquery CDNs), so a
   small self-built calculator + function grapher is kept as an
   automatic fallback there.
============================================================ */
function DesmosCalc({ onClose }) {
  const hostRef = useRef(null);
  const calcRef = useRef(null);
  useEffect(() => {
    if (!hostRef.current || !window.Desmos) return;
    calcRef.current = window.Desmos.GraphingCalculator(hostRef.current, {
      keypad: true, expressions: true, settingsMenu: false, zoomButtons: true,
      lockViewport: false, border: false, expressionsTopbar: true,
    });
    return () => { if (calcRef.current) { calcRef.current.destroy(); calcRef.current = null; } };
  }, []);
  return (
    <div style={{ position: "fixed", bottom: 20, right: 20, width: 420, height: 460, background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, boxShadow: "0 12px 32px rgba(22,32,77,0.25)", zIndex: 200, fontFamily: FONT, overflow: "hidden", display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: B.navy, color: "#fff", padding: "9px 14px", flexShrink: 0 }}>
        <span style={{ fontSize: 12.5, fontWeight: 700 }}>Desmos kalkulyator</span>
        <button onClick={onClose} style={{ background: "transparent", border: "none", color: "#fff", cursor: "pointer", display: "flex" }}><X size={15} /></button>
      </div>
      <div ref={hostRef} style={{ flex: 1, minHeight: 0 }} />
    </div>
  );
}
function CalcPanel({ onClose }) {
  const [tab, setTab] = useState("calc");
  const [expr, setExpr] = useState("");
  const [result, setResult] = useState("");
  const [fn, setFn] = useState("x^2 - 3x + 2");
  const canvasRef = useRef(null);
  const [desmosReady] = useState(() => typeof window !== "undefined" && !!window.Desmos);

  const press = (v) => setExpr((e) => e + v);
  const clear = () => { setExpr(""); setResult(""); };
  const backspace = () => setExpr((e) => e.slice(0, -1));
  const evaluate = () => {
    try {
      const clean = expr.replace(/\^/g, "**").replace(/π/g, "Math.PI").replace(/√/g, "Math.sqrt")
        .replace(/sin\(/g, "Math.sin(").replace(/cos\(/g, "Math.cos(").replace(/tan\(/g, "Math.tan(")
        .replace(/ln\(/g, "Math.log(").replace(/log\(/g, "Math.log10(");
      // eslint-disable-next-line no-new-func
      const val = Function(`"use strict"; return (${clean})`)();
      setResult(String(Math.round(val * 1e8) / 1e8));
    } catch (e) { setResult("Xato"); }
  };

  useEffect(() => {
    if (desmosReady || tab !== "graph" || !canvasRef.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#E2E4E8"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
    const scale = 20;
    let compiled;
    try {
      const clean = fn.replace(/\^/g, "**").replace(/π/g, "Math.PI")
        .replace(/sin\(/g, "Math.sin(").replace(/cos\(/g, "Math.cos(").replace(/tan\(/g, "Math.tan(")
        .replace(/sqrt\(/g, "Math.sqrt(").replace(/ln\(/g, "Math.log(");
      compiled = Function("x", `"use strict"; return (${clean});`);
    } catch (e) { return; }
    ctx.strokeStyle = "#6B3FA0"; ctx.lineWidth = 2; ctx.beginPath();
    let first = true;
    for (let px = 0; px <= w; px++) {
      const x = (px - w / 2) / scale;
      let y;
      try { y = compiled(x); } catch (e) { y = NaN; }
      if (!isFinite(y)) { first = true; continue; }
      const py = h / 2 - y * scale;
      if (first) { ctx.moveTo(px, py); first = false; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  }, [tab, fn, desmosReady]);

  if (desmosReady) return <DesmosCalc onClose={onClose} />;

  return (
    <div style={{ position: "fixed", bottom: 20, right: 20, width: 300, background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, boxShadow: "0 12px 32px rgba(22,32,77,0.25)", zIndex: 200, fontFamily: FONT, overflow: "hidden" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: B.navy, color: "#fff", padding: "9px 14px" }}>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={() => setTab("calc")} style={{ background: tab === "calc" ? "rgba(255,255,255,0.2)" : "transparent", border: "none", color: "#fff", borderRadius: 6, padding: "4px 10px", fontSize: 12, cursor: "pointer", fontFamily: FONT }}>Kalkulyator</button>
          <button onClick={() => setTab("graph")} style={{ background: tab === "graph" ? "rgba(255,255,255,0.2)" : "transparent", border: "none", color: "#fff", borderRadius: 6, padding: "4px 10px", fontSize: 12, cursor: "pointer", fontFamily: FONT }}>Grafik</button>
        </div>
        <button onClick={onClose} style={{ background: "transparent", border: "none", color: "#fff", cursor: "pointer", display: "flex" }}><X size={15} /></button>
      </div>
      {tab === "calc" ? (
        <div style={{ padding: 12 }}>
          <div style={{ background: B.bg, borderRadius: 8, padding: "10px 12px", marginBottom: 8, minHeight: 44 }}>
            <div style={{ fontSize: 13, color: B.muted, minHeight: 16, wordBreak: "break-all" }}>{expr || "0"}</div>
            {result && <div style={{ fontSize: 17, fontWeight: 800, color: B.text }}>{result}</div>}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 5 }}>
            {["sin(", "cos(", "tan(", "ln(", "√("].map((k) => (
              <button key={k} onClick={() => press(k)} style={{ padding: "8px 0", fontSize: 11.5, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k.replace("(", "")}</button>
            ))}
            {["7", "8", "9", "/", "("].map((k) => (
              <button key={k} onClick={() => press(k)} style={{ padding: "10px 0", fontSize: 14, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k}</button>
            ))}
            {["4", "5", "6", "*", ")"].map((k) => (
              <button key={k} onClick={() => press(k)} style={{ padding: "10px 0", fontSize: 14, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k}</button>
            ))}
            {["1", "2", "3", "-", "^"].map((k) => (
              <button key={k} onClick={() => press(k)} style={{ padding: "10px 0", fontSize: 14, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k}</button>
            ))}
            {["0", ".", "π", "+", "⌫"].map((k) => (
              <button key={k} onClick={() => (k === "⌫" ? backspace() : press(k === "π" ? "π" : k))} style={{ padding: "10px 0", fontSize: 14, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer" }}>{k}</button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
            <button onClick={clear} style={{ flex: 1, padding: "9px 0", fontSize: 13, border: `1px solid ${B.border}`, borderRadius: 6, background: "#fff", cursor: "pointer", fontWeight: 700 }}>C</button>
            <button onClick={evaluate} style={{ flex: 2, padding: "9px 0", fontSize: 13, border: "none", borderRadius: 6, background: B.plum, color: "#fff", cursor: "pointer", fontWeight: 700 }}>=</button>
          </div>
        </div>
      ) : (
        <div style={{ padding: 12 }}>
          <input value={fn} onChange={(e) => setFn(e.target.value)} placeholder="masalan: x^2 - 3x + 2"
            style={{ width: "100%", padding: "9px 11px", border: `1px solid ${B.border}`, borderRadius: 7, fontSize: 13, fontFamily: FONT, boxSizing: "border-box", marginBottom: 8 }} />
          <canvas ref={canvasRef} width={276} height={200} style={{ width: "100%", borderRadius: 8, border: `1px solid ${B.border}` }} />
          <div style={{ fontSize: 11, color: B.muted, marginTop: 6 }}>y = {fn.replace(/\^/g, "^")}</div>
        </div>
      )}
    </div>
  );
}

function TestRunner({ test, onExit, onFinish }) {
  const [stage, setStage] = useState({ type: "intro", modIdx: 0 });
  const [responses, setResponses] = useState({});
  const [marked, setMarked] = useState({});
  const [navOpen, setNavOpen] = useState(false);
  const [qIndex, setQIndex] = useState(0);
  const [seconds, setSeconds] = useState(0);
  const [diffPath, setDiffPath] = useState({});
  const [calcOpen, setCalcOpen] = useState(false);

  const mod = MODULES[stage.modIdx];
  const questions = useMemo(() => {
    if (!mod || mod.kind === "break") return [];
    const basis = mod.id === "rw2" ? diffPath.rw1 : mod.id === "m2" ? diffPath.m1 : null;
    return buildModuleCached(mod, test.id, basis);
  }, [stage.modIdx, test.id, diffPath.rw1, diffPath.m1]);

  useEffect(() => {
    if (stage.type !== "module" && stage.type !== "break") return;
    const t = setInterval(() => setSeconds((s) => (s > 0 ? s - 1 : 0)), 1000);
    return () => clearInterval(t);
  }, [stage]);

  const advance = () => {
    if (mod.kind !== "break") {
      let correct = 0;
      questions.forEach((q, i) => {
        const r = responses[`${mod.id}-${i}`];
        if (q.type === "spr") { if (String(r ?? "").trim() === String(q.answer)) correct++; } else if (r === q.answer) correct++;
      });
      if (mod.id === "rw1" || mod.id === "m1") setDiffPath((d) => ({ ...d, [mod.id]: correct / questions.length >= 0.6 ? "hard" : "easy" }));
    }
    const nextIdx = stage.modIdx + 1;
    if (nextIdx >= MODULES.length) { onFinish(responses, diffPath); return; }
    const nm = MODULES[nextIdx];
    if (nm.kind === "break") { setSeconds(nm.minutes * 60); setStage({ type: "break", modIdx: nextIdx }); }
    else setStage({ type: "intro", modIdx: nextIdx });

  if (stage.type === "intro") {

              <div style={{ background: "#FFF7E8", borderRadius: 10, padding: "12px 16px", fontSize: 13, marginBottom: 20, display: "flex", gap: 8, textAlign: "left" }}>

              </div>
            )}
            <button onClick={() => { setSeconds(mod.minutes * 60); setQIndex(0); setStage({ type: "module", modIdx: stage.modIdx }); }} style={{ background: "#0060C8", color: "#fff", border: "none", borderRadius: 8, padding: "12px 34px", fontSize: 15, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Boshlash</button>
          </div>
        </div>
      </div>
    );
  }
  if (stage.type === "break") {
    return (
      <div style={{ height: "100vh", display: "flex", flexDirection: "column", background: "#fff", fontFamily: FONT }}>
        <div style={{ background: "#0B0E14", color: "#fff", padding: "10px 22px", fontSize: 13.5, fontWeight: 600 }}>{test.name} — Tanaffus</div>
        <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 14 }}>
          <Coffee size={42} color={B.plum} />
          <h2 style={{ fontSize: 24, fontWeight: 800, margin: 0 }}>10 daqiqalik tanaffus</h2>

        </div>
      </div>
    );
  }

  const q = questions[qIndex]; const key = `${mod.id}-${qIndex}`; const answered = responses[key]; const isLast = qIndex === questions.length - 1;
  return (
    <div style={{ height: "100vh", display: "flex", flexDirection: "column", fontFamily: "'Segoe UI', Arial, sans-serif", background: "#fff", position: "relative" }}>

          <button onClick={onExit} style={{ background: "transparent", border: "none", color: "#9AA1AE", cursor: "pointer", display: "flex" }}><X size={16} /></button>
          <span style={{ fontWeight: 600 }}>{mod.label}: {mod.section}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: "#1A1E27", padding: "5px 14px", borderRadius: 6 }}><Clock size={14} /><span style={{ fontVariantNumeric: "tabular-nums" }}>{fmt(seconds)}</span></div>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>

      <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>
        {q.passage && <div style={{ flex: 1, padding: "28px 34px", borderRight: "1px solid #E2E4E8", overflowY: "auto", fontSize: 15.5, lineHeight: 1.7, color: "#12151C", whiteSpace: "pre-line" }}>{q.passage}</div>}

            <button onClick={() => setMarked((m) => ({ ...m, [key]: !m[key] }))} style={{ background: "transparent", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: marked[key] ? "#B8860B" : "#5B6270" }}><Flag size={15} fill={marked[key] ? "#F5A623" : "none"} color={marked[key] ? "#F5A623" : "#5B6270"} /> Mark for Review</button>

const POOL_TOTAL = 500;
const diffForIndex = (i, total) => (i < total / 3 ? "Easy" : i < (2 * total) / 3 ? "Medium" : "Hard");
function genBankQuestion(domain, index) {
  const difficulty = diffForIndex(index, POOL_TOTAL);
  if (domain.kind === "math") {
    const g = genMath(MATH_SKILL_MAP[domain.d], freshRng(), false);

          </div>

            <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Savolingizni yozing…" style={{ flex: 1, padding: "13px 16px", border: `1px solid ${B.border}`, borderRadius: 11, fontSize: 14, fontFamily: FONT, outline: "none" }} />
            <button onClick={send} disabled={busy} style={{ background: busy ? B.muted : B.plum, border: "none", borderRadius: 11, padding: "0 20px", color: "#fff", cursor: busy ? "default" : "pointer", display: "flex", alignItems: "center" }}><Send size={17} /></button>
          </div>
        </>
      )}
    </div>
  );
}

function Analytics({ history }) {
  if (history.length === 0) {
    return (
      <div>
        <h1 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 4px" }}>Tahlil</h1>
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 50, textAlign: "center", marginTop: 20 }}>
          <BarChart3 size={36} color={B.muted} />
          <div style={{ fontSize: 15, fontWeight: 700, marginTop: 14, marginBottom: 6 }}>Hali ma'lumot yo'q</div>
          <div style={{ fontSize: 13.5, color: B.muted }}>Birinchi mock testni yeching — tahlil shundan keyin javoblaringiz asosida chiqadi.</div>
        </div>
      </div>
    );
  }
  const scores = history.map((h) => h.total); const max = 1600, min = 400;
  const agg = {}; history.forEach((h) => Object.entries(h.perDomain).forEach(([d, v]) => { agg[d] = agg[d] || { c: 0, t: 0 }; agg[d].c += v.c; agg[d].t += v.t; }));
  const wrongByDomain = {}; history.forEach((h) => h.wrong.forEach((w) => { wrongByDomain[w.skill] = (wrongByDomain[w.skill] || 0) + 1; }));
  const topWrong = Object.entries(wrongByDomain).sort((a, b) => b[1] - a[1]).slice(0, 6);
  return (
    <div>
      <h1 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 4px" }}>Tahlil</h1>
      <p style={{ fontSize: 14, color: B.muted, margin: "0 0 20px" }}>{history.length} ta yechilgan test asosida</p>
      <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 24, marginBottom: 16 }}>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 20 }}>Ball dinamikasi</div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 18, height: 160, overflowX: "auto" }}>
          {scores.map((s, i) => (
            <div key={i} style={{ flex: "0 0 60px", display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: B.plum }}>{s}</div>
              <div style={{ width: 40, height: `${((s - min) / (max - min)) * 120}px`, background: B.plum, borderRadius: "6px 6px 0 0" }} />
              <div style={{ fontSize: 10.5, color: B.muted, textAlign: "center" }}>#{history[i].testId}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 24, marginBottom: 16 }}>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 16 }}>Domen bo'yicha umumiy aniqlik</div>
        {Object.entries(agg).map(([d, v]) => { const p = Math.round((v.c / v.t) * 100);
          return (
            <div key={d} style={{ marginBottom: 11 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}><span>{d}</span><span style={{ fontWeight: 700, color: p < 60 ? B.rose : B.green }}>{v.c}/{v.t} · {p}%</span></div>
              <div style={{ height: 6, background: B.bg, borderRadius: 3 }}><div style={{ height: 6, width: `${p}%`, background: p < 60 ? B.rose : B.plum, borderRadius: 3 }} /></div>
            </div>
          );
        })}
      </div>
      {topWrong.length > 0 && (
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 24 }}>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 14, display: "flex", alignItems: "center", gap: 8 }}><RotateCcw size={15} color={B.rose} /> Eng ko'p xato qilingan ko'nikmalar</div>
          {topWrong.map(([s, n]) => (<div key={s} style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, padding: "9px 0", borderBottom: `1px solid ${B.bg}` }}><span>{s}</span><span style={{ color: B.rose, fontWeight: 700 }}>{n} ta xato</span></div>))}
        </div>
      )}
    </div>
  );
}

function DashHome({ history, onGoTests, todaySeconds, goalMinutes, streak, onGoProfile, targetScore, examDate }) {
  const last = history[history.length - 1]; const prev = history[history.length - 2];
  const remindToStudy = todaySeconds < goalMinutes * 60;
  const daysLeft = examDate ? Math.max(0, Math.ceil((new Date(examDate) - new Date()) / 86400000)) : null;
  const agg = {};
  history.forEach((h) => Object.entries(h.perDomain).forEach(([d, v]) => { agg[d] = agg[d] || { c: 0, t: 0 }; agg[d].c += v.c; agg[d].t += v.t; }));
  let weakest = Object.entries(agg).filter(([, v]) => v.t >= 2).sort((a, b) => a[1].c / a[1].t - b[1].c / b[1].t).slice(0, 3);
  if (weakest.length === 0) {
    const onboardingWeak = loadLocal("sws_weak_areas", []);
    weakest = onboardingWeak.slice(0, 3).map((d) => [d, { c: 0, t: 0 }]);
  }
  const perDomainMinutes = weakest.length ? Math.max(5, Math.round(goalMinutes / weakest.length)) : 0;
  return (
    <div>
      <h1 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 4px" }}>Xush kelibsiz</h1>
      <p style={{ fontSize: 14, color: B.muted, margin: "0 0 22px" }}>{history.length === 0 ? "Hali test yechmagansiz." : `${history.length} ta test yechildi.`}</p>

      {(targetScore || daysLeft !== null) && (
        <div style={{ background: B.navy, color: "#fff", borderRadius: 14, padding: "16px 20px", marginBottom: 16, display: "flex", gap: 24, flexWrap: "wrap" }}>
          {targetScore && <div><div style={{ fontSize: 11, opacity: 0.7 }}>MAQSAD BALL</div><div style={{ fontSize: 22, fontWeight: 800 }}>{targetScore}</div></div>}
          {daysLeft !== null && <div><div style={{ fontSize: 11, opacity: 0.7 }}>IMTIHONGACHA</div><div style={{ fontSize: 22, fontWeight: 800 }}>{daysLeft} kun</div></div>}
          {last && targetScore && <div><div style={{ fontSize: 11, opacity: 0.7 }}>MAQSADGACHA QOLDI</div><div style={{ fontSize: 22, fontWeight: 800, color: targetScore - last.total <= 0 ? B.green : B.gold }}>{Math.max(0, targetScore - last.total)} ball</div></div>}
        </div>
      )}

      {remindToStudy && (
        <div style={{ background: "#FFF7E8", border: `1px solid ${B.gold}44`, borderRadius: 12, padding: "13px 16px", marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
          <span style={{ fontSize: 13.5 }}>⏰ Bugun hali {fmtMinutes(Math.max(0, goalMinutes * 60 - todaySeconds))} maqsadingizgacha qoldi. Streak: 🔥{streak}</span>
          <button onClick={onGoProfile} style={{ background: B.gold, color: B.navy, border: "none", borderRadius: 8, padding: "7px 14px", fontSize: 12.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>Maqsadni ko'rish</button>
        </div>
      )}

      {weakest.length > 0 && (
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 18, marginBottom: 18 }}>
          <div style={{ fontSize: 13.5, fontWeight: 700, marginBottom: 10 }}>📋 Bugungi shaxsiy reja</div>
          {weakest.map(([d, v]) => (
            <div key={d} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "7px 0", borderBottom: `1px solid ${B.bg}` }}>
              <span>{d} <span style={{ color: B.muted }}>{v.t > 0 ? `(${Math.round((v.c / v.t) * 100)}% aniqlik)` : "(tanlangan)"}</span></span>
              <span style={{ fontWeight: 700, color: B.plum }}>{perDomainMinutes} daq</span>
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 16, marginBottom: 18 }}>
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 22, display: "flex", alignItems: "center", gap: 22 }}>
          <div style={{ position: "relative", width: 88, height: 88 }}>
            <svg width="88" height="88" viewBox="0 0 88 88">
              <circle cx="44" cy="44" r="38" stroke={B.border} strokeWidth="9" fill="none" />
              <circle cx="44" cy="44" r="38" stroke={B.plum} strokeWidth="9" fill="none" strokeDasharray={2 * Math.PI * 38} strokeDashoffset={2 * Math.PI * 38 * (1 - (last ? last.total : 0) / 1600)} strokeLinecap="round" transform="rotate(-90 44 44)" />
            </svg>
            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, fontWeight: 800 }}>{last ? last.total : "—"}</div>
          </div>
          <div>
            <div style={{ fontSize: 13, color: B.muted, marginBottom: 4 }}>Oxirgi umumiy ball</div>
            {prev && <div style={{ fontSize: 13, color: last.total >= prev.total ? B.green : B.rose, fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}><TrendingUp size={14} /> {last.total - prev.total >= 0 ? "+" : ""}{last.total - prev.total} oxirgi testdan beri</div>}
          </div>
        </div>
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 22 }}>
          <div style={{ fontSize: 13, color: B.muted, marginBottom: 12 }}>Bo'limlar</div>
          {last ? [["Reading & Writing", last.rwScore], ["Math", last.mathScore]].map(([n, s]) => (
            <div key={n} style={{ marginBottom: 11 }}><div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 4 }}><span>{n}</span><span style={{ fontWeight: 700 }}>{s}</span></div><div style={{ height: 6, background: B.bg, borderRadius: 3 }}><div style={{ height: 6, width: `${((s - 200) / 600) * 100}%`, background: B.plum, borderRadius: 3 }} /></div></div>
          )) : <div style={{ fontSize: 13, color: B.muted }}>Test yechganingizdan keyin chiqadi.</div>}
        </div>
      </div>
      <button onClick={onGoTests} style={{ width: "100%", background: B.plum, color: "#fff", border: "none", borderRadius: 14, padding: "18px 22px", textAlign: "left", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", fontFamily: FONT }}>
        <div><div style={{ fontSize: 15, fontWeight: 700, marginBottom: 3 }}>Mock testni boshlash</div><div style={{ fontSize: 12.5, opacity: 0.85 }}>200 ta testdan tanlang</div></div>
        <ChevronRight size={20} />
      </button>
    </div>
  );
}

/* ============================================================
   GAMIFICATION HELPERS
============================================================ */
function todayStr() { return new Date().toISOString().slice(0, 10); }
function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); }
function getClientId() {
  let id = loadLocal("sws_client_id", null);
  if (!id) { id = "u" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); saveLocal("sws_client_id", id); }
  return id;
}
function fmtMinutes(sec) {
  const m = Math.floor(sec / 60);
  if (m < 60) return `${m} daq`;
  return `${Math.floor(m / 60)} soat ${m % 60} daq`;
}

/* ============================================================
   PROFILE
============================================================ */

  return (
    <div>

      {(targetScore || daysLeft !== null) && (
        <div style={{ background: B.navy, color: "#fff", borderRadius: 14, padding: "16px 20px", marginBottom: 18, display: "flex", gap: 24, flexWrap: "wrap" }}>
          {targetScore && <div><div style={{ fontSize: 11, opacity: 0.7 }}>MAQSAD BALL</div><div style={{ fontSize: 22, fontWeight: 800 }}>{targetScore}</div></div>}
          {daysLeft !== null && <div><div style={{ fontSize: 11, opacity: 0.7 }}>IMTIHONGACHA</div><div style={{ fontSize: 22, fontWeight: 800 }}>{daysLeft} kun</div></div>}

      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 16, marginBottom: 18 }}>
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 20, textAlign: "center" }}>
          <div style={{ fontSize: 30, fontWeight: 800, color: B.plum }}>🔥 {streak}</div>
          <div style={{ fontSize: 12.5, color: B.muted, marginTop: 4 }}>kunlik streak</div>
        </div>
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 20, textAlign: "center" }}>
          <div style={{ fontSize: 30, fontWeight: 800, color: B.text }}>{fmtMinutes(todaySeconds)}</div>
          <div style={{ fontSize: 12.5, color: B.muted, marginTop: 4 }}>bugun ishlangan</div>
        </div>
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 20, textAlign: "center" }}>
          <div style={{ fontSize: 30, fontWeight: 800, color: B.text }}>{allTimeMinutes} daq</div>
          <div style={{ fontSize: 12.5, color: B.muted, marginTop: 4 }}>jami (barcha vaqt)</div>
        </div>
      </div>

      <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 22, marginBottom: 18 }}>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 14 }}>Haftalik streak</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 8 }}>
          {["Du", "Se", "Ch", "Pa", "Ju", "Sh", "Ya"].map((d, i) => {
            const daysAgo = 6 - i;
            const active = streak > daysAgo;
            const isToday = i === 6;
            return (
              <div key={d} style={{ textAlign: "center" }}>
                <div style={{ fontSize: 11, color: B.muted, marginBottom: 6 }}>{d}</div>
                <div style={{
                  width: "100%", aspectRatio: "1", borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center",
                  background: active ? B.plum : B.bg, border: isToday ? `2px solid ${B.gold}` : "none",
                }}>
                  {active && <Check size={15} color="#fff" />}
                </div>
              </div>
            );
          })}

      </div>

      <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 22, marginBottom: 18 }}>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Bugungi maqsad</div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 6 }}>
          <span>{fmtMinutes(todaySeconds)} / {goalMinutes} daq</span><span style={{ fontWeight: 700, color: pct >= 100 ? B.green : B.plum }}>{pct}%</span>
        </div>
        <div style={{ height: 8, background: B.bg, borderRadius: 4, marginBottom: 16 }}><div style={{ height: 8, width: `${pct}%`, background: pct >= 100 ? B.green : B.plum, borderRadius: 4 }} /></div>

      <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 22 }}>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Ismingiz</div>

          <input value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="Ismingizni kiriting" style={{ flex: 1, padding: "10px 14px", border: `1px solid ${B.border}`, borderRadius: 9, fontSize: 14, fontFamily: FONT }} />
          <button onClick={() => setName(draft)} style={{ background: B.plum, color: "#fff", border: "none", borderRadius: 9, padding: "10px 20px", fontSize: 13.5, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Saqlash</button>
        </div>
        <div style={{ fontSize: 11.5, color: B.muted, marginTop: 8 }}>Ismingiz "Jamiyat" bo'limida boshqa o'quvchilarga ko'rinadi.</div>
      </div>
    </div>
  );
}

/* ============================================================
   COMMUNITY — online presence (room) + shared study stats (db)
============================================================ */
function Community({ clientId, name, peers, roster, roomReady, dbReady }) {
  const onlineIds = new Set(peers.map((p) => p.clientId).filter(Boolean));
  const merged = Object.values(roster || {})
    .filter((r) => r.id !== clientId)
    .map((r) => ({ ...r, online: onlineIds.has(r.id) }))
    .sort((a, b) => (b.online - a.online) || (b.minutesToday || 0) - (a.minutesToday || 0));

  return (
    <div>
      <h1 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 4px" }}>Jamiyat</h1>
      <p style={{ fontSize: 14, color: B.muted, margin: "0 0 18px" }}>Boshqa o'quvchilar bilan bir vaqtda mashq qiling.</p>

      {!roomReady && !dbReady && (
        <div style={{ background: "#FFF7E8", borderRadius: 10, padding: "13px 16px", fontSize: 13, marginBottom: 16 }}>
          Jamiyat funksiyasi bu ko'rinishda mavjud emas.
        </div>
      )}

      <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, overflow: "hidden" }}>
        <div style={{ padding: "14px 20px", borderBottom: `1px solid ${B.border}`, fontSize: 13.5, fontWeight: 700 }}>
          {merged.length > 0 ? `${merged.length} ta o'quvchi` : "Hozircha boshqa o'quvchi yo'q"}
        </div>
        {merged.map((r) => (
          <div key={r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 20px", borderBottom: `1px solid ${B.bg}` }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: r.online ? B.green : B.border, flexShrink: 0 }} />
              <span style={{ fontSize: 14, fontWeight: 600 }}>{r.name || "Mehmon"}</span>
              {r.online && <span style={{ fontSize: 10.5, fontWeight: 800, color: B.green, background: "#E6F6EE", padding: "2px 8px", borderRadius: 8 }}>ONLAYN</span>}
            </div>
            <div style={{ fontSize: 12.5, color: B.muted }}>bugun {fmtMinutes((r.minutesToday || 0) * 60)} · 🔥{r.streak || 0}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   SAVED / MISTAKES
============================================================ */
function loadSaved() { return loadLocal("sws_saved", []); }
function addSaved(item) {
  const list = loadSaved();
  if (list.some((x) => x.prompt === item.prompt)) return;
  list.unshift({ ...item, savedAt: Date.now() });
  saveLocal("sws_saved", list.slice(0, 200));
}
function removeSaved(prompt) { saveLocal("sws_saved", loadSaved().filter((x) => x.prompt !== prompt)); }

function SavedPage() {
  const [list, setList] = useState(() => loadSaved());
  const [active, setActive] = useState(null);
  const remove = (prompt) => { removeSaved(prompt); setList(loadSaved()); if (active?.prompt === prompt) setActive(null); };
  if (active) {
    return (
      <div>
        <button onClick={() => setActive(null)} style={{ background: "transparent", border: "none", color: B.muted, cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 14, marginBottom: 14, fontFamily: FONT }}><ChevronLeft size={16} /> Ro'yxatga qaytish</button>
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 24 }}>
          <div style={{ fontSize: 10.5, color: B.muted, marginBottom: 12, textTransform: "uppercase" }}>{active.domain} {active.skill ? `· ${active.skill}` : ""}</div>
          {active.passage && <div style={{ fontSize: 14.5, lineHeight: 1.7, marginBottom: 18, whiteSpace: "pre-line", paddingBottom: 16, borderBottom: `1px solid ${B.bg}` }}>{active.passage}</div>}
          <p style={{ fontSize: 15, marginBottom: 18, whiteSpace: "pre-line" }}>{active.prompt}</p>
          {active.choices ? active.choices.map((c, idx) => (
            <div key={idx} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 9, border: `1.5px solid ${idx === active.answer ? B.green : B.border}`, background: idx === active.answer ? "#E6F6EE" : "#fff", marginBottom: 9 }}>
              <div style={{ width: 25, height: 25, borderRadius: "50%", border: `1.5px solid ${idx === active.answer ? B.green : B.border}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700 }}>{String.fromCharCode(65 + idx)}</div>
              <span style={{ fontSize: 14 }}>{c}</span>
            </div>
          )) : <div style={{ fontSize: 14, marginBottom: 12 }}>To'g'ri javob: <b>{active.answer}</b></div>}
          {active.expl && <div style={{ marginTop: 14, background: B.bg, borderRadius: 10, padding: "13px 16px", fontSize: 13.5, lineHeight: 1.6 }}>{active.expl}</div>}
          <button onClick={() => remove(active.prompt)} style={{ marginTop: 16, background: "transparent", border: `1px solid ${B.rose}`, color: B.rose, borderRadius: 9, padding: "9px 20px", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>O'chirish</button>
        </div>
      </div>
    );
  }
  return (
    <div>
      <h1 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 4px" }}>Xatolar va saqlangan</h1>
      <p style={{ fontSize: 14, color: B.muted, margin: "0 0 22px" }}>Savollar bankida "Saqlash" tugmasi bilan belgilagan savollaringiz shu yerda.</p>
      {list.length === 0 ? (
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 50, textAlign: "center" }}>
          <Bookmark size={32} color={B.muted} />
          <div style={{ fontSize: 15, fontWeight: 700, marginTop: 14 }}>Hali hech narsa saqlanmagan</div>
          <div style={{ fontSize: 13.5, color: B.muted, marginTop: 4 }}>Savollar bankida mashq qilib, muhim savollarni saqlab qo'ying.</div>
        </div>
      ) : (
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, overflow: "hidden" }}>
          {list.map((item, i) => (
            <div key={i} onClick={() => setActive(item)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 20px", borderBottom: i < list.length - 1 ? `1px solid ${B.bg}` : "none", cursor: "pointer" }}>
              <div style={{ overflow: "hidden" }}>
                <div style={{ fontSize: 11, color: B.muted, marginBottom: 3 }}>{item.domain}</div>
                <div style={{ fontSize: 13.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", maxWidth: 420 }}>{item.prompt}</div>
              </div>
              <button onClick={(e) => { e.stopPropagation(); remove(item.prompt); }} style={{ background: "transparent", border: "none", color: B.muted, cursor: "pointer", flexShrink: 0 }}><X size={15} /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   DRILLS — short timed mini-practice (5 questions / 5 minutes)
============================================================ */
function Drill({ onExit }) {
  const [seed] = useState(() => Date.now());
  const questions = useMemo(() => Array.from({ length: 5 }).map((_, i) => {
    const dm = BANK_DOMAINS[Math.floor(rngFor(`drill|${seed}|dompick|${i}`)() * BANK_DOMAINS.length)];
    return genBankQuestion(dm, Math.floor(rngFor(`drill|${seed}|idx|${i}`)() * POOL_TOTAL));
  }), [seed]);
  const [i, setI] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [seconds, setSeconds] = useState(300);
  const [done, setDone] = useState(false);
  useEffect(() => {
    if (done) return;
    const t = setInterval(() => setSeconds((s) => { if (s <= 1) { setDone(true); return 0; } return s - 1; }), 1000);
    return () => clearInterval(t);
  }, [done]);
  const q = questions[i];
  const choose = (idx) => { if (picked !== null) return; setPicked(idx); if (idx === q.answer) setScore((s) => s + 1); };
  const next = () => { if (i === questions.length - 1) { setDone(true); return; } setI((x) => x + 1); setPicked(null); };

  if (done) {
    return (
      <div style={{ textAlign: "center", padding: "60px 20px" }}>
        <Trophy size={44} color={B.gold} />
        <h2 style={{ fontSize: 24, fontWeight: 800, margin: "16px 0 6px" }}>Mashq tugadi!</h2>
        <p style={{ fontSize: 17, fontWeight: 700, color: B.plum, marginBottom: 20 }}>{score} / {questions.length} to'g'ri</p>
        <button onClick={onExit} style={{ background: B.plum, color: "#fff", border: "none", borderRadius: 9, padding: "11px 26px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Orqaga</button>
      </div>
    );
  }
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <button onClick={onExit} style={{ background: "transparent", border: "none", color: B.muted, cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 14, fontFamily: FONT }}><ChevronLeft size={16} /> Chiqish</button>
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, fontWeight: 700, color: seconds < 30 ? B.rose : B.text }}><Clock size={14} /> {fmt(seconds)}</div>
      </div>
      <div style={{ fontSize: 12.5, color: B.muted, marginBottom: 10 }}>Savol {i + 1} / {questions.length}</div>
      <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 14, padding: 24 }}>
        <div style={{ fontSize: 10.5, color: B.muted, marginBottom: 14, textTransform: "uppercase" }}>{q.domain}</div>
        {q.passage && <div style={{ fontSize: 14, lineHeight: 1.6, marginBottom: 16, whiteSpace: "pre-line" }}>{q.passage}</div>}
        <p style={{ fontSize: 15, marginBottom: 16, whiteSpace: "pre-line" }}>{q.prompt}</p>
        {q.choices ? q.choices.map((c, idx) => {
          const sel = picked === idx; const correct = picked !== null && idx === q.answer;
          return (
            <div key={idx} onClick={() => choose(idx)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "11px 14px", borderRadius: 9, border: `1.5px solid ${correct ? B.green : sel ? B.rose : B.border}`, background: correct ? "#E6F6EE" : sel ? "#FDECF1" : "#fff", marginBottom: 8, cursor: picked === null ? "pointer" : "default" }}>
              <div style={{ width: 24, height: 24, borderRadius: "50%", border: `1.5px solid ${correct ? B.green : sel ? B.rose : B.border}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11.5, fontWeight: 700 }}>{String.fromCharCode(65 + idx)}</div>
              <span style={{ fontSize: 13.5 }}>{c}</span>
            </div>
          );
        }) : (
          <input value={picked ?? ""} onChange={(e) => setPicked(e.target.value)} disabled={picked !== null} style={{ padding: "10px 14px", border: "1.5px solid #B7BBC4", borderRadius: 8, fontSize: 15 }} />
        )}
        {picked !== null && <button onClick={next} style={{ marginTop: 14, background: B.plum, color: "#fff", border: "none", borderRadius: 9, padding: "10px 24px", fontSize: 13.5, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>{i === questions.length - 1 ? "Yakunlash" : "Keyingi"}</button>}
      </div>
    </div>
  );
}
function DrillsHome() {
  const [active, setActive] = useState(false);
  if (active) return <Drill onExit={() => setActive(false)} />;
  return (
    <div>
      <h1 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 4px" }}>Tezkor mashqlar</h1>
      <p style={{ fontSize: 14, color: B.muted, margin: "0 0 22px" }}>5 daqiqada 5 ta aralash savol — kunlik qisqa mashq uchun.</p>
      <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 16, padding: 30, textAlign: "center", maxWidth: 420 }}>
        <Timer size={36} color={B.plum} />
        <div style={{ fontSize: 16, fontWeight: 800, margin: "14px 0 6px" }}>5 daqiqalik drill</div>
        <div style={{ fontSize: 13, color: B.muted, marginBottom: 18 }}>Turli domenlardan aralash savollar</div>
        <button onClick={() => setActive(true)} style={{ background: B.plum, color: "#fff", border: "none", borderRadius: 10, padding: "12px 28px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Boshlash</button>
