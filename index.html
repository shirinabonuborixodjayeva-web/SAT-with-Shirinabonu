function AppShell({ onHome }) {
  const [page, setPage] = useState("home");
  const [tier, setTier] = useState(() => loadLocal("sws_tier", "free"));
  const [payOpen, setPayOpen] = useState(false);
  const [suggestedTier, setSuggestedTier] = useState("standard");
  const [activeTest, setActiveTest] = useState(null);
  const [report, setReport] = useState(null);
  const [history, setHistory] = useState(() => loadLocal("sws_history", []));
  const [bankStats, setBankStats] = useState(() => loadLocal("sws_bank", {}));

  // gamification state
  const clientIdRef = useRef(getClientId());
  const [name, setName] = useState(() => loadLocal("sws_name", ""));
  const [goalMinutes, setGoalMinutes] = useState(() => loadLocal("sws_goal", 30));
  const [streak, setStreak] = useState(() => loadLocal("sws_streak", 0));
  const [todaySeconds, setTodaySeconds] = useState(() => {
    const rec = loadLocal("sws_today", { date: todayStr(), seconds: 0 });
    return rec.date === todayStr() ? rec.seconds : 0;
  });
  const allTimeMinutes = loadLocal("sws_alltime_min", 0);
  const [targetScore] = useState(() => loadLocal("sws_target_score", null));
  const [examDate] = useState(() => loadLocal("sws_exam_date", null));
  const [peers, setPeers] = useState([]);
  const [roster, setRoster] = useState({});
  const [roomReady, setRoomReady] = useState(false);
  const [dbReady, setDbReady] = useState(false);
  const roomRef = useRef(null);
  const dbRef = useRef(null);
  const dbUnsubRef = useRef(null);

  useEffect(() => saveLocal("sws_tier", tier), [tier]);
  useEffect(() => saveLocal("sws_history", history), [history]);
  useEffect(() => saveLocal("sws_bank", bankStats), [bankStats]);
  useEffect(() => saveLocal("sws_name", name), [name]);
  useEffect(() => saveLocal("sws_goal", goalMinutes), [goalMinutes]);

  const studying = Boolean(activeTest) || ["bank", "vocab", "tutor"].includes(page);

  // study timer: ticks every 5s while studying, persists today's seconds and updates streak on day change
  useEffect(() => {
    if (!studying) return;
    const iv = setInterval(() => {
      setTodaySeconds((prevSec) => {
        const wasZero = prevSec === 0;
        const next = prevSec + 5;
        saveLocal("sws_today", { date: todayStr(), seconds: next });
        saveLocal("sws_alltime_min", loadLocal("sws_alltime_min", 0) + 5 / 60);
        if (wasZero) {
          const lastDate = loadLocal("sws_last_study_date", null);
          let s = loadLocal("sws_streak", 0);
          if (lastDate === yesterdayStr()) s = s + 1;
          else if (lastDate !== todayStr()) s = 1;
          saveLocal("sws_streak", s); saveLocal("sws_last_study_date", todayStr());
          setStreak(s);
        }
        if (dbRef.current) {
          dbRef.current.doc(`students/${clientIdRef.current}`).set({
            id: clientIdRef.current, name: name || "Mehmon",
            minutesToday: Math.round(next / 60), streak: loadLocal("sws_streak", 0), lastActive: Date.now(),
          }).catch(() => {});
        }
        return next;
      });
    }, 5000);
    return () => clearInterval(iv);
  }, [studying, name]);

  // room presence (who else is online right now) + db roster (persisted minutes/streak)
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const room = window.claude && window.claude.use ? await window.claude.use("room") : null;
        if (cancelled) return;
        if (room) {
          roomRef.current = room; setRoomReady(true);
          room.presence({ clientId: clientIdRef.current, name: name || "Mehmon", studying });
          room.onPeers((list) => setPeers(list || []));
        }
      } catch (e) {}
      try {
        const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
        if (cancelled) return;
        if (db) {
          dbRef.current = db; setDbReady(true);
          const col = db.collection("students");
          dbUnsubRef.current = col.onSnapshot((docs) => {
            const map = {};
            (docs || []).forEach((d) => { map[d.id || d.data?.id] = d.data || d; });
            setRoster(map);
          });
        }
      } catch (e) {}
    })();
    return () => { cancelled = true; if (dbUnsubRef.current) dbUnsubRef.current(); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    if (roomRef.current) roomRef.current.presence({ clientId: clientIdRef.current, name: name || "Mehmon", studying });
  }, [studying, name]);

  const needPay = (t) => { setSuggestedTier(t || "standard"); setPayOpen(true); };
  const nav = [
    { id: "home", label: "Bosh sahifa", icon: Home }, { id: "tests", label: "Mock testlar", icon: FileText },
    { id: "bank", label: "Savollar banki", icon: ListChecks }, { id: "drills", label: "Tezkor mashqlar", icon: Timer },
    { id: "vocab", label: "Lug'at", icon: Layers }, { id: "saved", label: "Xatolar/Saqlangan", icon: Bookmark },
    { id: "tutor", label: "AI repetitor", icon: MessageCircle }, { id: "analytics", label: "Tahlil", icon: BarChart3 },
    { id: "community", label: "Jamiyat", icon: MessageCircle }, { id: "profile", label: "Profil", icon: User },
  ];
  const finishTest = (responses, diffPath) => {
    const r = gradeTest(activeTest.id, responses, diffPath);
    const entry = { ...r, testId: activeTest.id, testName: activeTest.name };
    setHistory((h) => [...h, entry]); setReport(entry);
  };

  if (activeTest && !report) return <TestRunner test={activeTest} onExit={() => setActiveTest(null)} onFinish={finishTest} />;
  if (report) return <ScoreReport test={activeTest} report={report} onBack={() => { setReport(null); setActiveTest(null); setPage("analytics"); }} />;

  return (
    <div style={{ display: "flex", minHeight: "100vh", fontFamily: FONT, background: B.bg, color: B.text, flexWrap: "wrap" }}>
      <aside style={{ width: 232, background: "#fff", borderRight: `1px solid ${B.border}`, padding: "20px 14px", flexShrink: 0 }}>
        <button onClick={onHome} style={{ display: "flex", alignItems: "center", gap: 9, background: "transparent", border: "none", cursor: "pointer", marginBottom: 24, padding: "0 6px" }}>
          <Mascot size={30} /><span style={{ fontSize: 14.5, fontWeight: 800, color: B.text, fontFamily: FONT, textAlign: "left", lineHeight: 1.2 }}>SAT with<br />Shirinabonu</span>
        </button>
        {nav.map((n) => (
          <button key={n.id} onClick={() => setPage(n.id)} style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", marginBottom: 3, borderRadius: 9, border: "none", cursor: "pointer", fontSize: 14, fontWeight: page === n.id ? 700 : 600, fontFamily: FONT, background: page === n.id ? "#F2EAFB" : "transparent", color: page === n.id ? B.plum : B.muted, textAlign: "left" }}><n.icon size={17} /> {n.label}</button>
        ))}
        <div style={{ marginTop: 22, background: B.navy, borderRadius: 12, padding: 16, color: "#fff" }}>
          <div style={{ fontSize: 13.5, fontWeight: 800, marginBottom: 5 }}>Tarif: {TIERS[tier].label}</div>
          {tier !== "premium" && (
            <>
              <div style={{ fontSize: 12, opacity: 0.8, marginBottom: 12, lineHeight: 1.5 }}>Ko'proq test, savol va cheksiz AI repetitor.</div>
              <button onClick={() => needPay(tier === "free" ? "standard" : "premium")} style={{ width: "100%", background: B.gold, border: "none", borderRadius: 8, padding: 9, fontSize: 13, fontWeight: 800, cursor: "pointer", color: B.navy, fontFamily: FONT }}>Tarifni oshirish</button>
            </>
          )}
        </div>
      </aside>
      <main style={{ flex: 1, overflowY: "auto", minWidth: 280 }}>
        <div style={{ background: "#fff", borderBottom: `1px solid ${B.border}`, padding: "12px 30px", display: "flex", justifyContent: "flex-end", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, background: B.bg, padding: "6px 13px", borderRadius: 20, fontSize: 12.5 }}>🔥 {streak}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, background: B.bg, padding: "6px 13px", borderRadius: 20, fontSize: 12.5 }}><Clock size={13} /> {fmtMinutes(todaySeconds)}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, background: B.bg, padding: "6px 13px", borderRadius: 20, fontSize: 13 }}>
            <User size={15} color={B.muted} /> {name || "O'quvchi"}
            <span style={{ background: tier === "premium" ? B.gold : tier === "standard" ? B.plum : B.border, color: tier === "free" ? B.muted : (tier === "premium" ? B.navy : "#fff"), fontSize: 10, fontWeight: 800, padding: "2px 7px", borderRadius: 8 }}>{TIERS[tier].label.toUpperCase()}</span>
          </div>
        </div>
        <div style={{ padding: "28px 30px", maxWidth: 960 }}>
          {page === "home" && <DashHome history={history} onGoTests={() => setPage("tests")} todaySeconds={todaySeconds} goalMinutes={goalMinutes} streak={streak} onGoProfile={() => setPage("profile")} targetScore={targetScore} examDate={examDate} />}
          {page === "tests" && <MockTests tier={tier} history={history} onOpenTest={setActiveTest} onNeedPay={needPay} />}
          {page === "bank" && <QuestionBank tier={tier} bankStats={bankStats} onRecord={(d, c, t) => setBankStats((s) => ({ ...s, [d]: { c, t } }))} onNeedPay={needPay} />}
          {page === "drills" && <DrillsHome />}
          {page === "vocab" && <Vocabulary tier={tier} onNeedPay={needPay} />}
          {page === "saved" && <SavedPage />}
          {page === "tutor" && <AITutor tier={tier} />}
          {page === "analytics" && <Analytics history={history} />}
          {page === "community" && <Community clientId={clientIdRef.current} name={name} peers={peers} roster={roster} roomReady={roomReady} dbReady={dbReady} />}
          {page === "profile" && <Profile name={name} setName={setName} goalMinutes={goalMinutes} setGoalMinutes={setGoalMinutes} streak={streak} todaySeconds={todaySeconds} allTimeMinutes={Math.round(allTimeMinutes)} targetScore={targetScore} examDate={examDate} />}
        </div>
      </main>
      {payOpen && <PaymentModal suggestedTier={suggestedTier} onClose={() => setPayOpen(false)} onPaid={(plan) => { setTier(plan); setPayOpen(false); }} />}
    </div>
  );
}

============================================================ */

  const finish = () => {
    saveLocal("sws_name", name);
    saveLocal("sws_goal", suggestedGoal);

            <h2 style={{ fontSize: 21, fontWeight: 800, margin: "16px 0 16px" }}>Rejangiz tayyor, {name || "do'stim"}!</h2>

              <div>⏱ Kunlik maqsad: <b>{suggestedGoal} daqiqa</b></div>

        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 26 }}>
          <button onClick={() => setStep((s) => Math.max(0, s - 1))} style={{ visibility: step === 0 ? "hidden" : "visible", background: "transparent", border: "none", color: B.muted, cursor: "pointer", fontFamily: FONT, fontSize: 14, fontWeight: 700 }}>Orqaga</button>
          {step < 4 ? (
            <button onClick={() => setStep((s) => s + 1)} style={{ background: B.plum, color: "#fff", border: "none", borderRadius: 10, padding: "11px 26px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: FONT, display: "flex", alignItems: "center", gap: 6 }}>Keyingi <ChevronRight size={16} /></button>
          ) : (
            <button onClick={finish} style={{ background: B.green, color: "#fff", border: "none", borderRadius: 10, padding: "11px 26px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Boshlash</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   PUBLIC SAT SCORE CALCULATOR (no sign-up needed, embedded on landing)
============================================================ */
function ScoreCalculator() {
  const [rwCorrect, setRwCorrect] = useState(40);
  const [mathCorrect, setMathCorrect] = useState(30);
  const rw = scaleSection(rwCorrect, 54, rwCorrect / 54 >= 0.6);
  const math = scaleSection(mathCorrect, 44, mathCorrect / 44 >= 0.6);
  return (
    <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 18, padding: 28, maxWidth: 520, margin: "0 auto" }}>
      <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 4 }}>SAT ball kalkulyatori</div>
      <div style={{ fontSize: 12.5, color: B.muted, marginBottom: 20 }}>To'g'ri javoblar sonini kiriting — taxminiy ballingizni ko'ring (ro'yxatdan o'tish shart emas)</div>
      {[["Reading & Writing", rwCorrect, setRwCorrect, 54], ["Math", mathCorrect, setMathCorrect, 44]].map(([label, val, setter, max]) => (
        <div key={label} style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 6 }}><span>{label}</span><span style={{ fontWeight: 700 }}>{val} / {max} to'g'ri</span></div>
          <input type="range" min={0} max={max} value={val} onChange={(e) => setter(Number(e.target.value))} style={{ width: "100%", accentColor: B.plum }} />
        </div>
      ))}
      <div style={{ background: B.bg, borderRadius: 12, padding: 18, textAlign: "center", marginTop: 8 }}>
        <div style={{ fontSize: 11.5, color: B.muted, marginBottom: 4 }}>TAXMINIY UMUMIY BALL</div>
        <div style={{ fontSize: 36, fontWeight: 800, color: B.plum }}>{rw + math}</div>
        <div style={{ fontSize: 12, color: B.muted, marginTop: 4 }}>R&W {rw} · Math {math}</div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("landing");
  if (view === "landing") return <div style={{ height: "100vh", overflowY: "auto" }}><Landing onStart={() => setView("onboarding")} /></div>;
  if (view === "onboarding") return <Onboarding onDone={() => setView("app")} />;
  return <AppShell onHome={() => setView("landing")} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
