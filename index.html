function BbButton({ children, onClick, primary, disabled, style }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{ fontFamily: BB.ui, fontSize: 15, fontWeight: 700, padding: "10px 28px", borderRadius: 999, cursor: disabled ? "default" : "pointer", border: primary ? "none" : `1.5px solid ${BB.ink}`, background: primary ? (disabled ? "#AEB8E6" : BB.blue) : "#fff", color: primary ? "#fff" : BB.ink, ...style }}>{children}</button>
  );
}

function BbModal({ title, onClose, children, width = 640 }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.35)", zIndex: 300, display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "80px 16px 16px" }}>
      <div onClick={(e) => e.stopPropagation()} className="sws-fade-in" style={{ width, maxWidth: "100%", maxHeight: "80vh", overflowY: "auto", background: "#fff", borderRadius: 12, boxShadow: "0 24px 60px rgba(0,0,0,0.3)", fontFamily: BB.ui }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "18px 24px", borderBottom: `1px solid ${BB.line}` }}>
          <span style={{ fontSize: 18, fontWeight: 700, color: BB.ink }}>{title}</span>
          <button onClick={onClose} style={{ background: "transparent", border: "none", cursor: "pointer", display: "flex", color: BB.ink }}><X size={20} /></button>
        </div>
        <div style={{ padding: "20px 24px 24px" }}>{children}</div>
      </div>
    </div>
  );
}

function ReferenceSheet({ onClose }) {
  const items = [
    ["Doira", "A = πr²,  C = 2πr"], ["To'rtburchak", "A = lw"], ["Uchburchak", "A = ½bh"], ["Pifagor", "c² = a² + b²"],
    ["Maxsus uchburchaklar", "30°-60°-90°: x, x√3, 2x   ·   45°-45°-90°: s, s, s√2"],
    ["To'g'ri burchakli parallelepiped", "V = lwh"], ["Silindr", "V = πr²h"], ["Shar", "V = 4/3 πr³"], ["Konus", "V = 1/3 πr²h"], ["Piramida", "V = 1/3 lwh"],
  ];
  return (
    <BbModal title="Reference" onClose={onClose}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 10 }}>
        {items.map(([n, f]) => (
          <div key={n} style={{ border: `1px solid ${BB.line}`, borderRadius: 8, padding: "12px 14px" }}>
            <div style={{ fontSize: 12.5, color: BB.muted, marginBottom: 4 }}>{n}</div>
            <div style={{ fontSize: 16, fontFamily: BB.serif, color: BB.ink }}>{f}</div>
          </div>
        ))}
      </div>
      <p style={{ fontSize: 14, color: BB.muted, lineHeight: 1.6, margin: "16px 0 0" }}>Aylanadagi yoy darajasi 360°, radianda 2π. Uchburchak burchaklari yig'indisi 180°.</p>
    </BbModal>
  );
}

function QuestionGrid({ mod, questions, responses, marked, current, onPick }) {
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "center", gap: 22, fontSize: 13.5, color: BB.ink, paddingBottom: 14, marginBottom: 16, borderBottom: `1px solid ${BB.line}`, flexWrap: "wrap" }}>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>{BbSvg.pin} Joriy</span>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 16, height: 16, border: `1.5px dashed ${BB.muted}`, borderRadius: 3 }} /> Javobsiz</span>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>{BbSvg.bookmark(true, 15)} Ko'rib chiqish uchun</span>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, 42px)", gap: "18px 12px", justifyContent: "center" }}>
        {questions.map((_, i) => {
          const k = `${mod.id}-${i}`; const done = responses[k] !== undefined && responses[k] !== "";
          return (
            <button key={i} onClick={() => onPick(i)} style={{ position: "relative", width: 42, height: 42, borderRadius: 4, cursor: "pointer", fontFamily: BB.ui, fontSize: 15, fontWeight: 700, border: done ? "none" : `1.5px dashed ${BB.muted}`, background: done ? BB.blue : "#fff", color: done ? "#fff" : BB.blue }}>
              {i + 1}
              {i === current && <span style={{ position: "absolute", top: -17, left: "50%", transform: "translateX(-50%)" }}>{BbSvg.pin}</span>}
              {marked[k] && <span style={{ position: "absolute", top: -7, right: -6 }}>{BbSvg.bookmark(true, 14)}</span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function TestRunner({ test, onExit, onFinish }) {
  const [stage, setStage] = useState({ type: "intro", modIdx: 0 });
  const [responses, setResponses] = useState({});
  const [marked, setMarked] = useState({});
  const [crossed, setCrossed] = useState({});
  const [strikeMode, setStrikeMode] = useState(false);
  const [navOpen, setNavOpen] = useState(false);
  const [qIndex, setQIndex] = useState(0);
  const [seconds, setSeconds] = useState(0);
  const [diffPath, setDiffPath] = useState({});
  const [calcOpen, setCalcOpen] = useState(false);
  const [refOpen, setRefOpen] = useState(false);
  const [dirOpen, setDirOpen] = useState(false);
  const [moreOpen, setMoreOpen] = useState(false);
  const [timerHidden, setTimerHidden] = useState(false);
  const [split, setSplit] = useState(50);
  const splitRef = useRef(null);
  const studentName = loadLocal("sws_name", "") || "O'quvchi";

  const mod = MODULES[stage.modIdx];
  const questions = useMemo(() => {
    if (!mod || mod.kind === "break") return [];
    const basis = mod.id === "rw2" ? diffPath.rw1 : mod.id === "m2" ? diffPath.m1 : null;
    return buildModuleCached(mod, test.id, basis);
  }, [stage.modIdx, test.id, diffPath.rw1, diffPath.m1]);

  useEffect(() => {
    if (stage.type !== "module" && stage.type !== "review" && stage.type !== "break") return;
    const t = setInterval(() => setSeconds((s) => (s > 0 ? s - 1 : 0)), 1000);
    return () => clearInterval(t);
  }, [stage]);

  const advance = () => {
    setNavOpen(false); setDirOpen(false); setMoreOpen(false); setStrikeMode(false);
    if (mod.kind !== "break") {
      let correct = 0;
      questions.forEach((q, i) => {
        const r = responses[`${mod.id}-${i}`];
        if (q.type === "spr") { if (String(r ?? "").trim() === String(q.answer)) correct++; } else if (r === q.answer) correct++;
      });
      if (mod.id === "rw1" || mod.id === "m1") setDiffPath((d) => ({ ...d, [mod.id]: correct / questions.length >= 0.6 ? "hard" : "easy" }));
    }
    const nextIdx = stage.modIdx + 1;
    if (nextIdx >= MODULES.length) { onFinish(responses, diffPath); return; }
    const nm = MODULES[nextIdx];
    if (nm.kind === "break") { setSeconds(nm.minutes * 60); setStage({ type: "break", modIdx: nextIdx }); }
    else setStage({ type: "intro", modIdx: nextIdx });
  };

  // Vaqt tugasa, haqiqiy imtihondagidek modul avtomatik yakunlanadi
  const expiredRef = useRef(false);
  useEffect(() => {
    if ((stage.type === "module" || stage.type === "review" || stage.type === "break") && seconds === 0 && !expiredRef.current) { expiredRef.current = true; advance(); }
    if (seconds > 0) expiredRef.current = false;
  }, [seconds, stage.type]);

  useEffect(() => {
    const move = (e) => { if (!splitRef.current) return; const r = splitRef.current.getBoundingClientRect(); setSplit(Math.min(72, Math.max(28, ((e.clientX - r.left) / r.width) * 100))); };
    const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); document.body.style.userSelect = ""; };
    splitRef.current && (splitRef.current.__start = () => { document.body.style.userSelect = "none"; window.addEventListener("mousemove", move); window.addEventListener("mouseup", up); });
  });

  const lowTime = seconds <= 300 && (stage.type === "module" || stage.type === "review");
  const nQ = questions.length;

  /* ---------- Intro ---------- */
  if (stage.type === "intro") {
    const isRw = mod.kind === "rw";
    return (
      <div style={{ height: "100vh", display: "flex", flexDirection: "column", background: "#F7F7F8", fontFamily: BB.ui }}>
        <div style={{ background: "#fff", padding: "0 28px", height: 64, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontSize: 17, fontWeight: 700, color: BB.ink }}>{test.name}</span>
          <button onClick={onExit} style={{ background: "transparent", border: "none", color: BB.muted, cursor: "pointer", fontSize: 14, fontFamily: BB.ui, display: "flex", alignItems: "center", gap: 6 }}><X size={16} /> Chiqish</button>
        </div>
        <div style={bbDash} />
        <div style={{ flex: 1, overflowY: "auto", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div className="sws-fade-in" style={{ width: 620, maxWidth: "100%", background: "#fff", borderRadius: 16, boxShadow: "0 1px 2px rgba(0,0,0,0.05), 0 20px 50px -24px rgba(0,0,0,0.25)", overflow: "hidden" }}>
            <div style={{ padding: "30px 34px 22px" }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: BB.blue, letterSpacing: 0.6, textTransform: "uppercase", marginBottom: 8 }}>{mod.label}</div>
              <h2 style={{ fontSize: 28, fontWeight: 800, margin: "0 0 18px", color: BB.ink }}>{mod.section}</h2>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginBottom: 20 }}>
                {[[nQ || (isRw ? RW_BLUEPRINT : MATH_BLUEPRINT).length, "savol"], [mod.minutes, "daqiqa"], [isRw ? "4" : "4", "domen"]].map(([v, l]) => (
                  <div key={l} style={{ background: "#F5F6FA", borderRadius: 10, padding: "14px 12px", textAlign: "center" }}>
                    <div style={{ fontSize: 26, fontWeight: 800, color: BB.ink }}>{v}</div>
                    <div style={{ fontSize: 13, color: BB.muted }}>{l}</div>
                  </div>
                ))}
              </div>
              <p style={{ fontSize: 15, lineHeight: 1.7, color: "#333", margin: "0 0 16px" }}>{DIRECTIONS[isRw ? "rw" : "math"]}</p>
              {!isRw && <p style={{ fontSize: 14, color: BB.muted, margin: "0 0 16px" }}>Kalkulyator (Desmos) va formulalar varag'i test ichida doim mavjud.</p>}
              {mod.adaptive && (
                <div style={{ background: "#FFF7E8", borderRadius: 10, padding: "12px 16px", fontSize: 14, display: "flex", gap: 10, lineHeight: 1.5 }}>
                  <AlertCircle size={18} color="#D98A00" style={{ flexShrink: 0, marginTop: 1 }} />Bu modulning qiyinligi 1-moduldagi natijangizga qarab tanlandi — xuddi haqiqiy Digital SAT'dagidek.
                </div>
              )}
            </div>
            <div style={{ borderTop: `1px solid ${BB.line}`, padding: "16px 34px", display: "flex", justifyContent: "space-between", alignItems: "center", background: "#FAFAFB" }}>
              <span style={{ fontSize: 13.5, color: BB.muted }}>Vaqt "Boshlash" bosilganda ketadi</span>
              <BbButton primary onClick={() => { setSeconds(mod.minutes * 60); setQIndex(0); setStage({ type: "module", modIdx: stage.modIdx }); }}>Boshlash</BbButton>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- Break ---------- */
  if (stage.type === "break") {
    return (
      <div style={{ height: "100vh", display: "flex", flexDirection: "column", background: "#1B1D24", color: "#fff", fontFamily: BB.ui }}>
        <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 60, padding: 24, flexWrap: "wrap" }}>
          <div className="sws-fade-in" style={{ border: "1px solid #3A3D46", borderRadius: 16, padding: "30px 44px", textAlign: "center", minWidth: 280 }}>
            <div style={{ fontSize: 15, color: "#B9BCC6", marginBottom: 8 }}>Tanaffusdan qolgan vaqt</div>
            <div style={{ fontSize: 64, fontWeight: 800, fontVariantNumeric: "tabular-nums", letterSpacing: 1 }}>{fmt(seconds)}</div>
            <BbButton primary onClick={advance} style={{ marginTop: 18, background: "#FDDA24", color: BB.ink }}>Testni davom ettirish</BbButton>
          </div>
          <div style={{ maxWidth: 380 }}>
            <h2 style={{ fontSize: 26, fontWeight: 800, margin: "0 0 12px" }}>Tanaffus</h2>
            <p style={{ fontSize: 15, lineHeight: 1.7, color: "#D4D6DD", margin: "0 0 14px" }}>Reading and Writing bo'limi tugadi. Keyingi — Math bo'limi.</p>
            <ul style={{ fontSize: 14.5, lineHeight: 1.9, color: "#D4D6DD", paddingLeft: 18, margin: 0 }}>
              <li>Haqiqiy imtihonda qurilmani yopmang va boshqa ilovalarni ochmang.</li>
              <li>Suv iching, cho'zilib oling — 10 daqiqa tez o'tadi.</li>
              <li>Vaqt tugaganda Math bo'limi avtomatik boshlanadi.</li>
            </ul>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- Header / footer (module & review) ---------- */
  const header = (
    <>
      <div style={{ background: "#fff", height: 68, padding: "0 24px", display: "grid", gridTemplateColumns: "1fr auto 1fr", alignItems: "center", flexShrink: 0 }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 16.5, fontWeight: 700, color: BB.ink, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{mod.label}: {mod.section}</div>
          <button onClick={() => setDirOpen(true)} style={{ background: "transparent", border: "none", padding: 0, marginTop: 2, cursor: "pointer", fontFamily: BB.ui, fontSize: 14, color: BB.ink, display: "flex", alignItems: "center", gap: 4 }}>Directions {BbSvg.caret(false)}</button>
        </div>
        <div style={{ textAlign: "center" }}>
          {!timerHidden ? (
            <div className={lowTime ? "sws-timer-low" : ""} style={{ fontSize: 22, fontWeight: 800, fontVariantNumeric: "tabular-nums", color: lowTime ? BB.red : BB.ink, lineHeight: 1.1 }}>{fmt(seconds)}</div>
          ) : <div style={{ height: 24, display: "flex", alignItems: "center", justifyContent: "center" }}><Clock size={20} color={BB.ink} /></div>}
          <button onClick={() => setTimerHidden((v) => !v)} style={{ marginTop: 4, fontSize: 12, fontFamily: BB.ui, padding: "2px 12px", borderRadius: 999, border: `1px solid ${BB.ink}`, background: "#fff", cursor: "pointer", color: BB.ink }}>{timerHidden ? "Show" : "Hide"}</button>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 6 }}>
          {mod.kind === "math" && (
            <>
              <button onClick={() => setCalcOpen((v) => !v)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, background: calcOpen ? BB.blueSoft : "transparent", border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontFamily: BB.ui, fontSize: 12.5, color: BB.ink }}><Calculator size={18} color={BB.ink} />Calculator</button>
              <button onClick={() => setRefOpen(true)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, background: "transparent", border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontFamily: BB.ui, fontSize: 12.5, color: BB.ink }}>{BbSvg.ref}Reference</button>
            </>
          )}
          <div style={{ position: "relative" }}>
            <button onClick={() => setMoreOpen((v) => !v)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, background: moreOpen ? BB.bar : "transparent", border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontFamily: BB.ui, fontSize: 12.5, color: BB.ink }}>{BbSvg.more}More</button>
            {moreOpen && (
              <div style={{ position: "absolute", right: 0, top: "100%", marginTop: 6, background: "#fff", borderRadius: 10, boxShadow: "0 12px 32px rgba(0,0,0,0.2)", padding: 6, zIndex: 50, minWidth: 190 }}>
                <button onClick={() => { setMoreOpen(false); onExit(); }} style={{ width: "100%", textAlign: "left", background: "transparent", border: "none", padding: "10px 12px", borderRadius: 6, cursor: "pointer", fontFamily: BB.ui, fontSize: 14, color: BB.red }}>Testdan chiqish</button>
              </div>
            )}
          </div>
        </div>
      </div>
      <div style={bbDash} />
    </>
  );

  const footer = (leftBack, onNext, nextLabel, backDisabled) => (
    <>
      <div style={bbDash} />
      <div style={{ background: "#fff", height: 68, padding: "0 24px", display: "grid", gridTemplateColumns: "1fr auto 1fr", alignItems: "center", flexShrink: 0, position: "relative" }}>
        <span style={{ fontSize: 15, fontWeight: 700, color: BB.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{studentName}</span>
        {stage.type === "module" ? (
          <button onClick={() => setNavOpen((v) => !v)} style={{ background: BB.ink, color: "#fff", border: "none", borderRadius: 8, padding: "9px 18px", fontFamily: BB.ui, fontSize: 14.5, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>Question {qIndex + 1} of {nQ} {BbSvg.caret(navOpen)}</button>
        ) : <span />}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          {!backDisabled && <BbButton primary onClick={leftBack}>Back</BbButton>}
          <BbButton primary onClick={onNext}>{nextLabel}</BbButton>
        </div>
      </div>
    </>
  );

  const modals = (
    <>
      {calcOpen && <CalcPanel onClose={() => setCalcOpen(false)} />}
      {refOpen && <ReferenceSheet onClose={() => setRefOpen(false)} />}
      {dirOpen && (
        <BbModal title="Directions" onClose={() => setDirOpen(false)}>
          <p style={{ fontSize: 15.5, lineHeight: 1.75, color: "#333", margin: 0 }}>{DIRECTIONS[mod.kind === "rw" ? "rw" : "math"]}</p>
          <div style={{ textAlign: "right", marginTop: 20 }}><BbButton primary onClick={() => setDirOpen(false)} style={{ background: "#FDDA24", color: BB.ink }}>Close</BbButton></div>
        </BbModal>
      )}
    </>
  );

  /* ---------- Review page ---------- */
  if (stage.type === "review") {
    return (
      <div style={{ height: "100vh", display: "flex", flexDirection: "column", background: "#fff", fontFamily: BB.ui }}>
        {header}
        <div style={{ flex: 1, overflowY: "auto", padding: "34px 20px", background: "#F7F7F8" }}>
          <div style={{ maxWidth: 760, margin: "0 auto" }}>
            <h2 style={{ fontSize: 30, fontWeight: 800, textAlign: "center", margin: "0 0 10px", color: BB.ink }}>Check Your Work</h2>
            <p style={{ textAlign: "center", fontSize: 15.5, color: "#333", lineHeight: 1.6, margin: "0 0 6px" }}>Haqiqiy imtihonda vaqt tugamaguncha keyingi modulga o'tolmaysiz.</p>
            <p style={{ textAlign: "center", fontSize: 15.5, color: "#333", lineHeight: 1.6, margin: "0 0 26px" }}>Quyidagi raqamni bossangiz, o'sha savolga qaytasiz.</p>
            <div className="sws-fade-in" style={{ background: "#fff", borderRadius: 14, boxShadow: "0 1px 2px rgba(0,0,0,0.05), 0 16px 40px -24px rgba(0,0,0,0.3)", padding: "22px 26px 30px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
                <span style={{ fontSize: 17, fontWeight: 700, color: BB.ink }}>{mod.label}: {mod.section} Questions</span>
                <span style={{ fontSize: 14, color: BB.muted }}>{questions.filter((_, i) => responses[`${mod.id}-${i}`] !== undefined && responses[`${mod.id}-${i}`] !== "").length} / {nQ} javob berildi</span>
              </div>
              <QuestionGrid mod={mod} questions={questions} responses={responses} marked={marked} current={-1} onPick={(i) => { setQIndex(i); setStage({ type: "module", modIdx: stage.modIdx }); }} />
            </div>
          </div>
        </div>
        {footer(() => setStage({ type: "module", modIdx: stage.modIdx }), advance, stage.modIdx === MODULES.length - 1 ? "Testni yakunlash" : "Next", false)}
        {modals}
      </div>
    );
  }

  /* ---------- Question screen ---------- */
  const q = questions[qIndex]; const key = `${mod.id}-${qIndex}`; const answered = responses[key]; const isLast = qIndex === nQ - 1;
  const isSpr = q.type === "spr";
  const leftContent = q.passage ? (
    <div style={{ fontFamily: BB.serif, fontSize: 17, lineHeight: 1.8, color: BB.ink, whiteSpace: "pre-line" }}>{q.passage}</div>
  ) : isSpr ? (
    <div style={{ fontSize: 14.5, lineHeight: 1.7, color: "#333" }}>
      <div style={{ fontSize: 17, fontWeight: 700, color: BB.ink, marginBottom: 10 }}>Student-produced response directions</div>
      <ul style={{ paddingLeft: 18, margin: 0 }}>
        <li>Agar bir nechta to'g'ri javob topsangiz, faqat bittasini yozing.</li>
        <li>Musbat javob uchun 5 ta, manfiy javob uchun 6 ta belgigacha yozish mumkin (minus belgisi bilan).</li>
        <li>Javob kasr bo'lsa, oddiy kasr (3/4) yoki o'nli kasr (0.75) ko'rinishida yozing.</li>
        <li>Aralash sonlar (3 1/2 kabi) qabul qilinmaydi — 7/2 yoki 3.5 deb yozing.</li>
        <li>Belgilar ($, %) va vergul qo'ymang.</li>
      </ul>
    </div>
  ) : null;
  const twoPane = !!leftContent;

  const choiceList = isSpr ? (
    <div>
      <input value={answered ?? ""} onChange={(e) => setResponses((r) => ({ ...r, [key]: e.target.value.replace(/[^0-9./-]/g, "").slice(0, 12) }))} placeholder="" style={{ width: 180, padding: "10px 4px", border: "none", borderBottom: `2px solid ${BB.ink}`, fontSize: 22, fontFamily: BB.ui, outline: "none", background: "transparent" }} />
      <div style={{ marginTop: 18, fontSize: 15, color: BB.ink }}>Answer Preview: <b style={{ fontFamily: BB.serif, fontSize: 18 }}>{answered || ""}</b></div>
    </div>
  ) : q.choices.map((c, idx) => {
    const sel = answered === idx; const ck = `${key}-${idx}`; const out = !!crossed[ck];
    return (
      <div key={idx} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
        <div onClick={() => { if (out) setCrossed((x) => ({ ...x, [ck]: false })); setResponses((r) => ({ ...r, [key]: idx })); }} style={{ flex: 1, position: "relative", display: "flex", alignItems: "center", gap: 14, padding: "12px 16px", borderRadius: 10, border: sel ? `3px solid ${BB.blue}` : `1.5px solid ${BB.ink}`, margin: sel ? 0 : "1.5px", background: "#fff", cursor: "pointer", opacity: out ? 0.45 : 1, transition: "border-color .15s, box-shadow .15s", boxShadow: sel ? "0 0 0 3px rgba(50,77,199,0.12)" : "none" }}>
          <div style={{ width: 28, height: 28, borderRadius: "50%", flexShrink: 0, border: `2px solid ${sel ? BB.blue : BB.ink}`, background: sel ? BB.blue : "#fff", color: sel ? "#fff" : BB.ink, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 700, fontFamily: BB.ui }}>{String.fromCharCode(65 + idx)}</div>
          <span style={{ fontSize: 16, fontFamily: BB.serif, color: BB.ink, lineHeight: 1.5 }}>{c}</span>
          {out && <div style={{ position: "absolute", left: 8, right: 8, top: "50%", height: 2, background: BB.ink }} />}
        </div>
        {strikeMode && (

const POOL_TOTAL = 500;
const diffForIndex = (i, total) => (i < total / 3 ? "Easy" : i < (2 * total) / 3 ? "Medium" : "Hard");
function genSkillQuestion(domain, skill, index) {
  const difficulty = diffForIndex(index, POOL_TOTAL);
  if (domain.kind === "math") {
    const [gen, ts] = MATH_SKILL_TEMPLATES[skill];
    const g = genMathUnseen(gen, false, ts[Math.floor(Math.random() * ts.length)]);
    return { domain: domain.d, skill, difficulty, passage: null, ...g };
  }
  const v = pickUnseenRW(skill);
  return { domain: domain.d, skill, difficulty: v.difficulty || difficulty, type: "mc", passage: v.passage, prompt: v.prompt, choices: v.choices, answer: v.answer, expl: v.expl };
}
function genBankQuestion(domain, index) {
  const difficulty = diffForIndex(index, POOL_TOTAL);
  if (domain.kind === "math") {
    return genSkillQuestion(domain, domain.skills[Math.floor(Math.random() * domain.skills.length)], index);
  }
  const skill = domain.skills[Math.floor(Math.random() * domain.skills.length)];
  const v = pickUnseenRW(skill);
  return { domain: domain.d, skill, difficulty: v.difficulty || difficulty, type: "mc", passage: v.passage, prompt: v.prompt, choices: v.choices, answer: v.answer, expl: v.expl };
}

          <button onClick={() => swsOpenPaywall("ai")} style={{ background: B.gold, color: B.navy, border: "none", borderRadius: 12, padding: "10px 22px", fontSize: 15, fontWeight: 900, cursor: "pointer", fontFamily: FONT }}>💎 Premium — cheksiz</button>

function DashHome({ history, onGoTests, todaySeconds, goalMinutes, streak, onGoProfile, targetScore, examDate }) {
  const last = history[history.length - 1]; const prev = history[history.length - 2];
  const remindToStudy = todaySeconds < goalMinutes * 60;
  const daysLeft = examDate ? Math.max(0, Math.ceil((new Date(examDate) - new Date()) / 86400000)) : null;
  const agg = {};
  history.forEach((h) => Object.entries(h.perDomain).forEach(([d, v]) => { agg[d] = agg[d] || { c: 0, t: 0 }; agg[d].c += v.c; agg[d].t += v.t; }));
  let weakest = Object.entries(agg).filter(([, v]) => v.t >= 2).sort((a, b) => a[1].c / a[1].t - b[1].c / b[1].t).slice(0, 3);
  if (weakest.length === 0) {
    const onboardingWeak = loadLocal("sws_weak_areas", []);
    weakest = onboardingWeak.slice(0, 3).map((d) => [d, { c: 0, t: 0 }]);
  }
  const perDomainMinutes = weakest.length ? Math.max(5, Math.round(goalMinutes / weakest.length)) : 0;
  return (
    <div>
      <h1 style={{ fontSize: 24, fontWeight: 800, margin: "0 0 4px" }}>Xush kelibsiz</h1>
      <p style={{ fontSize: 15.5, color: B.muted, margin: "0 0 22px" }}>{history.length === 0 ? "Hali test yechmagansiz." : `${history.length} ta test yechildi.`}</p>

      {(targetScore || daysLeft !== null) && (
        <div style={{ background: B.navy, color: "#fff", borderRadius: 18, padding: "16px 20px", marginBottom: 16, display: "flex", gap: 24, flexWrap: "wrap" }}>
          {targetScore && <div><div style={{ fontSize: 12, opacity: 0.7 }}>MAQSAD BALL</div><div style={{ fontSize: 24, fontWeight: 800 }}>{targetScore}</div></div>}
          {daysLeft !== null && <div><div style={{ fontSize: 12, opacity: 0.7 }}>IMTIHONGACHA</div><div style={{ fontSize: 24, fontWeight: 800 }}>{daysLeft} kun</div></div>}
          {last && targetScore && <div><div style={{ fontSize: 12, opacity: 0.7 }}>MAQSADGACHA QOLDI</div><div style={{ fontSize: 24, fontWeight: 800, color: targetScore - last.total <= 0 ? B.green : B.gold }}>{Math.max(0, targetScore - last.total)} ball</div></div>}
        </div>
      )}

      {remindToStudy && (
        <div style={{ background: "#FFF7E8", border: `1px solid ${B.gold}44`, borderRadius: 16, padding: "13px 16px", marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
          <span style={{ fontSize: 15 }}>⏰ Bugun hali {fmtMinutes(Math.max(0, goalMinutes * 60 - todaySeconds))} maqsadingizgacha qoldi. Streak: 🔥{streak}</span>
          <button onClick={onGoProfile} style={{ background: B.gold, color: B.navy, border: "none", borderRadius: 8, padding: "7px 14px", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>Maqsadni ko'rish</button>
        </div>
      )}

      {weakest.length > 0 && (
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 18, padding: 18, marginBottom: 18 }}>
          <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 10 }}>📋 Bugungi shaxsiy reja</div>
          {weakest.map(([d, v]) => (
            <div key={d} style={{ display: "flex", justifyContent: "space-between", fontSize: 14.5, padding: "7px 0", borderBottom: `1px solid ${B.bg}` }}>
              <span>{d} <span style={{ color: B.muted }}>{v.t > 0 ? `(${Math.round((v.c / v.t) * 100)}% aniqlik)` : "(tanlangan)"}</span></span>
              <span style={{ fontWeight: 700, color: B.plum }}>{perDomainMinutes} daq</span>
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 16, marginBottom: 18 }}>
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 18, padding: 22, display: "flex", alignItems: "center", gap: 22 }}>
          <div style={{ position: "relative", width: 88, height: 88 }}>
            <svg width="88" height="88" viewBox="0 0 88 88">
              <circle cx="44" cy="44" r="38" stroke={B.border} strokeWidth="9" fill="none" />
              <circle cx="44" cy="44" r="38" stroke={B.plum} strokeWidth="9" fill="none" strokeDasharray={2 * Math.PI * 38} strokeDashoffset={2 * Math.PI * 38 * (1 - (last ? last.total : 0) / 1600)} strokeLinecap="round" transform="rotate(-90 44 44)" />
            </svg>
            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, fontWeight: 800 }}>{last ? last.total : "—"}</div>
          </div>
          <div>
            <div style={{ fontSize: 14.5, color: B.muted, marginBottom: 4 }}>Oxirgi umumiy ball</div>
            {prev && <div style={{ fontSize: 14.5, color: last.total >= prev.total ? B.green : B.rose, fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}><TrendingUp size={14} /> {last.total - prev.total >= 0 ? "+" : ""}{last.total - prev.total} oxirgi testdan beri</div>}

        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 18, padding: 22 }}>
          <div style={{ fontSize: 14.5, color: B.muted, marginBottom: 12 }}>Bo'limlar</div>

        <div><div style={{ fontSize: 16.5, fontWeight: 700, marginBottom: 3 }}>Mock testni boshlash</div><div style={{ fontSize: 14, opacity: 0.85 }}>200 ta testdan tanlang</div></div>
        <ChevronRight size={20} />
      </button>
    </div>
  );
}

/* ============================================================
   GAMIFICATION HELPERS
============================================================ */
function todayStr() { return new Date().toISOString().slice(0, 10); }
function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); }
function getClientId() {
  let id = loadLocal("sws_client_id", null);
  if (!id) { id = "u" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); saveLocal("sws_client_id", id); }
  return id;
}
function fmtMinutes(sec) {
  const m = Math.floor(sec / 60);
  if (m < 60) return `${m} daq`;
  return `${Math.floor(m / 60)} soat ${m % 60} daq`;
}

  const onlineIds = new Set(peers.map((p) => p.clientId).filter(Boolean));

    .map((r) => ({ ...r, online: onlineIds.has(r.id) }))
    .sort((a, b) => (b.online - a.online) || (b.minutesToday || 0) - (a.minutesToday || 0));

  return (
    <div>
      <h1 style={{ fontSize: 24, fontWeight: 800, margin: "0 0 4px" }}>Jamiyat</h1>
      <p style={{ fontSize: 15.5, color: B.muted, margin: "0 0 18px" }}>Boshqa o'quvchilar bilan bir vaqtda mashq qiling.</p>

      <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 18, overflow: "hidden" }}>

          <div key={r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 20px", borderBottom: `1px solid ${B.bg}` }}>

}

/* ============================================================
   SAVED / MISTAKES
============================================================ */
function loadSaved() { return loadLocal("sws_saved", []); }
function addSaved(item) {
  const list = loadSaved();
  if (list.some((x) => x.prompt === item.prompt)) return;
  list.unshift({ ...item, savedAt: Date.now() });
  saveLocal("sws_saved", list.slice(0, 200));
}
function removeSaved(prompt) { saveLocal("sws_saved", loadSaved().filter((x) => x.prompt !== prompt)); }

function SavedPage() {
  const [list, setList] = useState(() => loadSaved());
  const [active, setActive] = useState(null);
  const remove = (prompt) => { removeSaved(prompt); setList(loadSaved()); if (active?.prompt === prompt) setActive(null); };
  if (active) {
    return (
      <div>
        <button onClick={() => setActive(null)} style={{ background: "transparent", border: "none", color: B.muted, cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 15.5, marginBottom: 14, fontFamily: FONT }}><ChevronLeft size={16} /> Ro'yxatga qaytish</button>
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 18, padding: 24 }}>
          <div style={{ fontSize: 11.5, color: B.muted, marginBottom: 12, textTransform: "uppercase" }}>{active.domain} {active.skill ? `· ${active.skill}` : ""}</div>
          {active.passage && <div style={{ fontSize: 16, lineHeight: 1.7, marginBottom: 18, whiteSpace: "pre-line", paddingBottom: 16, borderBottom: `1px solid ${B.bg}` }}>{active.passage}</div>}
          <p style={{ fontSize: 16.5, marginBottom: 18, whiteSpace: "pre-line" }}>{active.prompt}</p>
          {active.choices ? active.choices.map((c, idx) => (
            <div key={idx} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 12, border: `1.5px solid ${idx === active.answer ? B.green : B.border}`, background: idx === active.answer ? "#E6F6EE" : "#fff", marginBottom: 9 }}>
              <div style={{ width: 25, height: 25, borderRadius: "50%", border: `1.5px solid ${idx === active.answer ? B.green : B.border}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13.5, fontWeight: 700 }}>{String.fromCharCode(65 + idx)}</div>
              <span style={{ fontSize: 15.5 }}>{c}</span>
            </div>
          )) : <div style={{ fontSize: 15.5, marginBottom: 12 }}>To'g'ri javob: <b>{active.answer}</b></div>}
          {active.expl && <div style={{ marginTop: 14, background: B.bg, borderRadius: 12, padding: "13px 16px", fontSize: 15, lineHeight: 1.6 }}>{active.expl}</div>}
          <button onClick={() => remove(active.prompt)} style={{ marginTop: 16, background: "transparent", border: `1px solid ${B.rose}`, color: B.rose, borderRadius: 12, padding: "9px 20px", fontSize: 14.5, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>O'chirish</button>
        </div>
      </div>
    );
  }
  return (
    <div>
      <h1 style={{ fontSize: 24, fontWeight: 800, margin: "0 0 4px" }}>Xatolar va saqlangan</h1>
      <p style={{ fontSize: 15.5, color: B.muted, margin: "0 0 22px" }}>Savollar bankida "Saqlash" tugmasi bilan belgilagan savollaringiz shu yerda.</p>
      {list.length === 0 ? (
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 18, padding: 50, textAlign: "center" }}>
          <Bookmark size={32} color={B.muted} />
          <div style={{ fontSize: 16.5, fontWeight: 700, marginTop: 14 }}>Hali hech narsa saqlanmagan</div>
          <div style={{ fontSize: 15, color: B.muted, marginTop: 4 }}>Savollar bankida mashq qilib, muhim savollarni saqlab qo'ying.</div>
        </div>
      ) : (
        <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 18, overflow: "hidden" }}>
          {list.map((item, i) => (
            <div key={i} onClick={() => setActive(item)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 20px", borderBottom: i < list.length - 1 ? `1px solid ${B.bg}` : "none", cursor: "pointer" }}>

                <div style={{ fontSize: 12, color: B.muted, marginBottom: 3 }}>{item.domain}</div>

            </div>
          ))}
        </div>
      )}
    </div>
  );

/* ============================================================
   DRILLS — short timed mini-practice (5 questions / 5 minutes)
============================================================ */
const DRILL_MODES = [
  { id: "mix", title: "Aralash drill", sub: "R&W + Math", emoji: "⚡", grad: ["#6B3FA0", "#C2185B"] },
  { id: "rw", title: "Reading & Writing", sub: "Grammatika, lug'at, matn", emoji: "📖", grad: ["#2B5BD7", "#6B8CFF"] },
  { id: "math", title: "Math", sub: "Algebra, funksiyalar, geometriya", emoji: "📐", grad: ["#0E9F6E", "#36C28E"] },
];
function Drill({ mode, onExit }) {
  const [questions] = useState(() => Array.from({ length: 5 }).map((_, k) => {
    const pool = BANK_DOMAINS.filter((d) => mode === "mix" ? true : d.kind === mode);

        {sws.me && sws.me.trial && sws.me.premium && (
          <div onClick={() => needPay()} style={{ margin: "16px 34px 0", maxWidth: 1000, boxSizing: "border-box", background: "linear-gradient(90deg, #6B3FA0, #C2185B)", color: "#fff", borderRadius: 16, padding: "12px 18px", fontSize: 14.5, fontWeight: 700, cursor: "pointer", display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
            <span>🎁 Bepul sinov Premium: yana {Math.max(1, Math.ceil((sws.me.premiumUntil - Date.now()) / 86400000))} kun hammasi cheksiz!</span><span style={{ opacity: 0.9 }}>Davom ettirish → 💎</span>
          </div>
        )}
        <div key={page} className="sws-fade-in" style={{ padding: "32px 34px 120px", maxWidth: 1000 }}>
          {page === "home" && <DashHome history={history} onGoTests={() => setPage("tests")} todaySeconds={todaySeconds} goalMinutes={goalMinutes} streak={streak} onGoProfile={() => setPage("profile")} targetScore={targetScore} examDate={examDate} />}
          {page === "tests" && <MockTests tier={tier} history={history} onOpenTest={openTest} onNeedPay={() => needPay()} />}
          {page === "bank" && <QuestionBank tier={tier} bankStats={bankStats} onRecord={(d, c, t) => setBankStats((s) => ({ ...s, [d]: { c, t } }))} onNeedPay={needPay} />}
          {page === "drills" && <DrillsHome />}
          {page === "vocab" && <Vocabulary />}
          {page === "saved" && <SavedPage />}
          {page === "tutor" && <AITutor tier={tier} />}
          {page === "analytics" && <Analytics history={history} />}
          {page === "community" && <Community clientId={clientIdRef.current} name={name} peers={peers} roster={roster} roomReady={roomReady} dbReady={dbReady} />}
          {page === "profile" && <Profile name={name} setName={setName} goalMinutes={goalMinutes} setGoalMinutes={setGoalMinutes} streak={streak} todaySeconds={todaySeconds} allTimeMinutes={Math.round(allTimeMinutes)} targetScore={targetScore} examDate={examDate} />}
        </div>
      </main>
      <div style={{ position: "fixed", bottom: 16, left: 0, right: 0, display: "flex", justifyContent: "center", zIndex: 50, pointerEvents: "none" }}>
        <div style={{ pointerEvents: "auto" }}>
          <MacDock apps={nav} activeId={page} onAppClick={setPage} />
        </div>
      </div>
      {payOpen && <PremiumModal reason={payReason} onClose={() => setPayOpen(false)} />}
      {preparing && (
        <div className="sws-app" style={{ position: "fixed", inset: 0, background: "rgba(246,247,252,0.85)", backdropFilter: "blur(6px)", zIndex: 120, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FONT }}>
          <div style={{ background: "#fff", borderRadius: 22, padding: "26px 30px", textAlign: "center", boxShadow: "0 30px 60px -30px rgba(22,32,77,0.4)" }}>
            <div style={{ width: 34, height: 34, borderRadius: "50%", border: "4px solid #E4E7F5", borderTopColor: B.plum, margin: "0 auto 12px", animation: "swsSpin .8s linear infinite" }} />
            <div style={{ fontSize: 16, fontWeight: 800 }}>Yangi savollar tayyorlanmoqda…</div>
            <div style={{ fontSize: 13.5, color: B.muted, marginTop: 4 }}>Oldin ko'rgan savollaringiz qaytarilmaydi</div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   ONBOARDING — personalized plan setup (target score, exam date, weak areas)
============================================================ */
function Onboarding({ onDone }) {
  const [step, setStep] = useState(0);
  const [name, setName] = useState(() => (SWS.user && SWS.user.first_name) || (SWS.me && SWS.me.profile && SWS.me.profile.tgName) || "");
  const [target, setTarget] = useState(1400);
  const [monthsAway, setMonthsAway] = useState(3);
  const [weak, setWeak] = useState([]);
  const steps = ["Ism", "Maqsad", "Muddat", "Zaif tomonlar", "Reja"];

  const toggleWeak = (d) => setWeak((w) => (w.includes(d) ? w.filter((x) => x !== d) : [...w, d]));
  const suggestedGoal = monthsAway <= 1 ? 75 : monthsAway <= 2 ? 60 : monthsAway <= 3 ? 45 : 30;
  const examDate = new Date(); examDate.setMonth(examDate.getMonth() + monthsAway);

  const finish = () => {
    saveLocal("sws_name", name);
    saveLocal("sws_goal", suggestedGoal);
    saveLocal("sws_target_score", target);
    saveLocal("sws_exam_date", examDate.toISOString());
    saveLocal("sws_weak_areas", weak);
    saveLocal("sws_onboarded", true);
    swsSaveProfile({ onboarded: true, name, goal: suggestedGoal, target, examDate: examDate.toISOString(), weak });
    onDone();
  };

  const domainOptions = ["Craft and Structure", "Information and Ideas", "Standard English Conventions", "Expression of Ideas", "Algebra", "Advanced Math", "Problem-Solving and Data Analysis", "Geometry and Trigonometry"];

  return (
    <div className="sws-app" style={{ minHeight: "100vh", background: B.bg, fontFamily: FONT, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div className="sws-fade-in" style={{ width: "100%", maxWidth: 560, background: "#fff", borderRadius: 28, padding: 40, boxShadow: "0 1px 2px rgba(22,32,77,0.04), 0 30px 60px -30px rgba(22,32,77,0.28)" }}>
        <div style={{ display: "flex", gap: 6, marginBottom: 24 }}>
          {steps.map((_, i) => <div key={i} style={{ flex: 1, height: 4, borderRadius: 3, background: i <= step ? B.plum : B.bg }} />)}
        </div>

        {step === 0 && (
          <div style={{ textAlign: "center" }}>
            <Mascot size={64} />
            <h2 style={{ fontSize: 23, fontWeight: 800, margin: "16px 0 6px" }}>Keling, tanishaylik</h2>
            <p style={{ fontSize: 15, color: B.muted, marginBottom: 20 }}>Shaxsiy reja tuzish uchun bir necha savol beramiz.</p>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Ismingiz" style={{ width: "100%", padding: "12px 16px", border: `1px solid ${B.border}`, borderRadius: 12, fontSize: 16.5, fontFamily: FONT, boxSizing: "border-box", textAlign: "center" }} />
          </div>
        )}

        {step === 1 && (
          <div>
            <h2 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 6px", textAlign: "center" }}>Maqsad balingiz nechi?</h2>
            <p style={{ fontSize: 15, color: B.muted, marginBottom: 20, textAlign: "center" }}>Bu reja va tavsiyalarni moslashtirishga yordam beradi</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
              {[1200, 1300, 1400, 1450, 1500, 1550].map((s) => (
                <button key={s} onClick={() => setTarget(s)} style={{ padding: "14px 0", borderRadius: 16, border: `2px solid ${target === s ? B.plum : B.border}`, background: target === s ? "#F2EAFB" : "#fff", color: target === s ? B.plum : B.text, cursor: "pointer", fontFamily: FONT, fontSize: 17.5, fontWeight: 800 }}>{s}</button>
              ))}
            </div>
          </div>
        )}

        {step === 2 && (
          <div>
            <h2 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 6px", textAlign: "center" }}>Imtihoningiz qachon?</h2>
            <p style={{ fontSize: 15, color: B.muted, marginBottom: 20, textAlign: "center" }}>Kunlik mashq maqsadingizni shunga moslab beramiz</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {[[1, "1 oydan kam"], [2, "~2 oy"], [3, "~3 oy"], [6, "~6 oy"], [12, "Hali bilmayman"]].map(([m, l]) => (
                <button key={m} onClick={() => setMonthsAway(m)} style={{ padding: "13px 18px", borderRadius: 12, border: `2px solid ${monthsAway === m ? B.plum : B.border}`, background: monthsAway === m ? "#F2EAFB" : "#fff", color: monthsAway === m ? B.plum : B.text, cursor: "pointer", fontFamily: FONT, fontSize: 15.5, fontWeight: 700, textAlign: "left" }}>{l}</button>
              ))}
            </div>
          </div>
        )}

        {step === 3 && (
          <div>
            <h2 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 6px", textAlign: "center" }}>Qaysi mavzular qiyinroq?</h2>
            <p style={{ fontSize: 15, color: B.muted, marginBottom: 20, textAlign: "center" }}>Bir nechtasini tanlashingiz mumkin (ixtiyoriy)</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {domainOptions.map((d) => (
                <button key={d} onClick={() => toggleWeak(d)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 16px", borderRadius: 12, border: `2px solid ${weak.includes(d) ? B.plum : B.border}`, background: weak.includes(d) ? "#F2EAFB" : "#fff", color: weak.includes(d) ? B.plum : B.text, cursor: "pointer", fontFamily: FONT, fontSize: 15, fontWeight: 700, textAlign: "left" }}>
                  {weak.includes(d) ? <Check size={15} /> : <span style={{ width: 15 }} />} {d}
                </button>
              ))}
            </div>
          </div>
        )}

        {step === 4 && (
          <div style={{ textAlign: "center" }}>
            <Trophy size={48} color={B.gold} />
            <h2 style={{ fontSize: 23, fontWeight: 800, margin: "16px 0 16px" }}>Rejangiz tayyor, {name || "do'stim"}!</h2>
            <div style={{ background: B.bg, borderRadius: 16, padding: 18, textAlign: "left", fontSize: 15, lineHeight: 2 }}>
              <div>🎯 Maqsad ball: <b>{target}</b></div>
              <div>📅 Imtihon: <b>{examDate.toLocaleDateString("uz-UZ")}</b> atrofida</div>
              <div>⏱ Kunlik maqsad: <b>{suggestedGoal} daqiqa</b></div>
              {weak.length > 0 && <div>📌 Diqqat markazi: <b>{weak.slice(0, 2).join(", ")}{weak.length > 2 ? ` +${weak.length - 2}` : ""}</b></div>}
            </div>
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 26 }}>
          <button onClick={() => setStep((s) => Math.max(0, s - 1))} style={{ visibility: step === 0 ? "hidden" : "visible", background: "transparent", border: "none", color: B.muted, cursor: "pointer", fontFamily: FONT, fontSize: 15.5, fontWeight: 700 }}>Orqaga</button>
          {step < 4 ? (
            <button onClick={() => setStep((s) => s + 1)} style={{ background: B.plum, color: "#fff", border: "none", borderRadius: 12, padding: "11px 26px", fontSize: 15.5, fontWeight: 700, cursor: "pointer", fontFamily: FONT, display: "flex", alignItems: "center", gap: 6 }}>Keyingi <ChevronRight size={16} /></button>
          ) : (
            <button onClick={finish} style={{ background: B.green, color: "#fff", border: "none", borderRadius: 12, padding: "11px 26px", fontSize: 15.5, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Boshlash</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   PUBLIC SAT SCORE CALCULATOR (no sign-up needed, embedded on landing)
============================================================ */
function ScoreCalculator() {
  const [rwCorrect, setRwCorrect] = useState(40);
  const [mathCorrect, setMathCorrect] = useState(30);
  const rw = scaleSection(rwCorrect, 54, rwCorrect / 54 >= 0.6);
  const math = scaleSection(mathCorrect, 44, mathCorrect / 44 >= 0.6);
  return (
    <div style={{ background: "#fff", border: `1px solid ${B.border}`, borderRadius: 18, padding: 28, maxWidth: 520, margin: "0 auto" }}>
      <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 4 }}>SAT ball kalkulyatori</div>
      <div style={{ fontSize: 12.5, color: B.muted, marginBottom: 20 }}>To'g'ri javoblar sonini kiriting — taxminiy ballingizni ko'ring (ro'yxatdan o'tish shart emas)</div>
      {[["Reading & Writing", rwCorrect, setRwCorrect, 54], ["Math", mathCorrect, setMathCorrect, 44]].map(([label, val, setter, max]) => (
        <div key={label} style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 6 }}><span>{label}</span><span style={{ fontWeight: 700 }}>{val} / {max} to'g'ri</span></div>
          <input type="range" min={0} max={max} value={val} onChange={(e) => setter(Number(e.target.value))} style={{ width: "100%", accentColor: B.plum }} />
        </div>
      ))}
      <div style={{ background: B.bg, borderRadius: 12, padding: 18, textAlign: "center", marginTop: 8 }}>
        <div style={{ fontSize: 11.5, color: B.muted, marginBottom: 4 }}>TAXMINIY UMUMIY BALL</div>
        <div style={{ fontSize: 36, fontWeight: 800, color: B.plum }}>{rw + math}</div>
        <div style={{ fontSize: 12, color: B.muted, marginTop: 4 }}>R&W {rw} · Math {math}</div>
      </div>
    </div>
  );
}

const isOnboarded = () => !!(loadLocal("sws_onboarded", false) || loadLocal("sws_target_score", null));
function App() {
  const sws = useSws();
  const [view, setView] = useState(null);
  const decided = sws.ready && (!sws.session || sws.meLoaded);
  useEffect(() => { if (decided && view === null) setView(isOnboarded() ? "app" : "landing"); }, [decided]);
  useEffect(() => { const t = setTimeout(() => { SWS.meLoaded = true; swsNotify(); }, 7000); return () => clearTimeout(t); }, []);
  useEffect(() => { if (view === "onboarding" && isOnboarded()) setView("app"); });
  if (view === null) return <div style={{ minHeight: "100vh", background: B.bg }} />;
  if (view === "landing") return <div style={{ height: "100vh", overflowY: "auto" }}><Landing onStart={() => setView(isOnboarded() ? "app" : "onboarding")} /></div>;
  if (view === "onboarding") return <Onboarding onDone={() => setView("app")} />;
  return <AppShell onHome={() => setView("landing")} />;
}

// gate.js Telegram orqali kirishni tasdiqlagach "sws-auth" hodisasini yuboradi
window.addEventListener("sws-auth", (e) => swsApplyAuth(e.detail));
if (window.SWS_AUTH) swsApplyAuth(window.SWS_AUTH);
setTimeout(() => { if (!SWS.ready) swsApplyAuth({}); }, 6000); // gate ishlamasa ham sayt ochiladi
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
